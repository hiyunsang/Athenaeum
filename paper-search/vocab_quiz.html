<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>단어 맞추기 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg">
<link rel="stylesheet" href="/ui.css">
<style>
  /* 작은 팝업 창(약 380×520)에 맞춘 한 화면 구성. 무한히 이어지는 4지선다 */
  /* 창을 키우면 글자도 같이 커진다(누워서 볼 때). 기준 380px 창 = 12.7px, 폭·높이 중 작은 쪽을 따라 최대 3배 */
  html { font-size: clamp(12px, calc(min(100vw, 70vh) / 30), 38px); }
  html, body { height: 100%; }
  body { font-size: 1rem; }
  body { display: flex; flex-direction: column; background: var(--surface); }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: var(--s2); padding: 6px var(--s3); border-bottom: 1px solid var(--line); flex: none; }
  header .brand-mark { height: 18px; display: block; }
  header h1 { font-size: 1.05rem; font-weight: 600; white-space: nowrap; }
  header .ctl { flex-basis: 100%; display: flex; gap: var(--s2); }
  header .ctl select { flex: 1; min-width: 0; font-size: 0.95rem; padding: 0.15rem 0.3rem; }
  header .score { margin-left: auto; font-size: 0.95rem; color: var(--text-2); white-space: nowrap; }
  header .score b { color: var(--text); font-weight: 600; }
  #card { flex: none; padding: 1.8rem var(--s4) 1rem; text-align: center; }
  #prompt { font-size: 2.1rem; font-weight: 600; letter-spacing: -0.01em; word-break: break-word; line-height: 1.25; min-height: 33px; }
  #prompt.ko { font-size: 1.6rem; font-weight: 500; }
  #sub { font-size: 1.05rem; color: var(--text-2); margin-top: var(--s1); min-height: 18px; }
  #sub .pos { color: var(--accent); font-weight: 600; }   /* 답을 고른 뒤 품사 — 동사·형용사·부사가 한눈에 */
  #prompt.say { cursor: pointer; }
  #prompt.say:hover { color: var(--accent); }
  #choices { flex: 1; overflow: auto; border-top: 1px solid var(--line); }
  .ch { display: flex; align-items: center; gap: var(--s3); padding: 0.8rem var(--s4); border-bottom: 1px solid var(--line); cursor: pointer; font-size: 1.15rem; line-height: 1.35; }
  .ch:hover { background: var(--hover); }
  .ch .n { color: var(--text-3); font-size: 0.95rem; width: 0.8rem; flex: none; }
  .ch .t { flex: 1; min-width: 0; word-break: break-word; }
  .ch.right { color: var(--green); font-weight: 600; }
  .ch.right .n { color: var(--green); }
  .ch.wrong { color: var(--red); text-decoration: line-through; }
  .ch.dim { color: var(--text-3); }
  #choices.locked .ch { cursor: default; }
  #choices.locked .ch:hover { background: transparent; }
  #choices.locked { cursor: pointer; }
  .ch.dunno .t { color: var(--text-3); }            /* 5 모름 — 틀림과 같게 세고 정답을 보여 준다 */   /* 빈 자리를 누르면 다음 */
  #choices.locked .ch { cursor: text; }
  /* 답을 고른 뒤 보이는 예문. 높이를 고정해 두어 선택지가 밀리지 않는다 */
  #ex { flex: none; min-height: 7rem; padding: var(--s2) var(--s4); border-top: 1px solid var(--line); font-size: 1.05rem; line-height: 1.45; color: var(--text-2); }
  #ex .en { color: var(--text); }
  #ex .en b { color: var(--accent); font-weight: 600; }
  #ex .ko { margin-top: 2px; }
  #ex .pos { color: var(--text-3); font-size: 0.95rem; margin-right: var(--s2); }
  #ex .rel { margin-top: var(--s1); font-size: 0.95rem; color: var(--text-2); }
  #ex .rel .k { color: var(--text-3); margin-right: 2px; }
  #ex .rel span + span { margin-left: var(--s3); }
  footer { flex: none; display: flex; align-items: center; gap: var(--s3); padding: 0.4rem var(--s3); border-top: 1px solid var(--line); font-size: 0.95rem; color: var(--text-3); min-height: 2.4rem; }
  footer .act { padding: 0; font-size: 0.95rem; }
  footer .note { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: var(--s8) var(--s4); color: var(--text-3); text-align: center; }

  /* 책 색 입히기 (Lyceum 처럼 화면 전체를 옅게 물들이고 강조색만 바꾼다). 맞음·틀림 색은 그대로 */
  body[data-book="yellow"] { --accent: #946800; --accent-bg: #FFF1C7; --surface: #FFFDF4; --bg: #FBF6E4; --line: #EEE3C2; --hover: #FFF6DA; }
  body[data-book="green"]  { --accent: #0B7358; --accent-bg: #DDF1E6; --surface: #F8FCF9; --bg: #EDF6F0; --line: #D6E9DE; --hover: #ECF7F0; }
  body[data-book] header { border-top: 4px solid var(--accent); background: var(--accent-bg); }
  body[data-book] header h1 { color: var(--accent); }
  /* 예문에서 드래그한 낱말 담기 — 선택 바로 위에 뜨는 작은 버튼 */
  #addsel { position: fixed; z-index: 30; background: var(--accent); color: #fff; border: 0; border-radius: var(--r); padding: 0.3rem 0.6rem; font-size: 0.95rem; cursor: pointer; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  #addsel[hidden] { display: none; }
  @media (prefers-reduced-motion: no-preference) { .ch { transition: background .08s; } }
</style>
<script src="/ui.js"></script>
</head>
<body>
<header>
  <img class="brand-mark" src="/logo/mark.svg" alt="">
  <h1>단어 맞추기</h1>
  <span class="score" title="이 창을 연 뒤의 성적">맞음 <b id="ok">0</b> · 틀림 <b id="ng">0</b></span>
  <div class="ctl">
    <select id="deck" title="묶음"></select>
    <select id="tag" title="태그 (Day)"></select>
    <select id="dir" title="문제 방향"><option value="en">단어 → 뜻</option><option value="ko">뜻 → 단어</option></select>
  </div>
</header>
<div id="card">
  <div id="prompt">—</div>
  <div id="sub"></div>
</div>
<div id="choices"></div>
<div id="ex"></div>
<button id="addsel" type="button" hidden></button>
<footer>
  <span class="note" id="note">1~4 로 고르고 모르면 5, S 는 듣기, Enter 로 다음</span>
  <button class="act" id="auto" title="새 단어가 나올 때마다 읽어 줍니다">자동 듣기</button>
  <button class="act" id="skip" title="이 단어는 건너뜁니다 (Enter)">다음</button>
  <a class="act" href="/vocab" target="_blank" title="단어장 전체 화면">단어장</a>
</footer>
<script>
(function () {
  const $ = id => document.getElementById(id);
  const esc = s => String(s || "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const KEY = "vocabQuiz";                       // localStorage: { stats: {id: {r, w}}, deck, tag, dir }
  let words = [], pool = [], cur = null, locked = false, recent = [];
  let ok = 0, ng = 0;
  // ---- 발음 듣기: 브라우저 내장 음성(Web Speech). 5 키 또는 단어 클릭. 자동 듣기는 기억한다
  // 음성 목록은 비동기로 온다 — 미리 한 번 부르고 바뀌면 다시 받는다 (첫 호출에 빈 목록이 오는 크롬·엣지 특성)
  if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); }
  function speak(text) {
    if (!("speechSynthesis" in window) || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US"; u.rate = 0.92;
    const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
    const v = vs.find(v => /natural|aria|jenny|guy/i.test(v.name)) || vs.find(v => /zira|david|mark/i.test(v.name)) || vs[0];
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  }
  let pref = {};
  try { pref = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { pref = {}; }
  pref.stats = pref.stats || {};
  const savePref = () => { try { localStorage.setItem(KEY, JSON.stringify(pref)); } catch (e) {} };

  // ---- 출제 가중치: 틀린 단어는 자주, 맞힌 단어는 드물게. 최근 8개는 제외
  function weight(w) {
    const s = pref.stats[w.id] || { r: 0, w: 0 };
    return Math.max(0.25, 1 + 2 * s.w - 0.5 * s.r);
  }
  function pick() {
    const cand = pool.filter(w => !recent.includes(w.id));
    const list = cand.length ? cand : pool;
    let total = 0; const ws = list.map(w => { const x = weight(w); total += x; return x; });
    let r = Math.random() * total;
    for (let i = 0; i < list.length; i++) { r -= ws[i]; if (r <= 0) return list[i]; }
    return list[list.length - 1];
  }
  function distractors(w, n) {
    const dir = $("dir").value, key = dir === "en" ? "meaning" : "term";
    const seen = new Set([String(w[key]).trim()]);
    const out = [];
    // 같은 묶음에서 먼저 고르고, 모자라면 전체에서
    const src = [pool.filter(x => x.id !== w.id), words.filter(x => x.id !== w.id)];
    for (const arr of src) {
      const a = arr.slice().sort(() => Math.random() - 0.5);
      for (const x of a) {
        const v = String(x[key] || "").trim();
        if (!v || seen.has(v)) continue;
        seen.add(v); out.push(x);
        if (out.length >= n) return out;
      }
    }
    return out;
  }
  function next() {
    locked = false; $("choices").classList.remove("locked");
    if (!pool.length) {
      $("prompt").textContent = "—"; $("sub").textContent = "";
      $("choices").innerHTML = "<div class='empty'>" + ($("tag").value === REVIEW ? "복습할 단어가 없습니다 — 다 외웠어요" : "이 조건에 단어가 없습니다") + "</div>"; return;
    }
    cur = pick();
    recent.push(cur.id); if (recent.length > 8) recent.shift();
    const dir = $("dir").value;
    $("prompt").textContent = dir === "en" ? cur.term : cur.meaning;
    $("prompt").className = dir === "en" ? "" : "ko";
    // 품사는 답을 고른 뒤 예문 줄에 보인다 — 미리 보이면 선택지가 좁혀지는 힌트가 된다. 발음 기호는 힌트가 아니라 단어와 같이
    $("sub").textContent = dir === "en" ? (cur.ipa || "") : "";
    $("prompt").classList.toggle("say", dir === "en");
    if (pref.auto && dir === "en") speak(cur.term);
    const opts = distractors(cur, 3).concat([cur]).sort(() => Math.random() - 0.5);
    $("choices").innerHTML = opts.map((w, i) =>
      "<div class='ch' data-id='" + esc(w.id) + "'><span class='n'>" + (i + 1) + "</span><span class='t'>" + esc(dir === "en" ? w.meaning : w.term) + "</span></div>").join("") +
      "<div class='ch dunno' data-id='__dunno'><span class='n'>5</span><span class='t'>모름</span></div>";
    $("note").textContent = HINT;
    $("ex").innerHTML = "";
  }
  // 예문 안의 그 단어(활용형 포함)를 강조
  function markTerm(en, term) {
    const stem = term.split(/\s+/)[0].replace(/[^a-z]/gi, "");
    if (!stem || stem.length < 3) return esc(en);
    const re = new RegExp("\\b(" + stem.slice(0, Math.max(3, stem.length - 2)) + "[a-z]*)", "gi");
    return esc(en).replace(re, "<b>$1</b>");
  }
  function answer(id) {
    if (locked || !cur) return;
    locked = true; $("choices").classList.add("locked");
    const s = pref.stats[cur.id] = pref.stats[cur.id] || { r: 0, w: 0 };
    const right = id === cur.id, dunno = id === "__dunno";
    if (right) { ok++; s.r++; s.streak = (s.streak || 0) + 1; } else { ng++; s.w++; s.streak = 0; }
    savePref();
    // 복습 모드에서 연속 2번 맞힌 단어는 이번 판에서 뺀다
    if ($("tag").value === REVIEW && !weak(cur)) pool = pool.filter(w => w.id !== cur.id);
    paintReviewCount();
    $("ok").textContent = ok; $("ng").textContent = ng;
    document.querySelectorAll(".ch").forEach(el => {
      const eid = el.dataset.id;
      if (eid === cur.id) el.classList.add("right");
      else if (eid === id) el.classList.add(dunno ? "dim" : "wrong");
      else el.classList.add("dim");
    });
    const extra = cur.note ? " · " + cur.note : "";
    $("note").textContent = (right ? "맞음" : (dunno ? "모름 — " : "틀림 — ") + (($("dir").value === "en") ? cur.meaning : cur.term)) + extra + " · Enter 로 다음";
    if ($("dir").value === "ko" && pref.auto) speak(cur.term);
    $("sub").innerHTML = esc(cur.ipa || "") + (cur.pos ? (cur.ipa ? " · " : "") + "<b class='pos'>" + esc(cur.pos) + "</b>" : "");
    const ex = (cur.examples || [])[0];
    const rel = [];
    if (cur.syn && cur.syn.length) rel.push("<span><i class='k'>≈</i>" + esc(cur.syn.join(", ")) + "</span>");
    if (cur.ant && cur.ant.length) rel.push("<span><i class='k'>≠</i>" + esc(cur.ant.join(", ")) + "</span>");
    if (cur.family && cur.family.length) rel.push("<span><i class='k'>파생</i>" + esc(cur.family.map(f => f.w + (f.pos ? "(" + f.pos + ")" : "")).join(", ")) + "</span>");
    $("ex").innerHTML = (rel.length ? "<div class='rel'>" + rel.join("") + "</div>" : "") +
      (ex && ex.en ? "<span class='en'>" + markTerm(ex.en, cur.term) + "</span>" + (ex.ko ? "<div class='ko'>" + esc(ex.ko) + "</div>" : "") : "");
    // 자동으로 넘기지 않는다 — 예문·품사를 읽을 시간은 사용자가 정한다 (Enter·스페이스·클릭)
  }
  // ---- 복습: 틀렸거나 '모름' 한 적이 있고, 그 뒤 연속 2번 맞히지 못한 단어
  const REVIEW = "__review";
  const HINT = "1~4 로 고르고 모르면 5, S 는 듣기, Enter 로 다음";
  function weak(w) { const s = pref.stats[w.id]; return !!s && s.w > 0 && (s.streak || 0) < 2; }
  function paintReviewCount() {
    const o = $("tag").querySelector("option[value='" + REVIEW + "']");
    if (!o) return;
    const dk = $("deck").value;
    o.textContent = "복습할 것 (" + words.filter(w => (!dk || w.deck === dk) && weak(w)).length + ")";
  }
  function bookOf(deck) { return /노랭/.test(deck || "") ? "yellow" : /초록/.test(deck || "") ? "green" : ""; }
  function rebuild() {
    const dk = $("deck").value, tg = $("tag").value;
    if (bookOf(dk)) document.body.dataset.book = bookOf(dk); else delete document.body.dataset.book;
    pool = words.filter(w => w.term && w.meaning && (!dk || w.deck === dk) &&
      (tg === REVIEW ? weak(w) : (!tg || (w.tags || []).includes(tg))));
    paintReviewCount();
    pref.deck = dk; pref.tag = tg; pref.dir = $("dir").value; savePref();
    recent = []; next();
  }
  function fill(sel, items, first, want) {
    sel.innerHTML = "<option value=''>" + first + "</option>" + items.map(x => "<option" + (x === want ? " selected" : "") + ">" + esc(x) + "</option>").join("");
  }
  async function load() {
    const d = await (await fetch("/api/vocab")).json();
    words = (d.words || []).filter(w => w.term && w.meaning);
    const decks = [...new Set(words.map(w => w.deck).filter(Boolean))].sort();
    const tags = [...new Set(words.flatMap(w => w.tags || []))].sort();
    fill($("deck"), decks, "모든 묶음", pref.deck || (decks.includes("노랭이 보카") ? "노랭이 보카" : ""));
    fill($("tag"), tags, "모든 태그", pref.tag || "");
    $("tag").insertBefore(new Option("복습할 것", REVIEW), $("tag").options[1]);
    if (pref.tag === REVIEW) $("tag").value = REVIEW;
    if (pref.dir) $("dir").value = pref.dir;
    rebuild();
  }
  ["deck", "tag", "dir"].forEach(id => $(id).onchange = rebuild);
  $("choices").addEventListener("click", e => {
    if (locked) {
      // 답을 고른 뒤: 선택지 4 아래 빈 자리만 '다음'. 선택지 글이나 예문을 드래그해 읽는 건 넘기지 않는다
      if (e.target === e.currentTarget && !String(window.getSelection()).trim()) next();
      return;
    }
    const el = e.target.closest(".ch"); if (el) answer(el.dataset.id);
  });
  $("skip").onclick = () => { locked = false; next(); };

  // ---- 예문에서 드래그한 낱말을 단어장에 담기
  let selTerm = "";
  function hideAdd() { $("addsel").hidden = true; selTerm = ""; }
  function checkSelection() {
    const sel = window.getSelection();
    const txt = String(sel).replace(/\s+/g, " ").trim().replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, "");
    const en = document.querySelector("#ex .en");
    if (!txt || !en || !sel.rangeCount || !en.contains(sel.anchorNode) || !en.contains(sel.focusNode) ||
        txt.split(" ").length > 4 || !/^[A-Za-z][A-Za-z' -]*$/.test(txt)) { hideAdd(); return; }
    selTerm = txt;
    const r = sel.getRangeAt(0).getBoundingClientRect(), b = $("addsel");
    b.textContent = "‘" + txt + "’ 담기";
    b.hidden = false;
    const bw = b.offsetWidth, bh = b.offsetHeight;
    b.style.left = Math.max(4, Math.min(innerWidth - bw - 4, r.left + r.width / 2 - bw / 2)) + "px";
    b.style.top = Math.max(4, r.top - bh - 6) + "px";
  }
  document.addEventListener("mouseup", e => { if (e.target.id !== "addsel") setTimeout(checkSelection, 0); });
  document.addEventListener("selectionchange", () => { if (!String(window.getSelection()).trim()) hideAdd(); });
  $("addsel").addEventListener("mousedown", e => e.preventDefault());   // 누를 때 선택이 풀리지 않게
  $("addsel").onclick = async () => {
    const term = selTerm; if (!term) return;
    const exNow = (cur && (cur.examples || [])[0]) || {};
    hideAdd(); window.getSelection().removeAllRanges();
    $("note").textContent = "‘" + term + "’ 뜻 찾는 중… (10초쯤)";
    try {
      const r = await (await fetch("/api/vocab/add_word", { method: "POST",
        body: JSON.stringify({ term: term, deck: $("deck").value || "시험단어", en: exNow.en || "", ko: exNow.ko || "" }) })).json();
      if (r.error) { $("note").textContent = r.error; return; }
      const w = r.word || {};
      if (r.new && w.term && w.meaning) { words.push(w); }
      $("note").textContent = (r.new ? "담았습니다: " : "이미 있습니다: ") + (w.term || term) + " — " + (w.meaning || "") + " · Enter 로 다음";
    } catch (e) { $("note").textContent = "담지 못했습니다"; }
  };
  $("prompt").onclick = () => { if (cur && ($("dir").value === "en" || locked)) speak(cur.term); };
  function paintAuto() { $("auto").textContent = pref.auto ? "자동 듣기 켬" : "자동 듣기"; $("auto").style.color = pref.auto ? "var(--accent)" : ""; }
  $("auto").onclick = () => { pref.auto = !pref.auto; savePref(); paintAuto(); if (pref.auto && cur) speak(cur.term); };
  paintAuto();
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "s" || e.key === "S" || e.key === "0" || e.key === "ㄴ") { if (cur && ($("dir").value === "en" || locked)) speak(cur.term); e.preventDefault(); return; }
    if (e.key >= "1" && e.key <= "5") { const el = document.querySelectorAll(".ch")[+e.key - 1]; if (el) answer(el.dataset.id); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === " ") { locked = false; next(); e.preventDefault(); }
  });
  load().catch(() => { $("choices").innerHTML = "<div class='empty'>단어장을 불러오지 못했습니다</div>"; });
})();
</script>
</body>
</html>
