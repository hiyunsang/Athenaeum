<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>관련맵 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png"><link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="stylesheet" href="/ui.css">
<script src="/ui.js"></script>
<script src="/map.js"></script>
<style>
  #bar { min-height: 36px; background: var(--surface); border-bottom: 1px solid var(--line-2); padding: 6px var(--s3); font-size: 12px; color: var(--text-2); display: flex; align-items: center; gap: var(--s2); flex-wrap: wrap; }
  #bar b { color: var(--text); font-weight: 600; }
  #bar .t { font-family: var(--font-serif); font-size: 14px; color: var(--text); }
  #bar .act { margin-left: auto; }
  #rmap { margin: 0 4px; }
  #extra { max-width: 1100px; margin: var(--s4) 16px var(--s8); font-size: 12px; }
  #extra .gh { padding: 10px 0 4px; color: var(--text); font-weight: 600; border-bottom: 1px solid var(--line-2); }
  #extra .gh span { color: var(--text-3); font-weight: 400; margin-left: 6px; }
  .prow { padding: 8px 0 9px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .prow:hover { background: var(--hover); }
  .pt { font-family: var(--font-serif); font-size: 14px; color: var(--text); line-height: 1.35; margin-bottom: 2px; }
  .pm { color: var(--text-2); line-height: 1.4; }
  .pm b { color: var(--text-2); font-weight: 600; }
</style>
</head>
<body>
<div id="bar"><b>관련맵</b> <span class="t" id="seedTitle"></span> <span id="status"></span><a class="act" href="javascript:history.back()">← 목록으로</a></div>
<div id="rmap"><div class="hint" style="padding:16px">불러오는 중…</div></div>
<div id="extra"></div>
<script>
const file = new URLSearchParams(location.search).get("file");
function openPaper(n) {
  if (n.owned) fetch("/api/open", { method: "POST", body: JSON.stringify({ file: n.owned }) });
  else if (n.doi) window.open(n.doi);
}
function extraRow(n, metaText) {
  const row = document.createElement("div"); row.className = "prow";
  row.innerHTML = "<div class='pt'>" + mapEscH(n.title) + "</div><div class='pm'>" + mapEscH(n.author || "?") + " · " + (n.year || "?") + (n.venue ? " · " + mapEscH(n.venue) : "") +
    " · 피인용 <b>" + n.cit + "</b> · " + metaText + (n.owned ? " · <b style='color:var(--accent)'>보유</b>" : "") + "</div>";
  row.onclick = () => openPaper(n);
  return row;
}
function buildExtraSections(prior, derived) {   // 뿌리 논문·후속 논문 — 맵 아래 목록
  const box = document.getElementById("extra"); box.innerHTML = "";
  const mk = (title, desc, n) => { const h = document.createElement("div"); h.className = "gh"; h.innerHTML = mapEscH(title) + "<span>" + n + "편 · " + mapEscH(desc) + "</span>"; box.appendChild(h); };
  if (prior.length) { mk("뿌리 논문 (Prior works)", "이 맵의 논문들이 공통으로 인용하는 조상 논문", prior.length); for (const n of prior) box.appendChild(extraRow(n, "맵 논문 " + n.inter + "편이 인용")); }
  if (derived.length) { mk("후속 논문 (Derivative works)", "이 맵의 논문 여러 편을 인용하는 후속 논문 — 리뷰 후보", derived.length); for (const n of derived) box.appendChild(extraRow(n, "맵 논문 " + n.inter + "편을 인용")); }
}
fetch("/api/mapdata?file=" + encodeURIComponent(file)).then(r => r.json()).then(d => {
  const host = document.getElementById("rmap");
  if (!d || !d.nodes || !d.nodes.length) { host.innerHTML = "<div class='hint' style='padding:16px'>" + mapEscH((d && d.error) || "맵 데이터가 없습니다") + "</div>"; return; }
  const nodes = d.nodes.map(n => Object.assign({}, n, { g: 0 }));
  const N = nodes.length;
  let sims = d.sims || null;
  if (sims) {   // 유사도 정규화 (상위 5% 값 기준) — 군집이 뚜렷해지게
    const flat = [];
    for (let i = 0; i < N; i++) for (let j = i + 1; j < N; j++) if (sims[i][j] > 0) flat.push(sims[i][j]);
    flat.sort((a, b) => b - a);
    const hi = flat[Math.floor(flat.length * 0.05)] || 1;
    sims = sims.map(row => row.map(v => Math.min(1, v / hi)));
  } else {
    sims = nodes.map(() => new Array(N).fill(0));
    for (const [i, j, w] of d.edges) sims[i][j] = sims[j][i] = Math.min(1, (w || 1) / 10);
  }
  const edges = (d.edges || []).map(([i, j, w]) => [i, j, 1, sims[i][j]]);   // 관련맵의 선 = 공통 참고문헌
  const seed = nodes.find(n => n.seed);
  document.getElementById("seedTitle").textContent = seed ? seed.title : "";
  document.getElementById("status").textContent = "· 표시 " + (N - 1) + "편 / 후보 " + (d.pool || "?") + "편 분석 · 참고문헌 " + (d.refs || 0) + " · 피인용 " + (d.citers || 0);
  renderResultMap({ nodes, edges, sims, groups: ["관련 논문"], cocitation: false }, host, {
    fixedColor: "year", noCohesion: true, storagePrefix: "relmap_", openPaper,
    height: Math.max(520, (window.innerHeight || 800) - 150),
    hint: "휠로 확대·축소, 빈 곳을 끌어 이동. 관계가 많은 논문일수록 가운데. 굵은 검은 테두리 = 시드(기준) 논문. 원을 누르면 오른쪽에 자세히(초록·요약·번역).",
    legendHint: "원 크기 = 피인용 · 옅음 = 오래됨, 진함 = 최근 · 선 = 공통 참고문헌(진할수록 많음) · 파란 테두리 = 보유 · 점선 테두리 = Review · 굵은 검은 테두리 = 시드 논문",
  });
  buildExtraSections(d.prior || [], d.derived || []);
});
</script>
</body>
</html>
