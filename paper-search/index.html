<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Paperdesk</title>
<link rel="stylesheet" href="/ui.css">
<style>
  header { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s4); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  /* 워드마크: 세리프 이탤릭 */
  header h1 { font-family: var(--font-serif); font-style: italic; font-size: 18px; font-weight: 400; letter-spacing: .005em; margin-right: var(--s2); color: var(--text); }
  header input[type=text] { width: 280px; background: var(--bg); border-color: transparent; padding: 5px 10px; }
  header input[type=text]:focus { background: var(--surface); border-color: var(--accent); }
  header select { border-color: transparent; background: transparent; color: var(--text-2); padding: 4px 2px; }
  .toggle { font-size: 12px; color: var(--text-quiet); user-select: none; cursor: pointer; }
  .toggle:hover { color: var(--text); }
  #summary { margin-left: auto; font-size: 12px; color: var(--text-3); }
  #chips { padding: var(--s1) var(--s4) 0; display: flex; flex-wrap: wrap; gap: var(--s1); min-height: 6px; }
  #layout { display: flex; }
  #side { width: 232px; min-width: 232px; padding: var(--s2) var(--s2) var(--s8) var(--s3); height: calc(100vh - 84px); overflow-y: auto; background: var(--panel); border-right: 1px solid var(--line-2); }
  .group h3 { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); margin: var(--s4) 0 var(--s1); }
  .lbl { display: flex; justify-content: space-between; padding: 2px 6px; border-radius: 0; cursor: pointer; line-height: 1.6; }
  .lbl:hover { background: var(--hover); }
  .lbl.on { box-shadow: inset 3px 0 0 var(--accent); background: var(--sel-bg); color: var(--accent); font-weight: 600; }
  .lbl.zero { color: var(--text-3); }
  .lbl .n { color: var(--text-3); font-size: 12px; min-width: 3ch; text-align: right; }
  .lbl.on .n { color: var(--accent); }
  .mparent { display: flex; justify-content: space-between; padding: 2px 6px; cursor: pointer; font-weight: 600; color: var(--text); line-height: 1.6; }
  .mparent:hover { background: var(--hover); }
  .mparent .n { color: var(--text-3); font-size: 12px; min-width: 3ch; text-align: right; font-weight: 400; }
  .jlist { max-height: 138px; overflow-y: auto; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
  #main { flex: 1; padding: 0 0 var(--s8); height: calc(100vh - 84px); overflow-y: auto; background: var(--surface); }
  /* 논문 행: 카드 아님. 10~11px 상하 여백 + 1px 구분선으로 '한 단위'가 보이게 */
  .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--s2); align-items: start;
         padding: 10px 12px 11px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .row:hover { background: var(--hover); }
  .row.sel { box-shadow: inset 3px 0 0 var(--accent); background: var(--sel-bg); }
  .row .acts { grid-column: 2; grid-row: 1; display: flex; gap: var(--s2); white-space: nowrap; margin: -6px -8px 0 0; }
  .row .meta { grid-column: 1; grid-row: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }  /* 좁아도 동작 칸을 밀지 않고 말줄임 */
  .row .title { grid-column: 1 / -1; grid-row: 2; }
  .row .tags { grid-column: 1 / -1; grid-row: 3; }
  .meta { font-size: 12px; color: var(--text-2); line-height: 1.4; }
  .meta b { color: var(--text-2); font-weight: 600; }
  .title { font-family: var(--font-serif); font-size: 15px; font-weight: 400; line-height: 1.35; color: var(--text); margin: 2px 0 3px; }
  .title span { color: var(--text-2); font-weight: 400; }
  .tags { font-size: 12px; color: var(--text-2); line-height: 1.55; }
  .tag { display: inline; }
  .tag + .tag::before { content: " · "; color: var(--text-3); }
  .tag.sug { color: var(--amber); }
  /* 동작 텍스트: 버튼 상자 없음. 기본은 흐린 회색(콘텐츠와 다른 층), 행 hover 시 진해지고, 실제 가리킨 동작만 파랑+밑줄.
     칸 폭(min-width) 고정 → 요약/번역/관련맵/라벨 편집이 모든 행에서 같은 x 위치. 클릭 영역 높이 ~30px */
  .editbtn { background: none; border: 0; color: var(--text-quiet); padding: 7px 8px; min-width: 76px; text-align: left; cursor: pointer; font-size: 12px; line-height: 1.3; border-radius: 0; }
  /* 이미 만들어진 것(요약 보기·번역 보기·관련맵 보기)은 파랑 = 열 수 있음. 아직 없는 것은 흐린 회색 */
  .editbtn.ready, .row:hover .editbtn.ready { color: var(--accent); font-weight: 500; }
  .row:hover .editbtn { color: var(--text); }
  .editbtn:hover, .row:hover .editbtn:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .editbtn.warn, .row:hover .editbtn.warn { color: var(--red); }
  .editbtn:disabled, .row:hover .editbtn:disabled { color: var(--text-3); text-decoration: none; cursor: default; }
  #drawer { display: none; width: 300px; min-width: 300px; border-left: 1px solid var(--line-2); background: var(--panel); padding: var(--s3) var(--s3) var(--s8); height: calc(100vh - 84px); overflow-y: auto; }
  #drawer.open { display: block; }
  #drawer h2 { font-family: var(--font-serif); font-size: 15px; font-weight: 400; margin-bottom: var(--s2); line-height: 1.35; }
  #drawer .group h3 { margin-top: var(--s3); }
  /* 라벨 편집 토글: 상자 나열(칩 수프) 대신 글자 토글. 켜진 것만 파랑(선택), 제안은 앰버 */
  .dlbl { display: inline-block; margin: 1px 2px 1px 0; padding: 2px 6px; border-radius: var(--r); font-size: 12px; line-height: 1.4; cursor: pointer; color: var(--text-2); }
  .dlbl:hover { background: var(--hover); color: var(--text); }
  .dlbl.on { background: var(--sel-bg); color: var(--accent); font-weight: 600; }
  .dlbl.sug { color: var(--amber); text-decoration: underline dotted; text-underline-offset: 3px; }
  .dlbl.sug:hover { background: var(--amber-bg); color: var(--amber); }
  .addlbl { margin-top: var(--s1); display: flex; gap: var(--s1); }
  .addlbl input { flex: 1; padding: 2px 6px; font-size: 12px; }
  .hint { font-size: 12px; color: var(--text-3); margin: var(--s1) 0; }
  #closeDrawer { float: right; cursor: pointer; color: var(--text-3); font-size: 14px; }
  #explorePane { width: 0; min-width: 0; overflow: hidden; display: flex; flex: none; height: calc(100vh - 84px); border-left: 1px solid var(--line-2); background: var(--surface); transition: width .18s ease; }
  /* 라벨 편집 서랍이 열리면 탐색 창을 줄여 가운데 목록이 최소 ~400px는 남게 */
  #drawer.open ~ #explorePane { max-width: calc(100vw - 232px - 300px - 400px); }
  #splitter { width: 5px; flex: none; cursor: col-resize; background: var(--line); }
  #splitter:hover { background: var(--line-2); }
  #exploreFrame { flex: 1; border: 0; height: 100%; min-width: 0; }
  body.dragging #exploreFrame { pointer-events: none; }
  body.dragging #explorePane { transition: none; }
</style>
</head>
<body>
<header>
  <h1>Paperdesk</h1>
  <a href="#" id="exploreToggle" class="toggle act" title="주제 키워드로 세상의 논문 찾기 - 화면이 좌우로 갈라집니다">논문 탐색</a>
  <a href="/explore" target="maeng_explore" class="toggle act" title="탐색을 새 탭으로 열기">↗</a>
  <input type="text" id="ft" placeholder="본문 검색 (Enter) - PDF 안 단어 검색">
  <label class="toggle"><input type="checkbox" id="incSug" checked> 제안 라벨 포함</label>
  <label class="toggle"><input type="checkbox" id="onlyUntagged"> 미분류만</label>
  <label class="toggle">정렬 <select id="sortSel">
    <option value="year">연도순</option>
    <option value="added">최신 추가순</option>
  </select></label>
  <span id="oastatus" class="toggle act" title="관련맵에 쓰는 OpenAlex 서비스 상태 (클릭하면 다시 확인)">맵 서비스 확인 중…</span>
  <div id="summary"></div>
</header>
<div id="chips"></div>
<div id="layout">
  <div id="side"></div>
  <div id="main"></div>
  <div id="drawer"></div>
  <div id="explorePane"><div id="splitter" title="드래그해서 크기 조절"></div><iframe id="exploreFrame" src="about:blank"></iframe></div>
</div>
<script>
let papers = [], groups = {}, selected = [], selectedJournals = [], ftQuery = "", ftFiles = null, editing = null;

async function loadData() {
  const r = await fetch("/api/data");
  const d = await r.json();
  papers = d.papers; groups = d.groups;
  render();
}

function paperLabels(p) {
  return document.getElementById("incSug").checked ? p.labels.concat(p.suggested) : p.labels;
}

function baseFiltered() {
  const untag = document.getElementById("onlyUntagged").checked;
  return papers.filter(p => {
    if (untag && p.labels.length > 0) return false;
    if (ftFiles && !ftFiles.has(p.file)) return false;
    const ls = paperLabels(p);
    return selected.every(s => ls.includes(s));
  });
}

function filtered() {
  const b = baseFiltered();
  return selectedJournals.length ? b.filter(p => selectedJournals.includes(p.journal || "?")) : b;
}

function render() {
  const base = baseFiltered();
  const cur = filtered();
  document.getElementById("summary").textContent =
    "검색 결과 " + cur.length + "편 / 전체 " + papers.length + "편";

  const chips = document.getElementById("chips");
  chips.innerHTML = "";
  for (const j of selectedJournals) {
    const c = document.createElement("div");
    c.className = "chip jn"; c.textContent = j;
    const x = document.createElement("span"); x.textContent = "×";
    c.appendChild(x);
    c.onclick = () => { selectedJournals = selectedJournals.filter(v => v !== j); render(); };
    chips.appendChild(c);
  }
  for (const s of selected) {
    const c = document.createElement("div");
    c.className = "chip"; c.textContent = s;
    const x = document.createElement("span"); x.textContent = "×";
    c.appendChild(x);
    c.onclick = () => { selected = selected.filter(v => v !== s); render(); };
    chips.appendChild(c);
  }
  if (ftFiles) {
    const c = document.createElement("div");
    c.className = "chip ft"; c.textContent = "본문: " + ftQuery;
    const x = document.createElement("span"); x.textContent = "×";
    c.appendChild(x);
    c.onclick = () => { ftFiles = null; ftQuery = ""; document.getElementById("ft").value = ""; render(); };
    chips.appendChild(c);
  }

  const side = document.getElementById("side");
  side.innerHTML = "";

  const jcounts = {};
  for (const p of base) { const j = p.journal || "?"; jcounts[j] = (jcounts[j] || 0) + 1; }
  const jg = document.createElement("div"); jg.className = "group";
  const jh = document.createElement("h3"); jh.textContent = "저널"; jg.appendChild(jh);
  const jlist = document.createElement("div"); jlist.className = "jlist";
  const jorder = Object.entries(jcounts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0]));
  for (const [j, cnt] of jorder) {
    const el = document.createElement("div");
    el.className = "lbl" + (selectedJournals.includes(j) ? " on" : "");
    el.innerHTML = "<span>" + j + "</span><span class='n'>" + cnt + "</span>";
    el.onclick = () => {
      if (selectedJournals.includes(j)) selectedJournals = selectedJournals.filter(v => v !== j);
      else selectedJournals.push(j);
      render();
    };
    jlist.appendChild(el);
  }
  jg.appendChild(jlist);
  side.appendChild(jg);

  const cnt = (lb) => selected.includes(lb)
    ? cur.length
    : cur.filter(p => paperLabels(p).includes(lb)).length;

  for (const [gname, labels] of Object.entries(groups)) {
    const g = document.createElement("div"); g.className = "group";
    const h = document.createElement("h3"); h.textContent = gname; g.appendChild(h);
    if (gname === "재료") {
      const assigned = new Set(MATERIAL_TREE.flatMap(treeLeaves));
      const extras = labels.filter(lb => !assigned.has(lb));
      const known = new Set(labels.concat(extras));
      const renderNode = (node, depth) => {
        if (typeof node === "string") {
          if (!known.has(node)) return;
          const row = labelRow(node, cnt(node));
          row.style.marginLeft = (depth * 16) + "px";
          g.appendChild(row);
          return;
        }
        const kids = node.kids;
        const leaves = kids.flatMap(treeLeaves).filter(k => known.has(k));
        if (!leaves.length) return;
        const pcount = cur.filter(p => leaves.some(k => paperLabels(p).includes(k))).length;
        const open = matOpen[node.name] || leaves.some(k => selected.includes(k));
        const ph = document.createElement("div");
        ph.className = "mparent";
        ph.style.marginLeft = (depth * 16) + "px";
        ph.innerHTML = "<span>" + (open ? "▾ " : "▸ ") + node.name + "</span><span class='n'>" + pcount + "</span>";
        ph.onclick = () => { matOpen[node.name] = !open; render(); };
        g.appendChild(ph);
        if (open) for (const k of kids) renderNode(k, depth + 1);
      };
      for (const node of MATERIAL_TREE) renderNode(node, 0);
      for (const lb of extras) renderNode(lb, 0);  // 아직 분류 안 된 새 재료
    } else {
      for (const lb of labels) g.appendChild(labelRow(lb, cnt(lb)));
    }
    side.appendChild(g);
  }

  const main = document.getElementById("main");
  main.innerHTML = "";
  const mode = document.getElementById("sortSel").value;
  const sorted = cur.slice().sort((a, b) =>
    mode === "added" ? (b.added || 0) - (a.added || 0)
                     : (b.year || "0").localeCompare(a.year || "0"));
  for (const p of sorted) {
    const row = document.createElement("div"); row.className = "row" + (editing === p.file ? " sel" : "");
    row.dataset.file = p.file;
    const btn = document.createElement("button");
    btn.className = "editbtn"; btn.textContent = "라벨 편집";
    btn.onclick = (e) => { e.stopPropagation(); openDrawer(p.file); };
    // 동작 묶음 (표시 순서: 요약 · 번역 · 관련맵 · 라벨 편집) — 제목 줄과 겹치지 않게 첫 줄 오른쪽 칸에 둠
    const acts = document.createElement("div"); acts.className = "acts";
    acts.appendChild(genButton(p, "summary", "요약", p.has_summary));
    acts.appendChild(genButton(p, "translation", "번역", p.has_translation));
    acts.appendChild(genButton(p, "map", "관련맵", p.has_map));
    acts.appendChild(btn);
    row.appendChild(acts);
    const meta = document.createElement("div"); meta.className = "meta";
    let addedTxt = "";
    if (mode === "added" && p.added) {
      const dt = new Date(p.added * 1000);
      addedTxt = " · 추가 " + (dt.getMonth() + 1) + "/" + dt.getDate();
    }
    meta.innerHTML = (p.year || "-") + " · <b>" + (p.journal || "-") + "</b> · " + (p.author || "-") + addedTxt;
    row.appendChild(meta);
    const t = document.createElement("div"); t.className = "title"; t.textContent = p.title;
    if (p.has_notes) { const nb = document.createElement("span"); nb.textContent = " · 메모"; nb.title = "메모/질문 기록 있음"; nb.style.fontSize = "12px"; t.appendChild(nb); }
    row.appendChild(t);
    const tags = document.createElement("div"); tags.className = "tags";
    for (const lb of p.labels) { const s = document.createElement("span"); s.className = "tag"; s.textContent = lb; tags.appendChild(s); }
    for (const lb of p.suggested) { const s = document.createElement("span"); s.className = "tag sug"; s.textContent = lb + "?"; tags.appendChild(s); }
    row.appendChild(tags);
    row.onclick = () => fetch("/api/open", { method: "POST", body: JSON.stringify({ file: p.file }) });
    main.appendChild(row);
  }
  if (editing) renderDrawer();
}

const polling = {};
const stages = {};

// 재료 라벨의 계층 분류 (문자열 = 라벨, {name, kids} = 접히는 분류. 몇 단이든 가능)
// 여기 없는 새 재료 라벨은 자동으로 '기타'에 들어감
const MATERIAL_TREE = [
  { name: "금속", kids: ["Aluminum", "Al6061", "Copper", "Titanium", "Ti6Al4V", "Steel",
    "AISI 1045", "Stainless steel", "SUS304", "Nickel-based alloy", "Inconel 718", "Tantalum"] },
  { name: "세라믹", kids: [
      { name: "Soft-brittle", kids: ["Soft-brittle", "ZnSe", "KDP", "CaF2", "Germanium"] },
      "Silicon", "Sapphire", "Glass", "Ceramic"] },
  "Composite"
];
let matOpen = {};

function treeLeaves(node) {
  return typeof node === "string" ? [node] : node.kids.flatMap(treeLeaves);
}

function labelRow(lb, cnt) {
  const el = document.createElement("div");
  el.className = "lbl" + (selected.includes(lb) ? " on" : "") + (cnt === 0 ? " zero" : "");
  el.innerHTML = "<span>" + lb + "</span><span class='n'>" + cnt + "</span>";
  el.onclick = () => {
    if (selected.includes(lb)) selected = selected.filter(v => v !== lb);
    else if (cnt > 0) selected.push(lb);
    else return;
    render();
  };
  return el;
}

function viewUrl(p, kind) {
  if (kind === "map") return "/mapview?file=" + encodeURIComponent(p.file);
  return "/view?file=" + encodeURIComponent(p.file) + "&kind=" + kind;
}

function fmtElapsed(sec) {
  if (sec == null) return "";
  return sec < 90 ? sec + "초" : Math.round(sec / 60) + "분";
}

function startPolling(p, kind, key) {
  if (polling[key]) return;
  polling[key] = setInterval(async () => {
    const s = await (await fetch("/api/genstatus?file=" + encodeURIComponent(p.file) + "&kind=" + kind)).json();
    if (s.status === "done") {
      clearInterval(polling[key]); delete polling[key]; delete stages[key];
      if (kind === "summary") p.has_summary = true;
      else if (kind === "translation") p.has_translation = true;
      else p.has_map = true;
      delete (p.jobs || {})[kind];
      render();
      window.open(viewUrl(p, kind));
    } else if (s.status === "error") {
      clearInterval(polling[key]); delete polling[key]; delete stages[key];
      p.jobs = p.jobs || {}; p.jobs[kind] = s;
      render();
    } else if (s.status === "running") {
      p.jobs = p.jobs || {}; p.jobs[kind] = s;
      const txt = (s.waiting ? "대기 " : "") + fmtElapsed(s.elapsed);
      if (stages[key] !== txt) { stages[key] = txt; render(); }
    } else {  // none: 서버가 재시작되어 작업이 사라짐
      clearInterval(polling[key]); delete polling[key]; delete stages[key];
      p.jobs = p.jobs || {}; p.jobs[kind] = { status: "error", error: "작업이 사라졌습니다 (서버 재시작?) - 다시 눌러 주세요" };
      render();
    }
  }, 5000);
}

function genButton(p, kind, label, ready) {
  const b = document.createElement("button");
  b.className = "editbtn";
  const key = p.file + "|" + kind;
  const job = (p.jobs || {})[kind];
  if (job && job.status === "running") {  // 서버가 기억하는 진행 상태 (새로고침해도 유지)
    const openable = kind !== "map";
    b.textContent = label + (job.waiting ? " 대기중" : " 생성중") + " " + fmtElapsed(job.elapsed) + (openable ? " ▸열기" : "");
    b.title = (job.stage || "") + (openable ? "\n클릭하면 완성된 부분부터 볼 수 있습니다" : "");
    b.disabled = !openable;
    if (openable) b.onclick = (e) => { e.stopPropagation(); window.open(viewUrl(p, kind)); };
    startPolling(p, kind, key);
    return b;
  }
  if (job && job.status === "error") {
    b.textContent = label + " 실패 ⚠";
    b.classList.add("warn");
    b.title = (job.error || "원인 불명") + "\n클릭하면 다시 시도";
    b.onclick = async (e) => {
      e.stopPropagation();
      if (!confirm(label + " 생성에 실패했습니다:\n" + (job.error || "원인 불명") + "\n\n다시 시도할까요?")) return;
      delete p.jobs[kind];
      await fetch("/api/generate", { method: "POST", body: JSON.stringify({ file: p.file, kind }) });
      p.jobs[kind] = { status: "running", elapsed: 0 };
      startPolling(p, kind, key); render();
    };
    return b;
  }
  b.textContent = ready ? label + " 보기" : label;
  if (ready) b.classList.add("ready");
  b.onclick = async (e) => {
    e.stopPropagation();
    if (ready) { window.open(viewUrl(p, kind)); return; }
    const msg = kind === "map"
      ? "관련 논문 맵을 생성할까요?\n(무료 학술 DB 사용, 1~2분. 구독 사용량 안 씀)"
      : (kind === "summary" ? "요약" : "전문 번역") + "을 생성할까요?\n(Claude 구독 사용량을 씁니다. 요약 ~1분, 번역 3~10분)";
    if (!confirm(msg)) return;
    await fetch("/api/generate", { method: "POST", body: JSON.stringify({ file: p.file, kind }) });
    p.jobs = p.jobs || {}; p.jobs[kind] = { status: "running", elapsed: 0 };
    startPolling(p, kind, key); render();
  };
  return b;
}

async function saveTags(p) {
  await fetch("/api/tags", { method: "POST", body: JSON.stringify({ file: p.file, labels: p.labels, suggested: p.suggested, rejected: p.rejected || [] }) });
}

function markSelRow() {
  document.querySelectorAll("#main .row").forEach(r => r.classList.toggle("sel", r.dataset.file === editing));
}
function openDrawer(file) { editing = file; document.getElementById("drawer").classList.add("open"); renderDrawer(); markSelRow(); }

function renderDrawer() {
  const d = document.getElementById("drawer");
  const p = papers.find(v => v.file === editing);
  if (!p) { d.classList.remove("open"); return; }
  d.innerHTML = "";
  const close = document.createElement("div");
  close.id = "closeDrawer"; close.textContent = "✕";
  close.onclick = () => { editing = null; d.classList.remove("open"); markSelRow(); };
  d.appendChild(close);
  const h = document.createElement("h2"); h.textContent = p.title; d.appendChild(h);
  const hint = document.createElement("div"); hint.className = "hint";
  hint.textContent = "클릭: 라벨 켜고 끄기 · 노란 점선(제안)은 클릭하면 확정, ✕로 제거";
  d.appendChild(hint);
  for (const [gname, labels] of Object.entries(groups)) {
    const g = document.createElement("div"); g.className = "group";
    const h3 = document.createElement("h3"); h3.textContent = gname; g.appendChild(h3);
    for (const lb of labels) {
      const el = document.createElement("span");
      const isOn = p.labels.includes(lb), isSug = p.suggested.includes(lb);
      el.className = "dlbl" + (isOn ? " on" : isSug ? " sug" : "");
      el.textContent = isSug ? lb + " ?" : lb;
      el.onclick = async () => {
        if (isOn) {
          p.labels = p.labels.filter(v => v !== lb);
          p.rejected = (p.rejected || []).concat([lb]);  // 껐던 라벨은 자동으로 다시 안 붙게
        } else {
          p.labels.push(lb);
          p.suggested = p.suggested.filter(v => v !== lb);
          p.rejected = (p.rejected || []).filter(v => v !== lb);
        }
        await saveTags(p); render();
      };
      g.appendChild(el);
      if (isSug) {
        const x = document.createElement("span");
        x.className = "dlbl"; x.textContent = "✕"; x.title = "제안 제거";
        x.onclick = async () => {
          p.suggested = p.suggested.filter(v => v !== lb);
          p.rejected = (p.rejected || []).concat([lb]);
          await saveTags(p); render();
        };
        g.appendChild(x);
      }
    }
    const add = document.createElement("div"); add.className = "addlbl";
    const inp = document.createElement("input"); inp.placeholder = "+ 새 라벨";
    inp.onkeydown = async (e) => {
      if (e.key !== "Enter" || !inp.value.trim()) return;
      const label = inp.value.trim();
      await fetch("/api/labels", { method: "POST", body: JSON.stringify({ group: gname, label }) });
      if (!groups[gname].includes(label)) groups[gname].push(label);
      p.labels.push(label);
      await saveTags(p); render();
    };
    add.appendChild(inp);
    g.appendChild(add);
    d.appendChild(g);
  }
}

document.getElementById("ft").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) { ftFiles = null; ftQuery = ""; render(); return; }
  const r = await fetch("/api/fulltext?q=" + encodeURIComponent(q));
  const d = await r.json();
  ftQuery = q; ftFiles = new Set(d.files);
  render();
});
document.getElementById("incSug").addEventListener("change", render);
document.getElementById("onlyUntagged").addEventListener("change", render);
document.getElementById("sortSel").addEventListener("change", render);

async function checkOpenAlex() {
  const el = document.getElementById("oastatus");
  el.textContent = "맵 서비스 확인 중…";
  try {
    const s = await (await fetch("/api/openalex_status")).json();
    if (s.ok) { el.textContent = "● 맵 서비스 정상"; el.style.color = "var(--green)"; }
    else if (s.lookup === 200) { el.textContent = "● 맵 서비스 일부 제한 (검색 " + s.search + ")"; el.style.color = "var(--amber)"; }
    else { el.textContent = "● 맵 서비스 제한 중 (" + (s.lookup || "연결 실패") + ")"; el.style.color = "var(--red)"; }
  } catch (e) { el.textContent = "● 맵 서비스 확인 실패"; el.style.color = "var(--red)"; }
}
document.getElementById("oastatus").onclick = checkOpenAlex;

// 논문 탐색 분할 패널 (오른쪽 슬라이드, 드래그로 크기 조절, 상태 기억)
const pane = document.getElementById("explorePane"), frame = document.getElementById("exploreFrame");
const splitter = document.getElementById("splitter"), exploreToggle = document.getElementById("exploreToggle");
function openExplore(open) {
  if (open) {
    if (!frame.getAttribute("src") || frame.getAttribute("src") === "about:blank") frame.src = "/explore";
    const saved = parseInt(localStorage.getItem("explore_w") || "0");
    pane.style.width = Math.max(380, saved || Math.round(window.innerWidth * 0.5)) + "px";
  } else pane.style.width = "0px";
  pane.classList.toggle("open", open);
  exploreToggle.textContent = open ? "탐색 닫기" : "논문 탐색";
  try { localStorage.setItem("explore_open", open ? "1" : "0"); } catch (e) {}
}
exploreToggle.onclick = (e) => { e.preventDefault(); openExplore(!pane.classList.contains("open")); };
let dragging = false;
splitter.onmousedown = (e) => { dragging = true; document.body.classList.add("dragging"); e.preventDefault(); };
window.addEventListener("mousemove", (e) => {
  if (!dragging) return;
  pane.style.width = Math.min(window.innerWidth - 500, Math.max(380, window.innerWidth - e.clientX)) + "px";
});
window.addEventListener("mouseup", () => {
  if (!dragging) return;
  dragging = false; document.body.classList.remove("dragging");
  try { localStorage.setItem("explore_w", parseInt(pane.style.width)); } catch (e) {}
});
try { if (localStorage.getItem("explore_open") === "1") openExplore(true); } catch (e) {}

loadData();
checkOpenAlex();
</script>
