<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>그림 만들기 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png">
<link rel="stylesheet" href="/ui.css">
<style>
  body { background: var(--bg); }
  header { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin-right: var(--s1); }
  header .brand-mark { height: 24px; width: auto; display: block; margin-right: 2px; }
  header .ttl { font-size: 13px; color: var(--text-2); margin-right: var(--s2); }
  header select { max-width: 360px; font-size: 12.5px; }
  #info { margin-left: auto; font-size: 12px; color: var(--text-3); }
  #app { display: grid; grid-template-columns: minmax(380px, 520px) 1fr; height: calc(100vh - 45px); }
  #left { overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line-2); padding: var(--s4) var(--s4) var(--s8); }
  #right { overflow-y: auto; padding: var(--s4) var(--s6) var(--s8); min-width: 0; }
  .step { margin-bottom: var(--s6); }
  .step > h2 { font-size: 13px; font-weight: 700; color: var(--text); border-bottom: 1px solid var(--line); padding-bottom: 3px; margin: 0 0 var(--s2); display: flex; gap: 8px; align-items: baseline; }
  .step > h2 .no { color: var(--accent); } .step > h2 .hint { font-weight: 400; margin-left: auto; text-align: right; }
  .hint { font-size: 12px; color: var(--text-3); line-height: 1.55; }
  .warn { color: var(--amber); }
  textarea { width: 100%; font-size: 13px; line-height: 1.6; }
  .rowl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; font-size: 12.5px; color: var(--text-2); }
  .rowl select { font-size: 12.5px; }
  .opt { border: 1px solid var(--line); padding: 8px 10px; margin: 6px 0; cursor: pointer; }
  .opt:hover { background: var(--hover); }
  .opt.on { border-color: var(--accent); background: var(--sel-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .opt .t { font-weight: 600; font-size: 13px; } .opt .t span { font-weight: 400; font-size: 12px; color: var(--text-3); margin-left: 6px; }
  .opt .l { font-size: 12.5px; color: var(--text-2); line-height: 1.55; margin-top: 2px; } .opt .e { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
  .read { font-size: 12.5px; line-height: 1.6; color: var(--text-2); margin: 4px 0 6px; }
  .qq { margin: 10px 0 2px; font-size: 12.5px; color: var(--text); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
  .chipb { border: 1px solid var(--line-2); background: var(--surface); padding: 3px 9px; font-size: 12.5px; cursor: pointer; border-radius: var(--r); color: var(--text); font-family: inherit; }
  .chipb:hover { background: var(--hover); } .chipb.on { border-color: var(--accent); color: var(--accent); background: var(--sel-bg); }
  .fam { border: 1px solid var(--line); margin: 8px 0; }
  .fam.on { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
  .fam .fh { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px 1px; cursor: pointer; } .fam .fh b { font-size: 13px; } .fam .fh span { font-size: 12px; color: var(--text-3); }
  .fam .fd { padding: 0 10px 6px; font-size: 12px; color: var(--text-2); line-height: 1.5; cursor: pointer; }
  .fam .fx { display: flex; gap: 6px; padding: 0 10px 9px; overflow: hidden; cursor: pointer; }
  .fam .fx img { height: 84px; max-width: 160px; object-fit: contain; background: #fff; border: 1px solid var(--line); flex: none; }
  .exg { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 8px; padding: 2px 10px 6px; }
  .ex { border: 1px solid var(--line); padding: 4px; font-size: 11px; color: var(--text-2); cursor: pointer; background: var(--surface); position: relative; }
  .ex img { width: 100%; height: 100px; object-fit: contain; background: #fff; display: block; }
  .ex.on { outline: 2px solid var(--accent); outline-offset: -1px; background: var(--sel-bg); }
  .ex .pm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .ex .zm { position: absolute; right: 5px; top: 5px; background: var(--surface); border: 1px solid var(--line-2); font-size: 11px; padding: 0 4px; line-height: 1.5; cursor: zoom-in; opacity: 0; }
  .ex:hover .zm { opacity: 1; }
  .exfoot { padding: 0 10px 9px; font-size: 12px; color: var(--text-3); }
  .cat { font-size: 12px; color: var(--text-3); line-height: 1.6; margin: 6px 0; } .cat input { width: 170px; font-size: 12px; }
  .gobar { display: flex; gap: 10px; align-items: center; margin-top: var(--s3); flex-wrap: wrap; }
  .pbar2 { height: 3px; background: var(--line); margin-top: 6px; } .pbar2 i { display: block; height: 100%; width: 3%; background: var(--accent); transition: width 1s linear; }
  /* 오른쪽: 만든 그림 */
  .strip { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: var(--s3); }
  .th { border: 1px solid var(--line); background: var(--surface); padding: 3px; cursor: pointer; font-size: 11px; color: var(--text-3); text-align: center; }
  .th img { height: 62px; max-width: 120px; object-fit: contain; display: block; background: #fff; } .th.on { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .big { background: var(--surface); border: 1px solid var(--line); padding: var(--s2); max-width: 1100px; } .big img { width: 100%; display: block; background: #fff; }
  .meta { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: var(--s2) 0; font-size: 12px; color: var(--text-2); max-width: 1100px; } .meta b { font-size: 13px; color: var(--text); }
  .meta .sp { flex: 1; }
  .fld { max-width: 1100px; margin-top: var(--s3); } .fld label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 3px; }
  .fld .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .intro { max-width: 760px; margin: var(--s8) auto; color: var(--text-2); font-size: 13px; line-height: 1.85; } .intro b { color: var(--text); }
  pre.code { font-size: 11px; white-space: pre-wrap; max-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--line); padding: 8px; max-width: 1100px; }
  details.src { max-width: 1100px; margin-top: var(--s2); font-size: 12.5px; color: var(--text-2); } details.src summary { cursor: pointer; font-size: 12px; color: var(--text-3); } details.src div { white-space: pre-wrap; line-height: 1.6; padding: 6px 0; }
  /* 겹쳐 뜨는 창: 원고에서 고르기 · 그림 크게 */
  #ov { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 40; display: none; align-items: center; justify-content: center; }
  #ov .box { width: min(1000px, calc(100vw - 32px)); height: calc(100vh - 70px); background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 10px 30px #0004; display: flex; flex-direction: column; }
  #ov .oh { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-3); flex-wrap: wrap; } #ov .oh b { font-size: 14px; color: var(--text); }
  #ov .ob { flex: 1; display: flex; min-height: 0; }
  #ov .secs { width: 250px; flex: none; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel, var(--bg)); }
  #ov .secs div { padding: 5px 12px; font-size: 12.5px; cursor: pointer; } #ov .secs div:hover { background: var(--hover); } #ov .secs div.on { box-shadow: inset 3px 0 0 var(--accent); background: var(--sel-bg); }
  #ov .paras { flex: 1; overflow-y: auto; padding: 10px 16px; }
  #ov .pp { border-left: 3px solid transparent; padding: 6px 10px; margin: 4px 0; font-size: 13px; line-height: 1.65; cursor: pointer; white-space: pre-wrap; } #ov .pp:hover { background: var(--hover); }
  #ov .pp.on { border-left-color: var(--accent); background: var(--sel-bg); }
  #ov .of { display: flex; gap: 10px; align-items: center; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--text-3); }
  #ov .zoom { flex: 1; display: flex; align-items: center; justify-content: center; padding: 14px; min-height: 0; } #ov .zoom img { max-width: 100%; max-height: 100%; background: #fff; }
  @media (max-width: 900px) { #app { grid-template-columns: 1fr; height: auto; } #left, #right { overflow: visible; } #left { border-right: 0; border-bottom: 1px solid var(--line-2); } #right { padding: var(--s4); } #ov .secs { width: 130px; } .fld .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><a class="brand" href="/" title="Athenaeum 홈" target="athenaeum_home"><img class="brand-mark" src="/logo/mark.svg" alt="">ATHENAEUM</a></h1>
  <span class="ttl">그림 만들기</span>
  <select id="msSel" title="그림을 넣을 원고"></select>
  <span id="info"></span>
  <span id="uiCtlHost"></span>
</header>
<div id="app">
  <div id="left">
    <div class="step"><h2><span class="no">1</span>무엇을 그리나<span class="hint"><button class="act" id="fromMs" title="원고의 절에서 문단을 골라 바탕 글로 가져옵니다">원고에서 고르기</button></span></h2>
      <textarea id="src" rows="6" placeholder="바탕 글 — 그림으로 옮길 원고의 대목을 붙여 넣습니다. 이 글이 말하는 것만 그립니다(글에 없는 수치를 지어내지 않습니다)."></textarea>
      <textarea id="note" rows="2" style="margin-top:6px" placeholder="덧붙일 말 (없어도 됩니다) — 예: 세 상태를 나란히, 치수선은 빼고. 바탕 글 없이 여기에만 설명해도 됩니다."></textarea>
    </div>
    <div class="step"><h2><span class="no">2</span>구도<span class="hint" id="planHint"></span></h2><div id="plan"></div></div>
    <div class="step"><h2><span class="no">3</span>그림체<span class="hint" id="styleHint"></span></h2><div id="style"></div></div>
    <div class="step"><h2><span class="no">4</span>그리기</h2>
      <div class="rowl">
        <label>크기 <select id="size"><option value="wide">16:9 (1280×720)</option><option value="single">1단 (900×700)</option><option value="double">2단 (1800×1000)</option><option value="square">정사각</option><option value="tall">세로</option></select></label>
        <label>라벨 <select id="lang"><option value="en">영어</option><option value="ko">한국어</option></select></label>
        <label>자세함 <select id="cx"><option value="normal">보통</option><option value="simple">간단히</option><option value="detailed">자세히</option></select></label>
        <label>모델 <select id="model"><option value="opus">Opus · 꼼꼼 (3~7분)</option><option value="sonnet">Sonnet · 빠름 (1~2분)</option></select></label>
      </div>
      <div class="gobar"><button class="primary" id="go">그리기</button><span class="hint" id="goHint"></span></div>
      <div id="goProg"></div>
    </div>
  </div>
  <div id="right"></div>
</div>
<div id="ov"></div>
<script src="/ui.js"></script>
<script>
/* 그림 만들기 (2026-11-19, 사용자: '드래그해서 그렇게 하지 말고, 위에 그림 만들기를 하나 창을 둬서 좀 더 전문적으로. 훌륭한 연구 있잖아 MTM 연구나 Dragos 씨 논문 같은 데서
   사진 가져와서 예시로 들고, 이런 스타일, 저런 스타일 등등 물어보고').
   왼쪽 = 네 걸음(무엇을 → 구도 → 그림체 → 그리기), 오른쪽 = 만든 그림(고치기 · PPT 받기 · 캡션).
   · 구도: 바탕 글을 가벼운 모델이 읽고 구도 후보 둘·셋과 정할 것을 선택지로 낸다(/api/ms/figure/plan). 건너뛰고 형식만 골라도 된다.
   · 그림체: 도감(figstyle.py — 우선 저널과 본보기 저자의 논문 도식을 그림체별로 묶은 것)에서 갈래를 고르고 본보기 그림을 셋까지 고른다. 그릴 때 그 그림들을 읽혀 선·색·글꼴·라벨만 따르게 한다.
   · 그림은 원고에 딸린다(doc.figures) — 이 창은 원고를 통째로 저장하지 않고 그림만 고친다(/api/ms/figure/meta). 원고 창이 열려 있어도 서로의 글을 덮지 않는다. */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (url, body) => fetch(url, body ? { method: "POST", body: JSON.stringify(body) } : undefined).then(r => r.json()).catch(e => ({ error: "서버 연결 실패" }));
const fmtDur = s => s < 60 ? Math.round(s) + "초" : Math.floor(s / 60) + "분 " + (Math.round(s) % 60) + "초";
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const QS = new URLSearchParams(location.search);
const FORMS = [["auto", "알아서 (글에 맞게)"], ["cutting", "가공 도식 (공구·칩)"], ["grinding", "연삭·밀링 운동학"], ["setup", "장치 구성도"], ["flow", "흐름도·개념도"], ["steps", "단계 패널 (a→b→c)"], ["compare", "비교 패널 (나란히)"], ["graph", "개념 그래프 (축과 곡선)"], ["micro", "미세조직·재료"], ["mechanics", "힘·역학 벡터"], ["general", "그 밖"]];
const FORM_KO = Object.fromEntries(FORMS.map(([k, v]) => [k, v.replace(/ \(.*/, "")]));
const BASES = [["color", "논문 컬러"], ["line", "흑백 선화"], ["thermal", "온도장·컬러맵"]];
const imgUrl = x => "/figimg?file=" + encodeURIComponent(x.file) + "&name=" + encodeURIComponent(x.img);
const exKey = x => x.file.replace(/\.pdf$/i, "") + "|" + x.img;

let docId = QS.get("id") || lsGet("fig_doc", ""), msList = [], figs = [], curFig = null, msDoc = null;
let S = { plan: null, planFor: "", opt: 0, ans: {}, form: "auto", fam: "", ex: [], base: "color", flt: "", more: false, where: "" };
let cat = null, saved = [], busy = false, planBusy = false, catTimer = null;

/* ---------- 원고 · 그림 목록 ---------- */
async function init() {
  msList = (await api("/api/ms/list")).items || [];
  if (!msList.some(m => m.id === docId)) docId = (msList[0] || {}).id || "";
  $("msSel").innerHTML = msList.length ? msList.map(m => "<option value='" + esc(m.id) + "'" + (m.id === docId ? " selected" : "") + ">" + esc((m.title || m.id).slice(0, 60)) + "</option>").join("") : "<option value=''>원고가 없습니다</option>";
  $("msSel").onchange = () => { docId = $("msSel").value; lsSet("fig_doc", docId); msDoc = null; curFig = null; loadDraft(); loadFigs(); };
  ["size", "lang", "cx", "model"].forEach(k => { $(k).value = lsGet("fig_" + k, $(k).value) || $(k).value; if (!$(k).value) $(k).selectedIndex = 0; $(k).onchange = () => { lsSet("fig_" + k, $(k).value); goHint(); }; });
  if (!lsGet("fig_model", "") && typeof uiGet === "function" && uiGet("fig_model")) $("model").value = uiGet("fig_model");
  $("src").oninput = $("note").oninput = () => { saveDraft(); renderPlan(); };
  $("fromMs").onclick = openMsPick;
  $("go").onclick = draw;
  loadDraft(); goHint(); renderPlan(); renderStyle();
  if (!msList.length) { $("right").innerHTML = "<div class='intro'>원고가 아직 없습니다. 그림은 원고에 딸려 저장됩니다 — 홈의 「원고」 에서 원고를 하나 만든 뒤 다시 열어 주세요.</div>"; return; }
  lsSet("fig_doc", docId);
  loadFigs(); loadCat(); api("/api/ms/figure/style", { op: "list" }).then(r => { saved = (r && r.styles) || []; renderStyle(); });
}
function loadDraft() { let d = {}; try { d = JSON.parse(lsGet("fig_draft_" + docId, "{}")) || {}; } catch (e) {} $("src").value = d.text || ""; $("note").value = d.note || ""; S.where = d.where || ""; S.plan = null; S.ans = {}; S.opt = 0; }
function saveDraft() { lsSet("fig_draft_" + docId, JSON.stringify({ text: $("src").value, note: $("note").value, where: S.where })); }
async function loadFigs(keep) {
  if (!docId) return;
  const r = await api("/api/ms/figure/meta", { id: docId, op: "list" });
  figs = (r.figures || []);
  if (!figs.some(f => f.id === curFig)) curFig = (figs[figs.length - 1] || {}).id || null;
  $("info").textContent = figs.length ? "이 원고의 그림 " + figs.length + "장" : "";
  if (!keep) renderStage();
}

/* ---------- 2. 구도 ---------- */
function planKey() { return $("src").value.trim() + "\n" + $("note").value.trim(); }
function renderPlan() {
  const el = $("plan"), has = $("src").value.trim().length >= 20 || $("note").value.trim().length >= 10;
  const stale = S.plan && S.planFor !== planKey();
  $("planHint").textContent = S.plan ? "" : "가벼운 모델이 글을 읽고 구도 후보를 냅니다 · 15~30초";
  if (planBusy) { el.innerHTML = "<div class='hint'>글을 읽고 구도를 생각하는 중…</div><div class='pbar2'><i id='planBar'></i></div>"; return; }
  if (!S.plan) {
    el.innerHTML = "<div class='rowl'><button class='primary' id='planGo'" + (has ? "" : " disabled") + ">구도 제안 받기</button><span class='hint'>또는 형식만 고르기</span><select id='formSel'>" + FORMS.map(([k, v]) => "<option value='" + k + "'" + (k === S.form ? " selected" : "") + ">" + v + "</option>").join("") + "</select></div>" +
      (has ? "" : "<div class='hint'>위에 바탕 글이나 설명을 먼저 적어 주세요.</div>") + (S.planErr ? "<div class='hint warn'>" + esc(S.planErr) + "</div>" : "");
    $("planGo").onclick = getPlan; $("formSel").onchange = () => { S.form = $("formSel").value; };
    return;
  }
  const p = S.plan;
  el.innerHTML = (p.read ? "<div class='read'>" + esc(p.read) + "</div>" : "") +
    p.options.map((o, i) => "<div class='opt" + (i === S.opt ? " on" : "") + "' data-o='" + i + "'><div class='t'>" + esc(o.title) + "<span>" + esc(FORM_KO[o.form] || "") + (i === 0 ? " · 권함" : "") + "</span></div><div class='l'>" + esc(o.layout) + "</div>" +
      (o.elements.length ? "<div class='e'>넣을 것: " + o.elements.map(esc).join(" · ") + "</div>" : "") + (o.why && i === S.opt ? "<div class='e'>" + esc(o.why) + "</div>" : "") + "</div>").join("") +
    p.questions.map((q, qi) => "<div class='qq'>" + esc(q.q) + "</div><div class='chips'>" + q.choices.map((c, ci) => "<button class='chipb" + ((S.ans[qi] == null ? 0 : S.ans[qi]) === ci ? " on" : "") + "' data-q='" + qi + "' data-c='" + ci + "'>" + esc(c) + "</button>").join("") + "</div>").join("") +
    "<div class='rowl' style='margin-top:10px'>" + (stale ? "<span class='hint warn'>글이 바뀌었습니다 —</span>" : "") + "<button class='act' id='planGo'>다시 받기</button><button class='act' id='planX'>구도 없이 형식만 고르기</button></div>";
  el.querySelectorAll(".opt").forEach(d => d.onclick = () => { S.opt = +d.dataset.o; renderPlan(); });
  el.querySelectorAll(".chipb").forEach(b => b.onclick = () => { S.ans[+b.dataset.q] = +b.dataset.c; renderPlan(); });
  $("planGo").onclick = getPlan; $("planX").onclick = () => { S.plan = null; renderPlan(); };
}
async function getPlan() {
  if (planBusy) return; planBusy = true; S.planErr = ""; const key = planKey(); renderPlan();
  const t0 = Date.now(), tm = setInterval(() => { const b = $("planBar"); if (b) b.style.width = Math.min(95, (Date.now() - t0) / 250) + "%"; }, 1000);
  const r = await api("/api/ms/figure/plan", { id: docId, text: $("src").value.trim(), note: $("note").value.trim() });
  clearInterval(tm); planBusy = false;
  if (r.error || !(r.options || []).length) { S.planErr = r.error || "구도를 받지 못했습니다"; S.plan = null; } else { S.plan = r; S.planFor = key; S.opt = 0; S.ans = {}; }

      "<button class='act' id='fHi' data-local title='저널 제출용 3배 PNG 를 원고의 내보내기 폴더에 만듭니다'>고해상도 PNG</button>" + (made ? "<button class='act' id='fCode'>코드</button>" : "") + "<button class='act' id='fDel'>삭제</button></div>" +
    "<div class='hint' id='fNote'>" + esc(pptNote(f)) + "</div>" +
    (made ? "<div class='fld'><label>고치기</label><textarea id='fFb' rows='2' placeholder='말로 적으면 그리기 코드를 고쳐 다시 그립니다 — 예: 화살표를 더 굵게, 칩을 더 길게, 범례는 빼고'></textarea><div class='gobar' style='margin-top:6px'><button id='fRefine'>이렇게 고쳐 줘</button><span class='hint'>1~3분</span></div><div id='fProg'></div></div>" : "") +
    "<div class='fld'><div class='two'><div><label>캡션 (한국어)</label><textarea id='fCap' rows='2'>" + esc(f.caption || "") + "</textarea></div><div><label>Caption (English)</label><textarea id='fCapEn' rows='2'>" + esc(f.caption_en || "") + "</textarea></div></div></div>" +
    (src ? "<details class='src'><summary>이 그림의 바탕 글" + ((sp.source || {}).where ? " — " + esc(sp.source.where) : "") + "</summary><div>" + esc(src) + "</div></details>" : "") +
    (made && sp.description ? "<details class='src'><summary>구도와 덧붙인 말</summary><div>" + esc(sp.description) + "</div></details>" : "") +
    (made ? "<pre class='code' id='fCodeBox' style='display:none'>" + esc(f.source.script || "") + "</pre>" : "");
  el.querySelectorAll("[data-f]").forEach(t => t.onclick = () => { curFig = t.dataset.f; renderStage(); });
  if ($("fPpt")) $("fPpt").onclick = async () => { const b = $("fPpt"); b.disabled = true; b.textContent = "만드는 중…";
    const r = await api("/api/ms/figure/pptx", { id: docId, fig: f.id }); b.disabled = false; b.textContent = "PPT 받기";
    if (r.error) { alert("⚠ " + r.error); return; }
    f.pptx = r.file; f.pptx_stats = r.stats || {};
    const title = ((msList.find(m => m.id === docId) || {}).title || "figure").replace(/[\\/:*?"<>|]+/g, " ").trim().slice(0, 40);
    const a = document.createElement("a"); a.href = "/fig/" + encodeURIComponent(r.file) + "?t=" + Date.now(); a.download = "Fig" + f.num + "_" + title + ".pptx"; document.body.appendChild(a); a.click(); a.remove();
    $("fNote").textContent = pptNote(f, true); };
  $("fHi").onclick = async () => { const b = $("fHi"); b.textContent = "만드는 중…"; const r = await api("/api/ms/figure/export", { id: docId, fig: f.id, scale: 3 }); b.textContent = "고해상도 PNG"; $("fNote").textContent = r.error ? "⚠ " + r.error : "저장했습니다: " + r.path; };
  if ($("fCode")) $("fCode").onclick = () => { const b = $("fCodeBox"); b.style.display = b.style.display === "none" ? "block" : "none"; };
  $("fDel").onclick = async () => { if (!confirm("Fig. " + f.num + " 을 지울까요?")) return; const r = await api("/api/ms/figure/meta", { id: docId, op: "delete", fig: f.id }); if (r.error) { alert("⚠ " + r.error); return; } curFig = null; loadFigs(); };
  const cap = () => { clearTimeout(capTimer); capTimer = setTimeout(() => { f.caption = $("fCap").value; f.caption_en = $("fCapEn").value; api("/api/ms/figure/meta", { id: docId, op: "caption", fig: f.id, caption: f.caption, caption_en: f.caption_en }); }, 600); };
  $("fCap").oninput = $("fCapEn").oninput = cap;
  if ($("fRefine")) $("fRefine").onclick = async () => { const fb = $("fFb").value.trim(); if (!fb) { alert("어떻게 고칠지 적어 주세요."); return; } if (busy) return; busy = true; $("fRefine").disabled = true;
    const stop = waitBar($("fProg"), "고치는 중", +lsGet("fig_dur_fix", 0) || 90);
    const r = await api("/api/ms/figure/generate", { id: docId, fig: f.id, feedback: fb }); const sec = stop(); busy = false;
    if (r.error) { $("fProg").innerHTML = "<div class='hint warn'>⚠ " + esc(r.error) + "</div>"; $("fRefine").disabled = false; return; }
    lsSet("fig_dur_fix", Math.round(sec)); await loadFigs(); };
}
window.addEventListener("focus", () => { if (!busy && docId) loadFigs(true).then(() => { if (!document.activeElement || !/TEXTAREA|INPUT/.test(document.activeElement.tagName)) renderStage(); }); });
init();
</script>
</body>
</html>
