<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Athenaeum</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#202020" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Athenaeum"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png">
<link rel="stylesheet" href="/ui.css">
<style>
  /* 휴대폰 화면 — 아이폰 앱의 결: 아래 탭 막대, 큰 제목, 둥근 카드, 읽을 때는 막대가 숨는다. 색·글꼴은 ui.css 의 토큰 그대로.
     ui.css 의 공용 이름(.act .chip .sec .sel .prog .hint .primary)과 겹치지 않게 이름을 지었다. */
  :root { --mfs: 17px; --nav-h: 46px; --tab-h: 54px; --kb: 0px;
    --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
    --fill: rgba(118, 118, 128, .12); --fill-2: rgba(118, 118, 128, .22); --glass: rgba(255, 255, 255, .86); --card: #f4f4f2; --pop: #ffffff; --seg-on: #ffffff; }
  :root[data-theme="dark"] { --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .4); --glass: rgba(32, 32, 32, .86); --card: #2a2a28; --pop: #2c2c2a; --seg-on: #5c5c60; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --fill: rgba(118, 118, 128, .24); --fill-2: rgba(118, 118, 128, .4); --glass: rgba(32, 32, 32, .86); --card: #2a2a28; --pop: #2c2c2a; --seg-on: #5c5c60; } }
  html { -webkit-text-size-adjust: 100%; touch-action: manipulation; }
  body { background: var(--surface); font-size: 15px; line-height: 1.45; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: anywhere; }
  a { -webkit-touch-callout: none; } a:hover { text-decoration: none; }
  button { -webkit-appearance: none; appearance: none; font: inherit; color: inherit; cursor: pointer; }
  [hidden] { display: none !important; }
  .cl2, .cl3, .cl1 { display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; } .cl1 { -webkit-line-clamp: 1; } .cl2 { -webkit-line-clamp: 2; } .cl3 { -webkit-line-clamp: 3; }

  /* 위 막대 · 읽은 만큼 줄 · 아래 탭 */
  #nav { position: fixed; z-index: 20; top: 0; left: 0; right: 0; height: calc(var(--nav-h) + var(--sat)); padding: var(--sat) 4px 0; box-sizing: border-box; display: flex; align-items: center;
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-bottom: 1px solid var(--line); transition: transform .24s ease, background-color .2s, border-color .2s; }
  #nav.rootnav.top { background: transparent; border-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; }
  #nav.top .nt.fade { opacity: 0; }
  #nav .nl, #nav .nr { flex: none; min-width: 48px; display: flex; align-items: center; } #nav .nr { justify-content: flex-end; }
  #nav .nc { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: center; }
  #nav .nt { font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .18s; }
  .nb { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; padding: 0; color: var(--accent); font-size: 18px; font-weight: 600; border-radius: 22px; }
  .nb svg { width: 25px; height: 25px; } .nb:active { background: var(--fill); }
  body.hidebars #nav { transform: translateY(-100%); }
  #rp { position: fixed; z-index: 22; top: var(--sat); left: 0; height: 2.5px; width: 0; background: var(--accent); opacity: 0; transition: opacity .2s; pointer-events: none; }
  body.reading #rp { opacity: 1; }
  #tabbar { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + var(--sab)); padding-bottom: var(--sab); box-sizing: border-box; display: flex;
    background: var(--glass); -webkit-backdrop-filter: saturate(180%) blur(18px); backdrop-filter: saturate(180%) blur(18px); border-top: 1px solid var(--line); }
  body.inner #tabbar { display: none; }
  #tabbar a { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; color: var(--text-3); font-size: 10.5px; font-weight: 500; text-decoration: none; }
  #tabbar a svg { width: 26px; height: 26px; } #tabbar a.on { color: var(--accent); }
  #app { padding-top: calc(var(--nav-h) + var(--sat)); padding-bottom: calc(var(--sab) + 40px); min-height: 100vh; min-height: 100dvh; box-sizing: border-box; }
  body.root #app { padding-bottom: calc(var(--tab-h) + var(--sab) + 28px); }
  body.chatp #app { padding-bottom: 0; }
  #app.push { animation: push .2s ease-out; } #app.fade { animation: fade .16s ease-out; }
  @keyframes push { from { opacity: 0; transform: translateX(14px); } to { opacity: 1; transform: none; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { #app.push, #app.fade { animation: none; } }
  .noanim *, .noanim *::before, .noanim *::after { animation: none !important; transition: none !important; }

  /* 큰 제목 · 묶음 · 줄 */
  .brand { display: flex; align-items: center; gap: 9px; padding: 0 0 0 14px; white-space: nowrap; }
  .brand img { height: 27px; } .brand b { font-family: var(--font-serif); font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
  .lt { font-size: 31px; font-weight: 800; letter-spacing: -.025em; line-height: 1.15; padding: 0 20px 12px; }
  .sh { display: flex; align-items: baseline; padding: 28px 20px 10px; }
  .sh h2 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; }
  .sh a { margin-left: auto; font-size: 14px; color: var(--accent); padding: 4px 0 4px 12px; }
  .hero { display: block; margin: 0 16px; padding: 18px 18px 16px; border-radius: 20px; background: var(--accent-bg); color: var(--text); text-decoration: none; transition: transform .12s; }
  .hero:active { transform: scale(.985); }
  .hero .hk { font-size: 12.5px; font-weight: 700; color: var(--accent); }
  .hero .ht { font-family: var(--font-serif); font-size: 20px; line-height: 1.3; margin-top: 8px; }
  .hero .ht.ko { font-family: var(--font); font-weight: 700; font-size: 19px; line-height: 1.38; letter-spacing: -.01em; }
  .hero .hm { font-size: 13px; color: var(--text-2); margin-top: 8px; }
  .hero .hp { height: 5px; border-radius: 3px; background: var(--fill-2); margin-top: 16px; overflow: hidden; }
  .hero .hp i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .hero .hf { display: flex; align-items: center; margin-top: 12px; font-size: 13px; color: var(--text-2); }
  .hero .go { margin-left: auto; background: var(--accent); color: var(--surface); font-weight: 600; font-size: 14px; padding: 8px 16px; border-radius: 18px; }
  .grp { margin: 0 16px; background: var(--card); border-radius: 16px; overflow: hidden; }
  .grp + .grp, .hero + .grp { margin-top: 12px; }
  .plain { margin: 0 4px; }
  .row { display: block; position: relative; padding: 13px 16px 14px; color: var(--text); text-decoration: none; }
  .row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 1px; background: var(--line); }
  .row:active { background: var(--fill); }
  .row .t { font-family: var(--font-serif); font-size: 16.5px; line-height: 1.32; }
  .row .t.ko { font-family: var(--font); font-weight: 600; font-size: 16px; line-height: 1.38; }
  .row .g { font-size: 14px; line-height: 1.45; color: var(--text-2); margin-top: 5px; }
  .row .m { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin-top: 7px; font-size: 12.5px; color: var(--text-3); }
  .row.chev { padding-right: 34px; } .row.chev::after { content: ""; position: absolute; right: 16px; top: 50%; width: 7px; height: 7px; margin-top: -4px; border-right: 2px solid var(--line-2); border-top: 2px solid var(--line-2); transform: rotate(45deg); }
  .row .no { color: var(--text-3); font-variant-numeric: tabular-nums; margin-right: 8px; }
  .tg { display: inline-block; font-size: 11.5px; font-weight: 600; line-height: 1.5; padding: 1px 8px; border-radius: 9px; background: var(--fill); color: var(--text-2); text-decoration: none; white-space: nowrap; }
  .tg.hi { background: var(--accent-bg); color: var(--accent); } .tg.warn { background: var(--amber-bg); color: var(--amber); }
  .search { position: relative; margin: 0 16px 10px; }
  .search svg { position: absolute; left: 10px; top: 50%; width: 18px; height: 18px; margin-top: -9px; color: var(--text-3); pointer-events: none; }
  .search input { width: 100%; box-sizing: border-box; height: 40px; border: 0; border-radius: 12px; background: var(--fill); padding: 0 12px 0 36px; font-size: 16px; color: var(--text); -webkit-appearance: none; appearance: none; }
  .search input:focus { outline: none; } .search input::-webkit-search-decoration { display: none; }
  .fbar { display: flex; gap: 8px; overflow-x: auto; padding: 0 16px 10px; scrollbar-width: none; } .fbar::-webkit-scrollbar { display: none; }
  .fc { flex: none; height: 32px; padding: 0 13px; border: 0; border-radius: 16px; background: var(--fill); color: var(--text); font-size: 14px; white-space: nowrap; }
  .fc.on { background: var(--text); color: var(--surface); font-weight: 600; }
  .cnt { display: flex; align-items: center; min-height: 30px; padding: 0 20px 4px; font-size: 13px; color: var(--text-3); }
  .cnt button { margin-left: auto; background: none; border: 0; color: var(--accent); font-size: 13.5px; padding: 6px 0 6px 10px; }
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 15px; border-radius: 18px; border: 0; background: var(--fill); color: var(--text); font-size: 14.5px; text-decoration: none; white-space: nowrap; }
  .pill.pri { background: var(--accent); color: var(--surface); font-weight: 600; } .pill:disabled { opacity: .5; } .pill:active { opacity: .7; }
  .pill.big { height: 48px; border-radius: 14px; font-size: 16px; width: 100%; box-sizing: border-box; }
  .empty { padding: 56px 28px; text-align: center; color: var(--text-3); font-size: 14.5px; line-height: 1.7; }
  .empty b { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; } .empty .pill { margin-top: 16px; }
  .sk { border-radius: 14px; background: var(--fill); animation: sk 1s ease-in-out infinite alternate; margin: 0 16px 12px; } @keyframes sk { from { opacity: .45; } to { opacity: 1; } }
  .seg { display: inline-flex; background: var(--fill); border-radius: 10px; padding: 2px; }
  .seg button { border: 0; background: none; min-width: 60px; height: 30px; padding: 0 12px; border-radius: 8px; font-size: 14px; color: var(--text); }
  .seg button.on { background: var(--seg-on); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .16); }

  /* 논문 머리 · 읽는 글 */
  .ph { padding: 8px 20px 2px; }
  .ph .pm { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 13px; color: var(--text-2); }
  .ph h1 { font-family: var(--font-serif); font-size: 22px; line-height: 1.3; font-weight: 500; margin: 8px 0 0; }
  .ph h1.ko { font-family: var(--font); font-weight: 700; font-size: 24px; letter-spacing: -.02em; }
  .ph .ko2 { font-size: 15px; line-height: 1.5; color: var(--text-2); margin-top: 8px; }
  .ph .lb { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .ph .pa { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .doc { padding: 16px 20px 20px; font-size: var(--mfs); line-height: 1.78; word-break: keep-all; overflow-wrap: anywhere; }
  .doc h1 { font-size: 1.3em; line-height: 1.3; font-weight: 700; letter-spacing: -.015em; margin: 0 0 .5em; }
  .doc h2 { font-size: 1.14em; line-height: 1.4; font-weight: 700; letter-spacing: -.01em; margin: 1.9em 0 .6em; }
  .doc h3 { font-size: 1em; font-weight: 700; margin: 1.5em 0 .45em; }
  .doc h3.extra { color: var(--text-2); font-size: .9em; border-top: 1px solid var(--line); padding-top: 1em; }
  .doc > :first-child { margin-top: 0; }
  .doc p { margin: 0 0 1em; } .doc p.extra { font-size: .93em; color: var(--text-2); } .doc p.out { border-left: 3px solid var(--amber); padding-left: 12px; }
  .doc ul, .doc ol { padding-left: 1.25em; margin: 0 0 1em; } .doc li { margin-bottom: .45em; }
  .doc table { border-collapse: collapse; font-size: .84em; line-height: 1.5; margin: 0 0 1.2em; display: block; overflow-x: auto; max-width: 100%; }
  .doc th, .doc td { border: 1px solid var(--line-2); padding: 5px 8px; vertical-align: top; min-width: 3.5em; }
  .doc th { background: var(--card); font-weight: 600; } .doc caption { caption-side: top; text-align: left; font-size: .95em; color: var(--text-2); padding-bottom: 5px; }
  .doc img { max-width: 100%; height: auto; }
  .doc img.eq { display: block; margin: .8em auto; max-height: 7em; background: #fff; border-radius: 8px; padding: 4px; box-sizing: border-box; }
  .doc blockquote { margin: 0 0 1em; padding: 2px 0 2px 12px; border-left: 3px solid var(--line-2); color: var(--text-2); }
  .doc hr { border: 0; border-top: 1px solid var(--line); margin: 1.5em 0; }
  .doc code { font-size: .9em; background: var(--fill); padding: 0 4px; border-radius: 4px; }
  .doc pre { background: var(--card); border-radius: 12px; padding: 10px 12px; margin: 0 0 1em; overflow-x: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .8em; line-height: 1.55; white-space: pre; word-break: normal; overflow-wrap: normal; }
  .doc p.todo { font-size: .9em; color: var(--text-2); }
  .doc .lead { background: var(--card); border-radius: 16px; padding: 14px 16px 15px; margin: 0 -4px 1.3em; }
  .doc .lead .lk { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-bottom: 5px; } .doc .lead > :last-child { margin-bottom: 0; }
  .doc details { margin: .6em 0; } .doc details summary { color: var(--text-2); font-size: .92em; padding: 4px 0; }
  .doc details.fm { font-size: .88em; color: var(--text-2); margin: 0 0 1.3em; }
  .doc .aim { color: var(--text-2); font-size: .94em; margin: -.1em 0 1.3em; }
  .doc .s, .doc .u { -webkit-box-decoration-break: clone; box-decoration-break: clone; border-radius: 3px; cursor: pointer; }
  .doc sup.c, .doc figure img, .mu div.long, #sheetbg, #zoom, #zoom img { cursor: pointer; }
  .doc .s.on, .doc .u.on { background: var(--accent-bg); box-shadow: 0 0 0 2px var(--accent-bg); }
  .doc .flash { animation: flash 1.8s ease-out; } @keyframes flash { 0%, 40% { background: var(--amber-bg); box-shadow: 0 0 0 2px var(--amber-bg); } 100% { background: transparent; box-shadow: none; } }
  .doc sup.c { font-size: .68em; color: var(--accent); padding: 0 3px; font-weight: 600; line-height: 0; }
  .doc figure { margin: 1.4em 0; } .doc figure img { display: block; margin: 0 auto; background: #fff; border-radius: 10px; }
  .doc figcaption { font-size: .82em; color: var(--text-2); margin-top: .6em; line-height: 1.6; } .doc figcaption .src { color: var(--text-3); }
  /* 논문의 그림·표 — 번역에서 처음 가리킨 문단 아래 (2026-11-07). 상자는 그림이 오기 전에 비율대로 자리를 잡아 글이 밀리지 않는다 */
  .doc figure.pf { margin: 1.5em -4px; } .doc figure.pf .pfi { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
  .doc figure.pf .pfi img { display: block; width: 100%; height: auto; margin: 0; border-radius: 0; cursor: zoom-in; }
  .doc figure.pf .pfi.wait { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 110px; background: var(--card); color: var(--text-3); font-size: .85em; box-shadow: none; }
  .doc figure.pf figcaption { padding: 0 4px; } .doc figure.pf figcaption b { color: var(--text); }
  .doc figure.pf .pfo { background: none; border: 0; padding: 0 0 0 8px; color: var(--accent); font-size: .92em; font-weight: 600; cursor: pointer; }
  .doc figure.pf .pfx { margin-top: .5em; color: var(--text-3); font-size: .96em; line-height: 1.55; } .doc figure.pf .pfx [lang=en] { word-break: normal; }
  .doc figure.pf .pfx .rd { margin-top: .45em; color: var(--text-2); } .doc figure.pf .pfx .rd b { color: var(--amber); font-weight: 600; }
  .doc h2.pft { margin-top: 2.4em; padding-top: 1em; border-top: 1px solid var(--line); }
  /* 번역의 수식 — 수식 색인(Claude 의 전사)이 있으면 MathML 로, 누르면 원문 그림 (2026-11-07) */
  .doc figure.eqf { margin: .9em 0 1.1em; } .doc .eqf .eqrow { display: flex; align-items: center; gap: 10px; }
  .doc .eqf .mml { flex: 1; text-align: center; overflow-x: auto; overflow-y: hidden; padding: 6px 0; cursor: pointer; } .doc .eqf .mml math { font-size: 1.08em; }
  .doc .eqf .eqno { color: var(--text-3); white-space: nowrap; font-size: .88em; }
  .doc .eqf img.orig { display: block; max-width: 100%; margin: 6px auto 0; background: #fff; border-radius: 8px; padding: 4px; box-sizing: border-box; }
  .doc .eqtop { font-size: .86em; color: var(--text-2); margin: 0 0 1.1em; line-height: 1.6; } .doc .eqtop .pfo { padding-left: 0; }
  .doc .eqn { overflow-x: auto; overflow-y: hidden; text-align: center; padding: .5em 0 .2em; font-size: 1.05em; }
  .doc .imath.fail, .doc .eqn.fail { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .82em; color: var(--text-2); }
  .doc aside { background: var(--amber-bg); border-radius: 16px; padding: 14px 16px 15px; margin: 1.8em -4px; font-size: .93em; }
  .doc aside .hd { color: var(--amber); font-weight: 700; font-size: .9em; } .doc aside h4 { margin: .9em 0 .2em; font-size: 1em; }
  .doc .anc { font-size: .72em; font-weight: 700; color: var(--accent); background: var(--accent-bg); border-radius: 6px; padding: 1px 5px; margin: 0 1px; white-space: nowrap; text-decoration: none; vertical-align: 1px; }
  .secnav { display: flex; gap: 10px; padding: 8px 16px 0; } .secnav .pill { flex: 1; min-width: 0; height: 48px; border-radius: 14px; }

  /* 아래에서 올라오는 칸 (원문·근거) · 창 · 그림 크게 · 알림 */
  #peek { position: fixed; z-index: 30; left: 8px; right: 8px; bottom: calc(8px + var(--sab)); max-height: 54vh; max-height: 54dvh; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; box-sizing: border-box;
    background: var(--pop); border-radius: 20px; box-shadow: 0 10px 40px rgba(0, 0, 0, .26), 0 0 0 1px var(--line); padding: 14px 16px; transform: translateY(calc(100% + 60px)); transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
  #peek.on { transform: none; }
  #peek .px { position: absolute; top: 9px; right: 9px; width: 30px; height: 30px; border: 0; border-radius: 15px; background: var(--fill); color: var(--text-2); display: flex; align-items: center; justify-content: center; padding: 0; }
  #peek .px svg { width: 15px; height: 15px; }
  .pkl { font-size: 12.5px; font-weight: 700; color: var(--accent); margin-bottom: 6px; padding-right: 36px; min-height: 20px; }
  .pke { font-size: 15.5px; line-height: 1.62; overflow-wrap: anywhere; } .pkk { font-size: 14.5px; line-height: 1.62; color: var(--text-2); margin-top: 8px; word-break: keep-all; overflow-wrap: anywhere; }
  .pki { padding: 12px 0; border-top: 1px solid var(--line); } .pkl + .pki { border-top: 0; padding-top: 0; }
  .pkm { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; } .pkm b { color: var(--text); }
  .pka { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; clear: both; }
  #sheetbg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 40; background: rgba(0, 0, 0, .38); opacity: 0; transition: opacity .2s; touch-action: none; } #sheetbg.on { opacity: 1; }
  #sheet { position: fixed; z-index: 41; left: 0; right: 0; bottom: 0; max-height: 88vh; max-height: 88dvh; overflow-y: auto; overscroll-behavior: contain; box-sizing: border-box; background: var(--pop); border-radius: 22px 22px 0 0;
    padding: 8px 18px calc(18px + max(var(--sab), var(--kb))); transform: translateY(100%); transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  #sheet.on { transform: none; }

function inline(s, o) {

  if (o.math) s = s.replace(/\$([^$\n]{1,300})\$/g, (m, tex) => "<span class='imath' data-tex=\"" + tex + "\">" + tex + "</span>");
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>").replace(/`([^`\n]+)`/g, "<code>$1</code>");
  if (o.anchors) s = s.replace(/⟦([A-Z]\d+\.\d+)⟧/g, (m, k) => o.anchors[k] ? "<a class='anc' href='#' data-anc='" + k + "'>" + k + "</a>" : "");
  if (!o.sent) return s.replace(/\[s\d+\]\s*/g, "");

  return h;
}

}
function md(src, o) {
  o = o || {};
  const lines = String(src || "").replace(/\r/g, "").split("\n"), out = []; let i = 0, para = [], h1 = !o.skipH1;
  const flush = () => { if (para.length) { const t = para.join(" "); out.push("<p" + (/^서재 밖\s*[:：]/.test(t) ? " class='out'" : /^(탐색|공부)\s*[:：]/.test(t) ? " class='todo'" : "") + ">" + inline(t, o) + "</p>"); para = []; } };
  const isLi = s => /^\s*([-*•]|\d+[.)])\s+/.test(s), isTb = s => /^\s*\|.*\|\s*$/.test(s);
  while (i < lines.length) {
    const ln = lines[i]; let m;
    if (!ln.trim()) { flush(); i++; continue; }
    if (/^\s*```/.test(ln)) {      /* 코드 블록 — 글자 그대로 */
      flush(); i++; const code = []; while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]); i++;

      flush(); i++;
      if (m[1].length === 1 && !h1) { h1 = true; continue; }      /* 파일 머리의 '(요약) [저널] (연도), 제목' 줄 — 화면 머리에 제목이 이미 있다 */
      const lv = Math.min(3, Math.max(o.minH || 1, m[1].length)); out.push("<h" + lv + ">" + inline(m[2], o) + "</h" + lv + ">"); continue;
    }
    if (isTb(ln)) { flush(); const rows = []; while (i < lines.length && isTb(lines[i])) rows.push(lines[i++]); out.push(mdTable(rows, o)); continue; }
    if (isLi(ln)) {

      while (i < lines.length && (isLi(lines[i]) || (items.length && /^\s{2,}\S/.test(lines[i])))) { if (isLi(lines[i])) items.push(lines[i].replace(/^\s*([-*•]|\d+[.)])\s+/, "")); else items[items.length - 1] += " " + lines[i].trim(); i++; }
      out.push((ord ? "<ol>" : "<ul>") + items.map(x => "<li>" + inline(x, o) + "</li>").join("") + (ord ? "</ol>" : "</ul>")); continue;

const PTABS = [["summary", "요약"], ["translation", "번역"], ["ask", "묻기"]];
function paperHead(p) {
  return "<div class='ph'><div class='pm'><span>" + esc([p.journal, p.year, p.author].filter(Boolean).join(" · ")) + "</span>" + (p.review ? "<span class='tg'>리뷰</span>" : "") + "</div><h1>" + esc(p.title || "") + "</h1><div class='ko2' id='phko' hidden></div>" +
    ((p.labels || []).length ? "<div class='lb'>" + p.labels.slice(0, 6).map(l => "<a class='tg' href='#/lib' data-lab='" + esc(l) + "'>" + esc(l) + "</a>").join("") + "</div>" : "") +
    "<div class='pa'><a class='pill' href='/pdf?file=" + esc(enc(p.file)) + "' target='_blank' rel='noopener'>PDF 열기</a></div></div>";
}
function foldFront(doc) {   /* 번역의 앞머리(제목·저자·소속 조각)는 접어 두고, 한국어 제목은 머리에 올린다 */
  const lead = [];
  for (const el of [...doc.children]) { if (el.tagName !== "P" || el.textContent.trim().length > 140) break; lead.push(el); }
  if (lead.length < 2) return "";
  const ko = lead.map(e => e.textContent.trim()).find(t => (t.match(/[가-힣]/g) || []).length >= 10) || "";
  const d = document.createElement("details"); d.className = "fm"; d.innerHTML = "<summary>원문 앞머리 (제목 · 저자 · 소속)</summary>";
  lead.forEach(e => d.appendChild(e)); doc.insertBefore(d, doc.firstChild);
  return ko;
}
function leadCard(doc) {    /* 요약의 '한줄 요약' 은 맨 위의 상자로 */
  const h = [...doc.querySelectorAll("h2, h3")].find(x => /한\s*줄\s*요약/.test(x.textContent)); if (!h) return;
  const box = document.createElement("div"); box.className = "lead"; box.innerHTML = "<div class='lk'>한 줄 요약</div>";
  let n = h.nextElementSibling; while (n && !/^H[1-3]$/.test(n.tagName)) { const nx = n.nextElementSibling; box.appendChild(n); n = nx; }
  h.replaceWith(box);
}
function startPing(file, kind) {   /* 읽기 기록 — PC 의 읽기 화면과 같은 신호(30초마다, 화면이 보이고 최근 2분 안에 만졌을 때만). 화면을 떠날 때는 자리만 한 번 더 */
  clearInterval(pingT); document.onvisibilitychange = null; pingLast = null;
  if (NOLOG) return;
  const t0 = Date.now();
  const frac = () => { const h = document.documentElement.scrollHeight - window.innerHeight; return h > 0 ? Math.min(1, Math.max(0, window.scrollY / h)) : 0; };
  const send = sec => {
    const f = Math.round(frac() * 1000) / 1000, p = (papers || []).find(x => x.file === file);
    if (p) { p.read = p.read || {}; p.read.last = Date.now() / 1000; p.read.kind = kind; (p.read.pos = p.read.pos || {})[kind] = f; }      /* 첫 화면의 「이어 읽기」 가 곧바로 맞게 */
    fetch("/api/read_ping", { method: "POST", keepalive: true, body: JSON.stringify({ file, kind, pos: f, sec }) }).catch(() => {});
  };
  const leave = () => { if (Date.now() - t0 > 15000) send(0); };      /* 잠깐 열어 본 것은 '읽던 것' 으로 치지 않는다 */
  pingT = setInterval(() => { if (!document.hidden && Date.now() - lastTouch < 120000) send(30); }, 30000);
  document.onvisibilitychange = () => { if (document.hidden) leave(); };
  pingLast = leave;
}

  app.innerHTML = paperHead(p) + "<article class='doc' id='doc'>" + md(src, { file, sent: tab === "translation", skipH1: true, minH: 2 }) + "</article>" +

  const doc = $("doc");

  if (fg) { placeFigs(doc, file, fg, tab); if (fg.building) figsPoll(file, doc, my); }
  else if (fg === undefined) figsP.then(f => { if (my === view && f && $("doc") === doc) { keepView(() => placeFigs(doc, file, f, tab)); if (f.building) figsPoll(file, doc, my); } });
  if (tab === "translation") { eqTidy(doc, ".s"); await Promise.race([eqRenderM(doc, file, my), new Promise(r => setTimeout(r, 1200))]); if (my !== view) return; }      /* 수식 곁 부스러기를 숨기고, 수식은 전사가 있으면 식으로 — 1.2초까지만 기다린다 */
  doc.onclick = e => {
    if (e.target.closest(".eqf, figure.pf, img.eq")) return;      /* 식·그림 누르기는 아래 app 의 처리로 (식 토글 · 크게 보기) — 문장 안에 든 수식 그림도 */
    const s = e.target.closest(".s[data-s]"); if (!s) return;

  const loc = savedY(curHash), rd = p.read || {}, srv = +((rd.pos || {})[tab]) || 0, srvT = (rd.last || 0) * 1000;

  else if (srv > .01 && srvT > loc[1] + 90000) y = Math.round(srv * (document.documentElement.scrollHeight - window.innerHeight));

}

function waitGen(file, p, kind, my) {

/* ---------- 논문의 그림·표 — 번역 사이에 끼우기 (2026-11-07) ----------
   /api/figs 가 캡션 자리에서 잘라 둔 그림·표와 번역 캡션, 그 그림을 가리키는 문장 번호(refs)를 준다. 번역에서는 처음 가리킨 문장의 문단 바로 아래에, 가리키는 문장이 없는 것과 요약은 글 끝 「그림과 표」 에.
   처음 여는 논문은 서버가 배경에서 자르는 동안(building) 캡션 자리에 '그림 준비 중' 을 두고 2초마다 채운다 — 채울 때는 보던 문장이 움직이지 않게(keepView). */
const CAP_PRE = /^\s*(그림|표|Fig\.?|Figure|Table)\s*\d+\s*[.:·\-–—]?\s*/i;
const figId = f => (f.kind === "table" ? "tab" : "fig") + f.n;
const figSrc = (file, img) => "/figimg?file=" + enc(file) + "&name=" + enc(img);
function figCap(f) { return { label: (f.kind === "table" ? "표 " : "그림 ") + f.n + ".", ko: (f.ko || "").replace(CAP_PRE, "").trim(), en: (f.en || "").trim() }; }
function figBox(file, f) {
  if (!f.img) return "<div class='pfi wait'>그림 준비 중 <span class='dots'><i></i><i></i><i></i></span></div>";
  const wh = f.w && f.h ? " width='" + f.w + "' height='" + f.h + "'" : "";
  return "<div class='pfi'" + (f.w && f.h ? " style='aspect-ratio:" + f.w + "/" + f.h + "'" : "") + "><img loading='lazy' alt='' src='" + figSrc(file, f.img) + "'" + wh + "></div>";
}
function figHtml(file, f) {
  const c = figCap(f);
  const extra = (c.ko && c.en ? "<div lang='en'>" + esc(c.en) + "</div>" : "") + (f.what ? "<div class='rd'><b>그림 읽기 (Claude)</b> " + esc(f.what) + "</div>" : "");
  const lbl = c.ko && c.en ? "원문" : "그림 읽기";
  return "<figure class='pf' data-fig='" + figId(f) + "'>" + figBox(file, f) + "<figcaption><b>" + c.label + "</b> <span class='cap'>" + esc(c.ko || c.en) + "</span>" +
    (f.page ? " <span class='src'>p." + f.page + "</span>" : "") + (extra ? "<button class='pfo' data-l='" + lbl + "'>" + lbl + "</button><div class='pfx' hidden>" + extra + "</div>" : "") + "</figcaption></figure>";
}
function placeFigs(doc, file, fg, tab) {
  const figs = ((fg && fg.figs) || []).filter(f => !f.poor && (f.img || (!f.err && fg.building)));      /* 못 자른 것과 그림 색인이 '잘렸거나 흐리다'(poor)고 본 것은 싣지 않는다 */
  if (!figs.length) return;
  const tail = [];
  figs.forEach(f => {
    let a = null;
    if (tab === "translation") for (const sid of (f.refs || [])) { const el = doc.querySelector(".s[data-s='" + String(sid).replace(/\D/g, "") + "']"); if (el) { a = el.closest("p, li, h2, h3, blockquote, details, table") || el; break; } }
    if (!a) { tail.push(f); return; }
    if (a.tagName === "LI") a = a.closest("ul, ol") || a;
    while (a.nextElementSibling && a.nextElementSibling.matches("figure.pf")) a = a.nextElementSibling;      /* 같은 문단이 둘을 가리키면 차례대로 */
    a.insertAdjacentHTML("afterend", figHtml(file, f));
  });
  if (tail.length) doc.insertAdjacentHTML("beforeend", "<h2 class='pft'>그림과 표</h2>" + tail.map(f => figHtml(file, f)).join(""));
}
function fillFigs(doc, file, fg) {      /* 자르기가 끝난 것을 채우고, 못 자른 것은 뺀다 */
  keepView(() => {
    (fg.figs || []).forEach(f => {
      const el = doc.querySelector("figure.pf[data-fig='" + figId(f) + "'] .pfi.wait"); if (!el) return;
      if (f.img) el.outerHTML = figBox(file, f);
      else if (f.err || !fg.building) el.closest("figure").remove();
    });
    const h = doc.querySelector("h2.pft"); if (h && !h.nextElementSibling) h.remove();
  });
}
function figsPoll(file, doc, my) {
  let n = 0;
  const tick = async () => {
    if (my !== view) return;
    let fg = null; try { fg = await api("/api/figs?file=" + enc(file)); } catch (e) {}
    if (my !== view || !fg || $("doc") !== doc) return;
    fillFigs(doc, file, fg);
    if (fg.building && ++n < 60) pollT = setTimeout(tick, 2000);
  };
  pollT = setTimeout(tick, 2000);
}
function keepView(fn) {      /* 글 가운데를 고치는 동안 보던 줄이 그 자리에 있게 */
  const top = (nav.offsetHeight || 46) + 8, doc = $("doc");
  let a = null;
  if (doc) for (const el of doc.querySelectorAll("p, h2, h3, li, figure, table, blockquote, details")) { const r = el.getBoundingClientRect(); if (r.height > 0 && r.bottom > top) { a = [el, r.top]; break; } }
  fn();
  if (a && a[0].isConnected) { const d = a[0].getBoundingClientRect().top - a[1]; if (Math.abs(d) > 1) { window.scrollBy(0, d); lastY = window.scrollY; } }
}
function fcHtml(fc) {      /* 확대 창 아래에 둘 캡션 — 그림 번호와 글만 */
  const b = fc.querySelector("b"), c = fc.querySelector(".cap");
  if (b && c) return "<b>" + esc(b.textContent) + "</b> " + esc(c.textContent);
  const t = fc.cloneNode(true); t.querySelectorAll("button, .pfx, .src").forEach(x => x.remove());
  return esc(t.textContent.replace(/\s+/g, " ").trim().slice(0, 500));
}

/* ---------- 번역의 수식 — 전사가 있으면 식으로 (2026-11-07) ----------
   PDF 의 수식은 글자로 꺼내면 조각이 나서 번역은 원문 수식을 그림으로 잘라 둔다([[EQ]]). 수식 색인(번역\수식색인, Claude 가 그림을 읽어 LaTeX 로 전사)이 있으면
   PC 읽기 창과 같은 규칙(eqUsable)으로 MathML 로 그리고, 식을 누르면 원문 그림을 보인다 — 그림이 진본이고 전사는 Claude 의 것.
   색인이 없으면 서버가 바로 만들기 시작하고(GET /api/eqindex — 사용자 2026-11-07 '전사는 무조건, 토큰 그 정도는 남는 장사') 글 머리에 '옮기는 중' 한 줄, 끝나면 다시 그린다. */
const eqIdxCache = {}, eqCutRx = /잘려|잘린|잘라|일부만|부분만|한 줄만|좌변만|우변만|앞부분|뒷부분|윗부분|아랫부분|이어지는|나머지|보이지 않|안 보이/;
const eqUsable = e => !!(e && e.latex && e.mml_ok && !(e.partial && eqCutRx.test(e.what || "")));
/* 수식 곁에 남은 글자 부스러기 (2026-11-07, 사용자: '식들 위아래로 뭔가 이상한 문자가 있다'): PDF 에서 식을 그림으로 자를 때 따로 떨어진 조각('m2'·'K'·'d'·'Va ='·'t+ − t− = δmax')이
   글에 남아 번역이 'm₂' 처럼 옮겼다 — 이미 만든 번역은 그대로이므로 화면이 숨긴다(새 번역은 서버가 자를 때 같이 담는다). 한글이 없고 짧고 긴 낱말이 없는 조각만,
   수식 그림이 든 문장 안의 것과 그 바로 앞뒤 문장(통째로 그런 것)만. 제목 줄은 건드리지 않는다. */

}
/* 나란히 선 수식 그림을 한 식으로 (2026-11-07): ① 번호와 전사가 같은 것 = 같은 줄을 두 번 자른 것 → 하나만 ② 번호가 같고 뒤 그림의 전사가 =·+·− 로 시작 = 한 식이 좌변·우변 두 그림으로 갈린 것(Piquard 2024 의 (23))
   → 두 줄로 이어 붙여 번호를 한 번만. 사이에 빈칸·숨긴 부스러기뿐일 때만 — 글이 끼어 있으면 다른 식이다 */

      if (eqNorm(e.latex) === eqNorm(last.parts[last.parts.length - 1].latex)) { last.dups.push(img); last.n = last.n || e.n; return; }

/* 표 칸의 맞춤 (2026-11-07): 크롬의 MathML Core 는 mtd 의 text-align 을 무시해 aligned 의 등호가 안 맞고 이어진 줄의 오른쪽 맞춤도 안 된다(사파리는 columnalign 으로 된다) —
   그려진 뒤 칸마다 내용이 선 자리를 재서 모자란 만큼 왼쪽 여백으로 민다. 이미 맞게 그린 엔진에서는 0 이라 바뀌지 않는다. 글자 크기를 줄인 뒤에 부른다 */

async function eqRenderM(doc, file, my) {

    units.forEach(u => {
      u.dups.forEach(d => d.remove());      /* 같은 줄을 두 번 자른 그림 */
      if (!u.ok || !u.imgs[0].isConnected) return;
      const fig = document.createElement("figure"); fig.className = "eqf";
      fig.innerHTML = "<div class='eqrow'><div class='mml'>" + esc(u.tex) + "</div>" + (u.n ? "<span class='eqno'>(" + esc(String(u.n)) + ")</span>" : "") + "</div>";
      u.imgs.forEach(img => { const orig = img.cloneNode(true); orig.className = "orig"; orig.hidden = true; fig.appendChild(orig); });      /* loading=lazy 그대로 — 누를 때 받는다; 이어 붙인 식은 원문 그림도 둘 */

    if (my !== view) return;
    keepView(() => items.forEach((x, i) => { const m = mml[i]; if (m && m.indexOf("<math") === 0 && m.indexOf("mErr") < 0) x.el.innerHTML = m; else { x.el.hidden = true; x.fig.querySelectorAll("img.orig").forEach(o => o.hidden = false); } }));   /* 엔진이 못 읽은 조각은 그림으로 */
    items.forEach(x => {      /* 폰 폭보다 긴 식은 글자를 줄여 맞춘다 (0.6배까지 — 그보다 길면 옆으로 굴린다). 한 번에 재면 2~3% 가 남아 굴림 막대가 생기므로 세 번까지 다시 잰다 */

      : "수식 " + imgs.length + "개가 원문 그림으로 보입니다 — 지금은 식으로 옮기지 못합니다 (Claude 호출을 확인해 주세요).";

function eqPollM(doc, file, my) {      /* 전사가 끝나면 다시 그린다 (10초마다, 10분까지) */
  let n = 0;

      ["사파리 주소 막대 옆의 ⋯ 를 누릅니다. 예전 모양의 사파리면 아래 가운데의 공유 단추(네모에서 화살표가 올라가는 모양)입니다.", "「공유」 를 누릅니다.", "목록을 아래로 내려 「홈 화면에 추가」 를 누릅니다. 안 보이면 목록 맨 아래 「동작 편집」 에서 「홈 화면에 추가」 를 켭니다.", "「웹 앱으로 열기」 가 켜져 있는지 보고 「추가」 를 누릅니다."]) :
      ["브라우저의 메뉴(⋮)를 누릅니다.", "「홈 화면에 추가」 를 누릅니다.", "「추가」 를 누릅니다."];
  openSheet("<h3>홈 화면에 추가</h3><div class='doc' style='padding:0;font-size:15.5px'><p>홈 화면에 두면 주소 막대 없이 앱처럼 열립니다. " + (ios ? "아이폰에서는 '웹 앱' 이라는 단추가 따로 없고, 공유 메뉴의 「홈 화면에 추가」 가 그것입니다." : "") + "</p><ol>" +
    steps.map(x => "<li>" + esc(x) + "</li>").join("") + "</ol><p style='color:var(--text-2);font-size:.92em'>홈 화면의 Athenaeum 으로 처음 열 때 한 번 다시 로그인합니다." + (ios && !crios ? "" : (ios ? " 사파리로 열어서 하면 「웹 앱으로 열기」 를 고를 수 있습니다." : "")) + "</p></div>");
}
function moreSheet() {
  openSheet("<h3>더 보기</h3>" + (isStandalone() ? "" : "<button class='mi' data-m='install'>홈 화면에 추가<span>앱처럼 열기</span></button>") + "<button class='mi' data-m='quiz'>단어 퀴즈<span>단어장</span></button><button class='mi' data-m='up'>PDF 올리기<span>받은 논문을 서재에</span></button><button class='mi' data-m='look'>글씨와 화면</button>" +
    "<a class='mi' href='/?desktop=1'>PC 화면으로 보기</a>" + (isRemote ? "<button class='mi red' data-m='out'>로그아웃</button>" : "") + "<input type='file' id='upf' accept='application/pdf,.pdf' multiple hidden>");
  sheet.onclick = async e => {
    const b = e.target.closest("[data-m]"); if (!b) return;
    const m = b.dataset.m;
    if (m === "look") return lookSheet();
    if (m === "install") return installSheet();
    if (m === "quiz") { closeSheet(); return openQuiz(); }
    if (m === "up") return $("upf").click();
    if (m === "out") { try { await api("/api/logout", {}); } catch (err) {} location.href = "/login"; }
  };
  $("upf").onchange = async e => {
    const files = [...e.target.files]; if (!files.length) return;
    closeSheet(); let ok = 0, bad = "";
    for (const f of files) {
      toast("올리는 중 · " + f.name, 60000);
      try { const r = await (await fetch("/api/upload?name=" + enc(f.name), { method: "POST", body: f })).json(); if (r.ok) ok++; else bad = r.error || "넣지 못했습니다"; } catch (err) { bad = "서버에 닿지 못했습니다"; }
    }
    toast(ok ? ok + "편을 서재에 넣었습니다" + (bad ? " · 나머지: " + bad : "") : bad, 5000);
    if (ok) { papersT = 0; loadPapers().catch(() => {}); }
  };
}
function openQuiz() {
  const d = document.createElement("div"); d.id = "quizbox";
  d.innerHTML = "<div class='qh'>단어 퀴즈<button class='nb' aria-label='닫기'>" + IC.close + "</button></div><iframe src='/vocab/quiz' title='단어 퀴즈'></iframe>";
  document.body.appendChild(d); d.querySelector("button").onclick = () => d.remove();
}

/* ---------- 누르기: 읽는 화면의 빈 곳 · 올라온 칸 · 그림 · 라벨 ---------- */
app.addEventListener("click", e => {
  const lab = e.target.closest("[data-lab]");
  if (lab) { e.preventDefault(); q = lab.dataset.lab; flt = "all"; lsSet("m_q", q); lsSet("m_flt", flt); delete pos["#/lib"]; location.hash = "#/lib"; return; }
  const tg = e.target.closest("[data-tabgo]"); if (tg) { e.preventDefault(); location.replace(tg.getAttribute("href")); return; }
  const rep = e.target.closest("[data-rep]"); if (rep) { e.preventDefault(); delete pos[rep.getAttribute("href")]; location.replace(rep.getAttribute("href")); return; }
  const mm = e.target.closest(".doc .eqf .mml"); if (mm) { mm.closest(".eqf").querySelectorAll("img.orig").forEach(o => o.hidden = !o.hidden); return; }      /* 식을 누르면 원문 그림(이어 붙인 식은 둘) */
  const pfo = e.target.closest(".pfo"); if (pfo) { const x = pfo.nextElementSibling; x.hidden = !x.hidden; pfo.textContent = x.hidden ? pfo.dataset.l : "접기"; return; }
  const im = e.target.closest("img.zm, .doc figure img, .doc img.eq");
  if (im && im.getAttribute("src")) { const fg = im.closest("figure"), fc = fg && fg.querySelector("figcaption"); openZoom(im.getAttribute("src"), fc ? fcHtml(fc) : ""); return; }
  if (!document.body.classList.contains("reading") || e.target.closest("a, button, summary, input, textarea, select, img, sup")) return;
  const sel = window.getSelection(); if (sel && !sel.isCollapsed) return;
  if (peekOpen()) return closePeek();
  document.body.classList.toggle("hidebars");      /* 읽는 글의 빈 곳을 누르면 위 막대가 나왔다 들어간다 */
});
peek.addEventListener("click", e => {
  if (e.target.closest(".px")) return closePeek();
  const b = e.target.closest("[data-pk]"), c = peekCtx;
  if (b && c) {
    if (b.dataset.pk === "ask") { askCtx = { quote: c.ko }; closePeek(); location.replace(pUrl(c.file, "ask")); }
    else if (b.dataset.pk === "memo") memoSheet(c.file, c.ko);
    else if (b.dataset.pk === "askst") studyAskSheet(studyCache[c.sid], c.ko, [c.key]);
    return;
  }
  if (e.target.closest("a[href^='#']")) closePeek();
});

/* ---------- 길 ---------- */
function onRoute() {
  if (pingLast) { try { pingLast(); } catch (e) {} pingLast = null; }      /* 읽는 화면을 떠날 때 읽던 자리를 한 번 더 알린다 (아직 그 화면이 그려져 있을 때) */
  flushPos(); clearInterval(pingT); clearInterval(pollT); clearTimeout(pollT); pollT = null; document.onvisibilitychange = null; refresh = null;
  closePeek(); if (sheet.classList.contains("on")) closeSheet(); setBars(true); { const qb = $("quizbox"); if (qb) qb.remove(); }
  curHash = location.hash; const my = ++view;
  const parts = location.hash.replace(/^#\/?/, "").split("/").map(x => { try { return decodeURIComponent(x); } catch (e) { return x; } });
  const r = parts[0] || "", depth = r === "p" || r === "n" ? 1 : r === "s" ? (parts[2] != null && parts[2] !== "" ? 2 : 1) : 0;
  const key = depth ? r + "/" + parts[1] + (depth === 2 ? "/x" : "") : "root";
  if (stack.length > 1 && stack[stack.length - 2] === key) stack.pop(); else if (stack[stack.length - 1] !== key) stack.push(key);
  app.classList.remove("push", "fade"); void app.offsetWidth;
  if (prevDepth >= 0) { if (depth > prevDepth) app.classList.add("push"); else if (depth === 0 && prevDepth === 0) app.classList.add("fade"); }
  clearTimeout(animT); animT = setTimeout(() => app.classList.remove("push", "fade"), 450);      /* 화면이 가려져 애니메이션이 멈춰도 내용은 보이게 */
  prevDepth = depth; lastY = 0; acc = 0; window.scrollTo(0, 0);
  const done = p => p && p.catch && p.catch(e => { if (my === view && String(e && e.message) !== "login") app.innerHTML = failHtml(); });
  if (r === "p" && parts[1]) return done(viewPaper(parts[1], parts[2], parts[3], my));
  if (r === "s" && parts[1]) return done(viewStudy(parts[1], parts.slice(2), my));
  if (r === "n" && parts[1]) return done(viewNote(parts[1], my));
  if (r === "lib") return done(viewLib(my));
  if (r === "study") return done(viewStudies(my));
  if (r === "notes") return done(viewNotes(my));
  return done(viewHome(my));
}
window.addEventListener("hashchange", onRoute);
document.addEventListener("visibilitychange", () => { if (!document.hidden && refresh && document.body.classList.contains("root")) { loadPapers().catch(() => {}); } });   /* 다시 열면 읽던 자리·새 논문을 새로 받는다 */
applyLook();
if (!location.hash && lastRoot !== "#/" && /^#\/(lib|study|notes)$/.test(lastRoot)) lastRoot = "#/";      /* 앱을 새로 열면 늘 「읽기」 부터 */
(async () => { try { isRemote = !!(await api("/api/version")).remote; } catch (e) {} })();   /* 다른 기기에서 열었는가 — 「로그아웃」 을 보일지 */
onRoute();
</script>
