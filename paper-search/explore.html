<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>논문 탐색</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font-family: "Malgun Gothic", sans-serif; font-size: 14px; color: #222; background: #f7f6f3; }
  header { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #fff;
           border-bottom: 1px solid #ddd; position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin-right: 6px; }
  header a { font-size: 13px; color: #3b5bd6; text-decoration: none; }
  #q { padding: 7px 12px; border: 1px solid #ccc; border-radius: 6px; width: 380px; font-size: 14px; }
  select, button { padding: 6px 10px; border: 1px solid #ccc; border-radius: 6px; background: #fff; font-size: 13px; }
  #go { background: #3b5bd6; color: #fff; border-color: #3b5bd6; cursor: pointer; }
  #info { margin-left: auto; font-size: 13px; color: #666; }
  #main { max-width: 1000px; margin: 0 auto; padding: 12px 16px 60px; }
  .row { background: #fff; border: 1px solid #e2e0da; border-radius: 8px; padding: 10px 14px; margin-bottom: 8px; }
  .row.owned { border-left: 4px solid #2456d6; }
  .title { font-size: 15px; color: #1a1a1a; cursor: pointer; line-height: 1.4; }
  .title:hover { color: #3b5bd6; }
  .meta { font-size: 12px; color: #777; margin: 3px 0; }
  .meta b { color: #444; }
  .abs { font-size: 12.5px; color: #555; line-height: 1.55; margin-top: 4px; display: -webkit-box;
         -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .abs.open { -webkit-line-clamp: unset; }
  .kw { display: inline-block; background: #f0efe9; color: #6b6a63; border-radius: 8px; padding: 1px 7px; font-size: 11px; margin: 4px 3px 0 0; }
  .btns { margin-top: 6px; display: flex; gap: 6px; }
  .btns button { font-size: 12px; padding: 3px 9px; cursor: pointer; }
  .hint { color: #888; font-size: 13px; padding: 30px 10px; text-align: center; line-height: 1.8; }
</style>
</head>
<body>
<header>
  <h1>🔎 논문 탐색</h1>
  <a href="/">← 내 논문 검색으로</a>
  <input id="q" placeholder="주제 키워드 (영어)  예: tantalum machining, built-up edge in situ">
  <select id="year">
    <option value="">전체 연도</option>
    <option value="2020">2020년 이후</option>
    <option value="2015">2015년 이후</option>
    <option value="2010">2010년 이후</option>
    <option value="2000">2000년 이후</option>
  </select>
  <select id="sort">
    <option value="relevance">관련도순</option>
    <option value="cited">피인용순</option>
    <option value="recent">최신순</option>
  </select>
  <button id="go">검색</button>
  <div id="info"></div>
</header>
<div id="main"><div class="hint">OpenAlex 전체 학술 DB(2억 5천만 편)에서 주제로 논문을 찾습니다.<br>
파란 줄 = 이미 보유한 논문 · 제목 클릭 = 논문 페이지(보유 시 PDF) · [관련맵] = 그 논문 주변 지도</div></div>
<script>
const main = document.getElementById("main"), info = document.getElementById("info");
const polling = {}, stages = {};

async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  info.textContent = "검색 중…";
  main.innerHTML = "";
  const params = new URLSearchParams({ q, year: document.getElementById("year").value, sort: document.getElementById("sort").value });
  const d = await (await fetch("/api/explore?" + params)).json();
  if (d.error) { info.textContent = ""; main.innerHTML = "<div class='hint'>⚠ " + d.error + "</div>"; return; }
  const owned = d.results.filter(r => r.owned).length;
  info.textContent = "전체 " + (d.total || 0).toLocaleString() + "편 중 상위 " + d.results.length + "편 · 보유 " + owned + "편";
  if (!d.results.length) main.innerHTML = "<div class='hint'>결과가 없습니다. 다른 키워드로 시도해보세요.</div>";
  for (const r of d.results) main.appendChild(renderRow(r));
}

function openPaper(r) {
  if (r.owned) fetch("/api/open", { method: "POST", body: JSON.stringify({ file: r.owned }) });
  else if (r.doi) window.open(r.doi);
}

function renderRow(r) {
  const row = document.createElement("div");
  row.className = "row" + (r.owned ? " owned" : "");
  const t = document.createElement("div"); t.className = "title"; t.textContent = r.title; t.onclick = () => openPaper(r);
  row.appendChild(t);
  const m = document.createElement("div"); m.className = "meta";
  m.innerHTML = (r.author || "?") + " · <b>" + (r.year || "?") + "</b>" + (r.venue ? " · " + r.venue : "") +
    " · 피인용 <b>" + r.cit + "</b>" + (r.owned ? " · <b style='color:#2456d6'>보유</b>" : "");
  row.appendChild(m);
  if (r.abstract) {
    const a = document.createElement("div"); a.className = "abs"; a.textContent = r.abstract;
    a.onclick = () => a.classList.toggle("open"); row.appendChild(a);
  }
  if (r.kw && r.kw.length) {
    const k = document.createElement("div");
    k.innerHTML = r.kw.map(x => "<span class='kw'>" + x + "</span>").join("");
    row.appendChild(k);
  }
  const btns = document.createElement("div"); btns.className = "btns";
  const open = document.createElement("button");
  open.textContent = r.owned ? "PDF 열기" : "논문 페이지";
  open.onclick = () => openPaper(r);
  btns.appendChild(open);
  btns.appendChild(mapButton(r));
  row.appendChild(btns);
  return row;
}

function mapButton(r) {
  const b = document.createElement("button");
  const name = r.owned ? r.owned : "ext_" + r.id.replace(/[^A-Za-z0-9]/g, "");
  const key = name + "|map";
  const refresh = (txt) => { b.textContent = txt; };
  if (polling[key]) { refresh(stages[key] || "맵 생성중"); b.disabled = true; return b; }
  refresh("관련맵");
  b.onclick = async () => {
    const body = r.owned ? { file: r.owned, kind: "map" } : { kind: "map", ext: { id: r.id, title: r.title, doi: r.doi } };
    const s0 = await (await fetch("/api/generate", { method: "POST", body: JSON.stringify(body) })).json();
    if (s0.status === "done") { window.open("/mapview?file=" + encodeURIComponent(name)); return; }
    b.disabled = true; refresh("맵 생성중");
    polling[key] = setInterval(async () => {
      const s = await (await fetch("/api/genstatus?file=" + encodeURIComponent(name) + "&kind=map")).json();
      if (s.status === "done") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵 보기"); b.style.color = "#1d7a4f";
        b.onclick = () => window.open("/mapview?file=" + encodeURIComponent(name));
        window.open("/mapview?file=" + encodeURIComponent(name));
      } else if (s.status === "error") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵");
        alert("맵 생성 실패: " + (s.error || "원인 불명"));
      } else if (s.stage) { stages[key] = s.stage; refresh(s.stage); }
    }, 5000);
  };
  return b;
}

document.getElementById("go").onclick = search;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
