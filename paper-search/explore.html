<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>탐색 · Athenaeum</title>
<link rel="stylesheet" href="/ui.css">
<style>
  header { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin-right: var(--s1); }
  header a { font-size: 12px; padding: 4px 8px; margin: 0 -4px; border-radius: var(--r); }
  header a:hover { background: var(--hover); text-decoration: none; }
  #q { width: 360px; }
  #go { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: var(--r); padding: 5px 12px; cursor: pointer; }
  header label { font-size: 12px; color: var(--text-2); cursor: pointer; }
  #info { margin-left: auto; font-size: 12px; color: var(--text-2); }
  #main { max-width: 1040px; margin: 0 auto; padding: 0 0 var(--s8); background: var(--surface); min-height: calc(100vh - 44px); }
  .row { padding: 10px 12px 11px; border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--hover); }
  body.embedded header, body.embedded #main { background: var(--panel); }
  body.embedded .row:hover { background: #ededea; }
  body.embedded .plan { background: var(--surface); }
  .title { font-family: var(--font-serif); font-size: 15px; font-weight: 400; line-height: 1.35; color: var(--text); cursor: pointer; margin-bottom: 2px; }
  .title:hover { color: var(--accent); }
  .meta { font-size: 12px; color: var(--text-2); margin: 1px 0; line-height: 1.4; }
  .meta b { color: var(--text-2); font-weight: 600; }
  .abs { font-size: 12px; color: var(--text-2); line-height: 1.5; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .abs.open { -webkit-line-clamp: unset; }
  .kws { margin-top: 2px; line-height: 1.5; }
  .kw { display: inline; font-size: 12px; color: var(--text-2); }
  .kw + .kw::before { content: " · "; color: var(--text-3); }
  .btns { margin: 3px 0 0 -8px; display: flex; gap: 2px; }
  .btns button { background: none; border: 0; color: var(--text-quiet); padding: 6px 8px; cursor: pointer; font-size: 12px; line-height: 1.3; border-radius: 0; }
  .row:hover .btns button { color: var(--text); }
  .btns button.ready, .row:hover .btns button.ready { color: var(--accent); font-weight: 500; }  /* 만들어진 관련맵 = 파랑 */
  .btns button:hover, .row:hover .btns button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .btns button:disabled, .row:hover .btns button:disabled { color: var(--text-3); text-decoration: none; cursor: default; }
  div.hint { color: var(--text-3); font-size: 12px; padding: var(--s6) var(--s2); text-align: center; line-height: 1.7; }
  .meta .hint, .row .hint { padding: 0; text-align: inherit; line-height: inherit; }
  .plan { margin: var(--s2) 12px; padding: 10px 12px; background: var(--bg); border-radius: var(--r); font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .plan .hint { padding: 0; line-height: inherit; }
  .plan .qs .qn { color: var(--text-3); font-size: 11px; margin-left: 3px; }
  .plan b { color: var(--text); }
  .plan .qs span { display: inline; color: var(--text-2); }
  .plan .qs span + span::before { content: " · "; color: var(--text-3); }
  .ghead { margin: var(--s4) 0 0; padding: var(--s1) 12px; border-bottom: 1px solid var(--line-2); }
  .ghead b { font-size: 13px; font-weight: 600; color: var(--text); }
  .ghead span { font-size: 12px; color: var(--text-2); margin-left: var(--s2); }
</style>
<script src="/ui.js"></script>
</head>
<body>
<header>
  <h1>논문 탐색</h1>
  <a href="/">← 내 논문 검색으로</a>
  <input id="q" placeholder="주제 키워드 (영어)  예: tantalum machining, built-up edge in situ">
  <select id="year">
    <option value="">전체 연도</option>
    <option value="2020">2020년 이후</option>
    <option value="2015">2015년 이후</option>
    <option value="2010">2010년 이후</option>
    <option value="2000">2000년 이후</option>
  </select>
  <select id="sort">
    <option value="relevance">관련도순</option>
    <option value="cited">피인용순</option>
    <option value="recent">최신순</option>
  </select>
  <button id="go">검색</button>
  <label><input type="checkbox" id="smart" checked> 스마트 탐색</label>
  <div id="info"></div>
</header>
<div id="main">
  <div id="smartbox"></div>
  <div id="plainbox"><div class="hint">OpenAlex 전체 학술 DB(2억 5천만 편)에서 주제로 논문을 찾습니다.<br>
  파란 줄 = 이미 보유한 논문 · 제목 클릭 = 논문 페이지(보유 시 PDF) · [관련맵] = 그 논문 주변 지도</div></div>
</div>
<script>
const main = document.getElementById("main"), info = document.getElementById("info");
mountUiControls("header");   // 글꼴 크기 · 다크 모드 (ui.js)
const smartbox = document.getElementById("smartbox"), plainbox = document.getElementById("plainbox");
const polling = {}, stages = {};

// 탐색 상태 저장/복원: 홈으로 갔다가 돌아와도 결과가 그대로 남도록
const STATE_KEY = "explore_state_v1";
function loadState() { try { return JSON.parse(localStorage.getItem(STATE_KEY) || "null"); } catch (e) { return null; } }
function saveState(patch) {
  const s = loadState() || {};
  Object.assign(s, patch);
  try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
}

async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const smart = document.getElementById("smart").checked;
  smartbox.innerHTML = "";
  plainbox.style.display = "";      // 이전 검색에서 접혀 있었으면 다시 펼침
  if (smartTimer) { clearInterval(smartTimer); smartTimer = null; }
  saveState({ q, year: document.getElementById("year").value, sort: document.getElementById("sort").value,
              smart, plain: null, smartKey: null, smartResult: null });
  if (smart) smartSearch(q);        // 백그라운드로 시작 (기다리지 않음)
  await plainSearch(q, smart);      // 기본 검색은 즉시 표시
}

async function plainSearch(q, withSmart) {
  info.textContent = "검색 중…";
  plainbox.innerHTML = "";
  const params = new URLSearchParams({ q, year: document.getElementById("year").value, sort: document.getElementById("sort").value });
  const d = await (await fetch("/api/explore?" + params)).json();
  if (d.error) { plainbox.innerHTML = "<div class='hint'>⚠ " + d.error + "</div>"; return; }
  saveState({ plain: d });
  renderPlain(d, withSmart);
}

function renderPlain(d, withSmart) {
  plainbox.innerHTML = "";
  const owned = d.results.filter(r => r.owned).length;
  info.textContent = "기본 " + d.results.length + "편 (전체 " + (d.total || 0).toLocaleString() + "편) · 보유 " + owned + "편" +
    (withSmart ? " · 스마트 결과 준비 중…" : "");
  const h = document.createElement("div"); h.className = "ghead";
  h.innerHTML = "<b>기본 검색 결과</b> <span>입력한 단어 그대로 · 전체 " + (d.total || 0).toLocaleString() +
    "편 중 상위 " + d.results.length + "편 · 보유 " + owned + "편</span>";
  plainbox.appendChild(h);
  if (!d.results.length) plainbox.innerHTML += "<div class='hint'>결과가 없습니다. 다른 키워드로 시도해보세요.</div>";
  for (const r of d.results) plainbox.appendChild(renderRow(r));
}

let smartTimer = null;
function smartProgressBox() {
  const prog = document.createElement("div"); prog.className = "plan";
  prog.innerHTML = "<div class='prog'><b>스마트 탐색</b><span id='sstage'>시작…</span>" + pbarHtml(0.02, 0, "wide") +
    "<span class='eta' id='seta'></span></div><div class='hint' style='margin-top:4px'>아래 기본 결과는 바로 보실 수 있습니다</div>";
  prog._phase = { a: 0, t: Date.now() };
  smartbox.appendChild(prog);
  return prog;
}

function pollSmart(key, prog) {
  if (smartTimer) clearInterval(smartTimer);
  smartTimer = setInterval(async () => {
    const s = await (await fetch("/api/smart_status?key=" + encodeURIComponent(key))).json();
    const st = document.getElementById("sstage");
    if (s.status === "running") {
      if (st) st.textContent = s.stage || "진행 중…";
      // 단계 '1/3 · 2/3 (k/n) · 3/3' → 채움 비율. 1·3단계(Claude)는 시간으로, 2단계(검색)는 k/n으로
      const m = /^(\d)\/3/.exec(s.stage || ""), a = m ? +m[1] : 1;
      const ph = prog._phase || { a: 0, t: Date.now() };
      if (ph.a !== a) { ph.a = a; ph.t = Date.now(); prog._phase = ph; }
      const m2 = /\((\d+)\/(\d+)\)/.exec(s.stage || "");
      const inner = m2 ? (+m2[1] / +m2[2]) : Math.min(0.9, (Date.now() - ph.t) / 1000 / 40);
      const frac = Math.min(0.96, (a - 1) / 3 + inner / 3), remain = Math.max(5, Math.round((1 - frac) * 110));
      const bar = prog.querySelector(".pbar"), eta = document.getElementById("seta");
      if (bar) { bar.setAttribute("data-to", Math.round(frac * 100)); animateBars(prog); }
      if (eta) eta.textContent = fmtEta(remain);
      return;
    }
    clearInterval(smartTimer); smartTimer = null;
    if (s.status === "none") { prog.innerHTML = "⚠ 스마트 탐색 결과가 사라졌습니다 (서버 재시작?) — 다시 검색해 주세요"; return; }
    if (s.status !== "done") { prog.innerHTML = "⚠ 스마트 탐색 실패: " + (s.error || "원인 불명"); return; }
    saveState({ smartResult: s.result });
    renderSmart(s.result);
  }, 3000);
}

async function smartSearch(q) {
  const year = document.getElementById("year").value;
  const prog = smartProgressBox();
  const start = await (await fetch("/api/smart", { method: "POST", body: JSON.stringify({ q, year }) })).json();
  if (!start.key) { prog.innerHTML = "⚠ 스마트 탐색 시작 실패: " + (start.error || ""); return; }
  saveState({ smartKey: start.key });
  pollSmart(start.key, prog);
}

// 페이지를 다시 열었을 때 이전 탐색 복원
(function restore() {
  const s = loadState();
  if (!s || !s.q) return;
  document.getElementById("q").value = s.q;
  if (s.year !== undefined) document.getElementById("year").value = s.year;
  if (s.sort) document.getElementById("sort").value = s.sort;
  document.getElementById("smart").checked = !!s.smart;
  if (s.plain) renderPlain(s.plain, s.smart);
  if (s.smartResult) renderSmart(s.smartResult);
  else if (s.smart && s.smartKey) pollSmart(s.smartKey, smartProgressBox());  // 아직 돌던 중이면 이어받기
})();

function renderSmart(r) {
  smartbox.innerHTML = "";
  const total = r.groups.reduce((a, g) => a + g.items.length, 0);
  const owned = r.groups.reduce((a, g) => a + g.items.filter(x => x.owned).length, 0);
  info.textContent = "관련 논문 " + total + "편 (후보 " + r.candidates + "편 중 " + r.excluded + "편 제외) · 보유 " + owned + "편";
  const plan = document.createElement("div"); plan.className = "plan";
  plan.innerHTML = "<b>스마트 탐색 결과</b> — <b>조사 의도:</b> " + r.intent +
    (r.exclude ? " <span class='hint'>(제외: " + r.exclude + ")</span>" : "") +
    "<div class='qs'><b>검색어 " + r.queries.length + "개:</b> " +
    r.queries.map(x => "<span title='OpenAlex 전체 " + x.total + "편'>" + x.q + "<span class='qn'>" + x.total + "</span></span>").join("") + "</div>";
  smartbox.appendChild(plan);
  for (const g of r.groups) {
    const h = document.createElement("div"); h.className = "ghead";
    h.innerHTML = "<b>" + g.name + "</b> <span>" + g.items.length + "편 · " + g.why + "</span>";
    smartbox.appendChild(h);
    for (const it of g.items) smartbox.appendChild(renderRow(it));
  }
  // 기본 결과는 아래에 접어두기 (클릭하면 펼침)
  const tog = document.createElement("div"); tog.className = "ghead"; tog.style.cursor = "pointer";
  tog.innerHTML = "<b>▸ 기본 검색 결과 보기</b> <span>입력 단어 그대로 검색한 원본 목록</span>";
  const savedPlain = plainbox; savedPlain.style.display = "none";
  tog.onclick = () => { const open = savedPlain.style.display === "none"; savedPlain.style.display = open ? "" : "none";
    tog.querySelector("b").textContent = (open ? "▾" : "▸") + " 기본 검색 결과 보기"; };
  smartbox.appendChild(tog);
}

function openPaper(r) {
  if (r.owned) fetch("/api/open", { method: "POST", body: JSON.stringify({ file: r.owned }) });
  else if (r.doi) window.open(r.doi);
}

function renderRow(r) {
  const row = document.createElement("div");
  row.className = "row" + (r.owned ? " owned" : "");
  const t = document.createElement("div"); t.className = "title"; t.textContent = r.title; t.onclick = () => openPaper(r);
  row.appendChild(t);
  const m = document.createElement("div"); m.className = "meta";
  m.innerHTML = (r.author || "?") + " · <b>" + (r.year || "?") + "</b>" + (r.venue ? " · " + r.venue : "") +
    " · 피인용 <b>" + r.cit + "</b>" + (r.owned ? " · <b style='color:var(--accent)'>보유</b>" : "");
  row.appendChild(m);
  if (r.abstract) {
    const a = document.createElement("div"); a.className = "abs"; a.textContent = r.abstract;
    a.onclick = () => a.classList.toggle("open"); row.appendChild(a);
  }
  if (r.kw && r.kw.length) {
    const k = document.createElement("div"); k.className = "kws";
    k.innerHTML = r.kw.map(x => "<span class='kw'>" + x + "</span>").join("");
    row.appendChild(k);
  }
  const btns = document.createElement("div"); btns.className = "btns";
  const open = document.createElement("button");
  open.textContent = r.owned ? "PDF 열기" : "논문 페이지";
  open.onclick = () => openPaper(r);
  btns.appendChild(open);
  btns.appendChild(mapButton(r));
  row.appendChild(btns);
  return row;
}

function mapButton(r) {
  const b = document.createElement("button");
  const name = r.owned ? r.owned : "ext_" + r.id.replace(/[^A-Za-z0-9]/g, "");
  const key = name + "|map";
  const refresh = (txt) => { b.textContent = txt; };
  const showBar = (s) => { const pi = progressInfo(s || {}, 45); b.innerHTML = "관련맵 " + pbarHtml(pi.frac, stages[key + "|frac"]) + "<span class='eta'>" + pi.text + "</span>"; stages[key + "|frac"] = pi.frac; animateBars(b); };
  if (polling[key]) { refresh(stages[key] || "맵 생성중"); b.disabled = true; return b; }
  refresh("관련맵");
  b.onclick = async () => {
    const body = r.owned ? { file: r.owned, kind: "map" } : { kind: "map", ext: { id: r.id, title: r.title, doi: r.doi } };
    const s0 = await (await fetch("/api/generate", { method: "POST", body: JSON.stringify(body) })).json();
    if (s0.status === "done") { window.open("/mapview?file=" + encodeURIComponent(name)); return; }
    b.disabled = true; showBar({});
    polling[key] = setInterval(async () => {
      const s = await (await fetch("/api/genstatus?file=" + encodeURIComponent(name) + "&kind=map")).json();
      if (s.status === "done") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵 보기"); b.classList.add("ready");
        b.onclick = () => window.open("/mapview?file=" + encodeURIComponent(name));
        window.open("/mapview?file=" + encodeURIComponent(name));
      } else if (s.status === "error") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵");
        alert("맵 생성 실패: " + (s.error || "원인 불명"));
      } else { stages[key] = s.stage; showBar(s); }
    }, 5000);
  };
  return b;
}

// 홈 화면 안의 분할 패널로 열렸으면 '내 논문 검색으로' 링크는 불필요
if (window.self !== window.top) {
  document.body.classList.add("embedded");  // 분할창 안: 배경을 연한 회색으로 (CSS body.embedded)
  const back = document.querySelector("header a[href='/']");
  if (back) back.style.display = "none";
}
document.getElementById("go").onclick = search;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
