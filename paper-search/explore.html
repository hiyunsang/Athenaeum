<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>탐색 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png"><link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="stylesheet" href="/ui.css">
<style>
  header { display: flex; align-items: center; gap: var(--s2); padding: var(--s2) var(--s4); background: var(--surface); border-bottom: 1px solid var(--line-2); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
  header h1 { font-size: 14px; font-weight: 600; margin-right: var(--s1); }
  header .brand-mark { height: 24px; width: auto; display: block; margin-right: 2px; }
  header a { font-size: 12px; padding: 4px 8px; margin: 0 -4px; border-radius: var(--r); }
  header a:hover { background: var(--hover); text-decoration: none; }
  #q { width: 360px; }
  #go { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: var(--r); padding: 5px 12px; cursor: pointer; }
  header label { font-size: 12px; color: var(--text-2); cursor: pointer; }
  #info { margin-left: auto; font-size: 12px; color: var(--text-2); }
  #main { max-width: 1040px; margin: 0 auto; padding: 0 0 var(--s8); background: var(--surface); min-height: calc(100vh - 44px); }
  body.mapwide #main { max-width: 1800px; }   /* 맵 보기: 큰 창이면 넓게 (목록 + 맵 + 정보 패널) */
  .row { padding: 10px 12px 11px; border-bottom: 1px solid var(--line); }
  .row:hover { background: var(--hover); }
  .title { font-family: var(--font-serif); font-size: 15px; font-weight: 400; line-height: 1.35; color: var(--text); cursor: pointer; margin-bottom: 2px; }
  .title:hover { color: var(--accent); }
  .meta .rv { color: var(--amber); }   /* 리뷰/총설 (OpenAlex 분류 또는 제목) */
  .meta { font-size: 12px; color: var(--text-2); margin: 1px 0; line-height: 1.4; }
  .meta b { color: var(--text-2); font-weight: 600; }
  .abs { font-size: 12px; color: var(--text-2); line-height: 1.5; margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
  .abs.open { -webkit-line-clamp: unset; }
  .kws { margin-top: 2px; line-height: 1.5; }
  .kw { display: inline; font-size: 12px; color: var(--text-2); }
  .kw + .kw::before { content: " · "; color: var(--text-3); }
  .btns { margin: 3px 0 0 -8px; display: flex; gap: 2px; }
  .btns button { background: none; border: 0; color: var(--text-quiet); padding: 6px 8px; cursor: pointer; font-size: 12px; line-height: 1.3; border-radius: 0; }
  .row:hover .btns button { color: var(--text); }
  .btns button.ready, .row:hover .btns button.ready { color: var(--accent); font-weight: 500; }  /* 만들어진 관련맵 = 파랑 */
  .btns button:hover, .row:hover .btns button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .btns button:disabled, .row:hover .btns button:disabled { color: var(--text-3); text-decoration: none; cursor: default; }
  div.hint { color: var(--text-3); font-size: 12px; padding: var(--s6) var(--s2); text-align: center; line-height: 1.7; }
  .meta .hint, .row .hint { padding: 0; text-align: inherit; line-height: inherit; }
  .plan { margin: var(--s2) 12px; padding: 10px 12px; background: var(--bg); border-radius: var(--r); font-size: 12px; color: var(--text-2); line-height: 1.6; }
  .plan .hint { padding: 0; line-height: inherit; }
  .plan .pl { display: grid; grid-template-columns: auto 88px 1fr; gap: var(--s2); align-items: center; padding: 3px 0; border-top: 1px solid var(--line); }
  .plan .pl:first-of-type { border-top: 0; }
  .plan .pl label { color: var(--text-2); white-space: nowrap; cursor: pointer; }
  .plan .pl .nm { font-weight: 600; color: var(--text); }
  .plan .pl input[type=text] { width: 100%; font: inherit; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); padding: 2px 0; }
  .plan .pl input[type=text]:focus { outline: 0; border-bottom-color: var(--accent); }
  .plan .qs span[title] { cursor: help; }
  .plan .rerun { margin-top: var(--s1); }
  .meta .hit { color: var(--accent); }   /* 선택 개념 중 이 논문이 해당하는 것 (LPBF, DSS …) */
  .vbar { display: flex; align-items: center; gap: var(--s2); margin: var(--s2) 12px 0; font-size: 12px; color: var(--text-2); }
  .vbar .act { padding: 2px 6px; }
  .vbar .act.on { color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .mapctl { display: flex; align-items: center; gap: var(--s2); margin: var(--s2) 12px 0; font-size: 12px; color: var(--text-2); flex-wrap: wrap; }
  .mapctl input[type=range] { width: 160px; }
  .mapctl #mapctlHint { width: 100%; padding: 0; text-align: left; line-height: 1.5; }
  .mapctl .zoom { margin-left: auto; display: flex; gap: 2px; }
  .mapctl .zoom .act { padding: 0 6px; font-size: 13px; }
  .mapwrap { position: relative; margin: var(--s2) 12px 0; border: 1px solid var(--line); background: var(--surface); display: flex; align-items: stretch; }
  .mapwrap canvas { display: block; flex: none; }
  .maplist { flex: none; width: 280px; overflow-y: auto; border-right: 1px solid var(--line); font-size: 12px; }
  .maplist .gh { padding: 8px 10px 4px; color: var(--text-2); font-weight: 600; display: flex; align-items: center; gap: 6px; position: sticky; top: 0; background: var(--surface); }
  .maplist .gh i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .maplist .gh .n { color: var(--text-3); font-weight: 400; }
  .maplist .mrow { display: block; padding: 5px 10px 6px 24px; border-bottom: 1px solid var(--line); color: var(--text-2); text-decoration: none; cursor: pointer; }
  .maplist .mrow:hover { background: var(--hover); }
  .maplist .mrow.on { background: var(--sel-bg); box-shadow: inset 3px 0 0 var(--accent); }
  .maplist .mrow .ay { display: block; color: var(--text); }
  .maplist .mrow .tt { display: block; color: var(--text-3); font-size: 11.5px; line-height: 1.35; }
  .mappanel { position: absolute; top: 0; right: 0; bottom: 0; width: 320px; overflow-y: auto; background: var(--surface); border-left: 1px solid var(--line); padding: 12px 14px 16px; font-size: 12px; color: var(--text-2); box-sizing: border-box; z-index: 2; }
  .mappanel .x { position: absolute; top: 6px; right: 10px; font-size: 16px; }
  .mappanel h3 { font-family: var(--font-serif); font-weight: 500; font-size: 15px; line-height: 1.35; color: var(--text); margin: 4px 22px 8px 0; }
  .mappanel .meta { margin: 2px 0; }
  .mappanel .meta i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
  .mappanel .acts { display: flex; gap: var(--s3); margin: 10px 0; flex-wrap: wrap; }
  .mappanel .abs { color: var(--text-2); line-height: 1.55; margin: 8px 0 12px; font-size: 12px; }
  .mappanel .brief { margin: 8px 0; }
  .mappanel .abs.ko { color: var(--text); font-size: 12.5px; }
  .mappanel .abs.orig { color: var(--text-3); border-left: 2px solid var(--line); padding-left: 8px; }
  .mappanel .kb { color: var(--text); line-height: 1.6; font-size: 12.5px; margin: 0; padding: 8px 10px; background: var(--panel); border-radius: var(--r); }
  .mappanel .sub { font-weight: 600; color: var(--text); margin: 12px 0 2px; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
  .mappanel .nbrow { display: block; padding: 5px 0; border-bottom: 1px solid var(--line); color: var(--text-2); text-decoration: none; }
  .mappanel .nbrow:hover { color: var(--accent); }
  .mappanel .nbrow .t { display: block; color: var(--text-3); font-size: 11.5px; line-height: 1.35; }
  .mappanel .rv { color: var(--amber); }
  .maptip { position: absolute; max-width: 320px; background: var(--text); color: var(--surface); font-size: 12px; line-height: 1.5; padding: 6px 9px; border-radius: var(--r); pointer-events: none; z-index: 3; }
  .maptip .hint { color: var(--line-2); padding: 0; text-align: left; line-height: inherit; }
  .maplegend { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s4); margin: var(--s1) 12px var(--s2); font-size: 12px; color: var(--text-2); }
  .maplegend i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 4px; vertical-align: -1px; box-sizing: border-box; }
  .maplegend i.hollow { background: transparent !important; border: 1px solid var(--text-3); }
  .maplegend .grad { width: 44px; height: 10px; border-radius: 2px; background: linear-gradient(90deg, hsl(178, 26%, 76%), hsl(178, 26%, 30%)); }
  :root[data-theme=dark] .maplegend .grad { background: linear-gradient(90deg, hsl(178, 26%, 34%), hsl(178, 26%, 68%)); }
  .mapctl .cmode { display: flex; align-items: center; gap: 2px; margin-left: var(--s3); }
  .mapctl .cmode .act { padding: 0 5px; }
  .mapctl .cmode .act.on { color: var(--accent); font-weight: 600; }
  .maplegend .lg { cursor: pointer; }
  .maplegend .lg:hover, .maplegend .lg.on { color: var(--text); font-weight: 600; }
  .maplegend .hint { padding: 0; text-align: left; line-height: inherit; width: 100%; }
  .plan .qs .qn { color: var(--text-3); font-size: 11px; margin-left: 3px; }
  .plan b { color: var(--text); }
  .plan .qs span { display: inline; color: var(--text-2); }
  .plan .qs span + span::before { content: " · "; color: var(--text-3); }
  .ghead { margin: var(--s4) 0 0; padding: var(--s1) 12px; border-bottom: 1px solid var(--line-2); }
  .ghead b { font-size: 13px; font-weight: 600; color: var(--text); }
  .ghead span { font-size: 12px; color: var(--text-2); margin-left: var(--s2); }
  /* Claude 대화 패널 (오른쪽 고정, 좁은 화면에서는 아래) */
  body.chat #main { margin-right: 380px; }
  #chat { display: none; position: fixed; right: 0; top: 44px; bottom: 0; width: 380px; background: var(--panel); border-left: 1px solid var(--line-2); flex-direction: column; z-index: 4; }
  body.chat #chat { display: flex; }
  #chat .ch { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--text-2); }
  #chat .ch b { color: var(--text); }
  #chatlog { flex: 1; overflow-y: auto; padding: 10px 12px; }
  .msg { margin: 0 0 10px; padding: 8px 10px; border-radius: 8px; font-size: calc(13px * var(--read-scale, 1)); line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user { background: var(--surface); border: 1px solid var(--line); color: var(--text-2); }
  .msg.claude { background: var(--accent-bg, #e9eefb); color: var(--text); }
  .msg.claude b { font-weight: 600; }
  .msg .ref { color: var(--accent); cursor: pointer; font-weight: 600; } .msg .ref:hover { text-decoration: underline; }
  .msg .qline { display: inline-block; margin-top: 2px; padding: 1px 6px; border: 1px dashed var(--accent); border-radius: 4px; color: var(--accent); cursor: pointer; font-size: 12px; }
  #chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 6px 12px 0; }
  #chips span { font-size: 11px; color: var(--text-2); border: 1px solid var(--line-2); border-radius: 12px; padding: 2px 8px; cursor: pointer; }
  #chips span:hover { color: var(--accent); border-color: var(--accent); }
  #chatform { display: flex; gap: 6px; padding: 8px 12px 12px; border-top: 1px solid var(--line); }
  #chatq { flex: 1; resize: none; min-height: 38px; max-height: 140px; font-size: 13px; line-height: 1.45; }
  #chatsend { background: var(--accent); color: #fff; border: 1px solid var(--accent); border-radius: var(--r); padding: 0 12px; cursor: pointer; }
  #chatsend:disabled { opacity: .5; cursor: default; }
  .row.hl { outline: 2px solid var(--accent); outline-offset: -2px; background: var(--accent-bg, #e9eefb); }
  .row .n { font-size: 11px; color: var(--text-3); margin-right: 6px; font-variant-numeric: tabular-nums; }
  @media (max-width: 900px) {
    body.chat #main { margin-right: 0; margin-bottom: 46vh; }
    #chat { top: auto; left: 0; width: auto; height: 46vh; border-left: 0; border-top: 1px solid var(--line-2); }
  }
</style>
<script src="/ui.js"></script>
</head>
<body>
<header>
  <a href="/" target="_top" title="Athenaeum 홈"><img class="brand-mark" src="/logo/mark.svg" alt="Athenaeum"></a>
  <h1>논문 탐색</h1>
  <input id="q" placeholder="주제를 말로 적어도 됩니다 — 예: BUE 논문인데 in situ 로 본 것, 재료는 탄탈럼 / 이방성 금속 절삭 (LPBF 든 DSS 든) / tantalum machining">
  <select id="year">
    <option value="">전체 연도</option>
    <option value="2020">2020년 이후</option>
    <option value="2015">2015년 이후</option>
    <option value="2010">2010년 이후</option>
    <option value="2000">2000년 이후</option>
  </select>
  <select id="sort">
    <option value="relevance">관련도순</option>
    <option value="cited">피인용순</option>
    <option value="recent">최신순</option>
  </select>
  <button id="go">검색</button>
  <label><input type="checkbox" id="smart" checked> 스마트 탐색</label>
  <a href="#" id="chatToggle" title="지금 보이는 검색 결과를 놓고 Claude(Opus)와 이야기">Claude와 이야기</a>
  <div id="info"></div>
</header>
<div id="chat">
  <div class="ch"><b>Claude와 이야기</b><span id="chatctx">결과를 먼저 검색하세요</span><span style="margin-left:auto"></span><a href="#" id="chatClear" style="font-size:11px">대화 지우기</a><a href="#" id="chatClose" style="font-size:11px;margin-left:8px">닫기</a></div>
  <div id="chips"></div>
  <div id="chatlog"><div class="hint" style="padding:18px 6px">화면의 논문 목록을 Claude 가 함께 봅니다. 답에 나오는 [번호] 를 누르면 그 논문으로 이동합니다.<br>질문 예: 이 중 꼭 읽어야 할 다섯 편은? · 내가 아직 없는 핵심 논문은? · 이 주제의 연구 공백은? · 검색어를 더 제안해 줘</div></div>
  <div id="chatform"><textarea id="chatq" placeholder="질문 (Enter 로 보내기, Shift+Enter 줄바꿈)"></textarea><button id="chatsend">보내기</button></div>
</div>
<div id="main">
  <div id="smartbox"></div>
  <div id="plainbox"><div class="hint">OpenAlex 전체 학술 DB(2억 5천만 편)에서 주제로 논문을 찾습니다.<br>
  파란 줄 = 이미 보유한 논문 · 제목 클릭 = 논문 페이지(보유 시 PDF) · [관련맵] = 그 논문 주변 지도</div></div>
</div>
<script>
const main = document.getElementById("main"), info = document.getElementById("info");
mountUiControls("header");   // 글꼴 크기 · 다크 모드 (ui.js)
const smartbox = document.getElementById("smartbox"), plainbox = document.getElementById("plainbox");
const polling = {}, stages = {};
let rowSeq = 0; const rowIndex = {};   // 화면 번호 → 논문 (Claude 대화에서 [n] 으로 가리킴). 복원(restore) 이 먼저 돌므로 맨 위에 선언

// 탐색 상태 저장/복원: 홈으로 갔다가 돌아와도 결과가 그대로 남도록
const STATE_KEY = "explore_state_v1";
function loadState() { try { return JSON.parse(localStorage.getItem(STATE_KEY) || "null"); } catch (e) { return null; } }
function saveState(patch) {
  const s = loadState() || {};
  Object.assign(s, patch);
  try { localStorage.setItem(STATE_KEY, JSON.stringify(s)); } catch (e) {}
}

// 한국어가 섞였거나 문장처럼 길면 기본 검색(영어 단어 AND)으로는 못 찾는다 → 스마트 탐색(Claude 검색 계획)으로
function needsSmart(q) { return /[가-힣]/.test(q) || q.split(/\s+/).length >= 6; }

async function search() {
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const smartBox = document.getElementById("smart");
  const korean = /[가-힣]/.test(q);
  if (needsSmart(q) && !smartBox.checked) smartBox.checked = true;   // 말로 적은 검색은 스마트 탐색이 필요
  const smart = smartBox.checked;
  smartbox.innerHTML = "";
  plainbox.style.display = "";      // 이전 검색에서 접혀 있었으면 다시 펼침
  if (smartTimer) { clearInterval(smartTimer); smartTimer = null; }
  saveState({ q, year: document.getElementById("year").value, sort: document.getElementById("sort").value,
              smart, plain: null, smartKey: null, smartResult: null });
  if (smart) smartSearch(q);        // 백그라운드로 시작 (기다리지 않음)
  if (korean) {                     // 한국어는 OpenAlex 기본 검색이 안 되므로 안내만
    plainbox.innerHTML = "<div class='hint'>한국어·문장 검색은 스마트 탐색이 Claude 로 검색 계획을 세워 찾습니다 (1~2분). 기본 검색은 영어 키워드만 됩니다.</div>";
    info.textContent = "스마트 탐색 준비 중…";
    return;
  }
  await plainSearch(q, smart);      // 기본 검색은 즉시 표시
}

async function plainSearch(q, withSmart) {
  info.textContent = "검색 중…";
  plainbox.innerHTML = "";
  const params = new URLSearchParams({ q, year: document.getElementById("year").value, sort: document.getElementById("sort").value });
  const d = await (await fetch("/api/explore?" + params)).json();
  if (d.error) { plainbox.innerHTML = "<div class='hint'>⚠ " + linkify(d.error) + "</div>"; return; }
  saveState({ plain: d });
  renderPlain(d, withSmart);
}

function renderPlain(d, withSmart) {
  plainbox.innerHTML = ""; if (!smartbox.querySelector(".row")) { rowSeq = 0; for (const k in rowIndex) delete rowIndex[k]; }
  const owned = d.results.filter(r => r.owned).length;
  info.textContent = "기본 " + d.results.length + "편 (전체 " + (d.total || 0).toLocaleString() + "편) · 보유 " + owned + "편" +
    (d.relaxed ? " · 단어가 다 들어간 논문이 적어 느슨하게 찾음" : "") + (withSmart ? " · 스마트 결과 준비 중…" : "");
  const h = document.createElement("div"); h.className = "ghead";
  h.innerHTML = "<b>기본 검색 결과</b> <span>입력한 단어 그대로 · 전체 " + (d.total || 0).toLocaleString() +
    "편 중 상위 " + d.results.length + "편 · 보유 " + owned + "편</span>";
  plainbox.appendChild(h);
  if (!d.results.length) plainbox.innerHTML += "<div class='hint'>결과가 없습니다. 다른 키워드로 시도해보세요.</div>";
  renderPlainRows(d);
}
function renderPlainRows(d) { for (const r of d.results) plainbox.appendChild(renderRow(r)); chatCtx(); }

let smartTimer = null;
function smartProgressBox(rerun) {
  const prog = document.createElement("div"); prog.className = "plan";
  prog.innerHTML = "<div class='prog'><b>" + (rerun ? "다시 검색" : "스마트 탐색") + "</b><span id='sstage'>시작…</span>" + pbarHtml(0.02, 0, "wide") +
    "<span class='eta' id='seta'></span></div><div class='hint' style='margin-top:4px'>" +
    (rerun ? "고친 검색 계획으로 OpenAlex 검색 → Claude 선별·분류 순서로 진행합니다. 끝나면 이 자리에 새 결과가 뜹니다" : "아래 기본 결과는 바로 보실 수 있습니다") + "</div>";
  prog._phase = { a: 0, t: Date.now() };
  smartbox.appendChild(prog);
  return prog;
}

function pollSmart(key, prog) {
  if (smartTimer) clearInterval(smartTimer);
  smartTimer = setInterval(async () => {
    const s = await (await fetch("/api/smart_status?key=" + encodeURIComponent(key))).json();
    const st = document.getElementById("sstage");
    if (s.status === "running") {
      if (st) st.textContent = s.stage || "진행 중…";
      // 단계 '1/3 · 2/3 (k/n) · 3/3' → 채움 비율. 1·3단계(Claude)는 시간으로, 2단계(검색)는 k/n으로
      const m = /^(\d)\/3/.exec(s.stage || ""), a = m ? +m[1] : 1;
      const ph = prog._phase || { a: 0, t: Date.now() };

        catch (err) { panel.querySelector(".absbox").innerHTML = absHtml(n) + "<p class='hint' style='padding:0'>번역 실패 — " + escH(err.message) + "</p>"; bindAbs(); }

  const at = (x, y) => { for (let i = nodes.length - 1; i >= 0; i--) { const n = nodes[i], rr = n.r * zr() + 4 / k, dx = x - n.x, dy = y - n.y; if (dx * dx + dy * dy <= rr * rr) return n; } return null; };
  // 마우스 위치 → [월드 x, 월드 y, 캔버스 x, 캔버스 y, CSS x, CSS y]
  const where = (e) => { const rc = cv.getBoundingClientRect(), px = e.clientX - rc.left, py = e.clientY - rc.top, sx = px * (W / rc.width), sy = py * (H / rc.height); return [(sx - tx) / k, (sy - ty) / k, sx, sy, px, py, rc]; };

  slider.oninput = () => { cohesion = parseFloat(slider.value); try { localStorage.setItem("explore_map_cohesion2", String(cohesion)); } catch (e) {} relayout(cohesion); };
  // 범례: 마우스를 올리면 그 소주제만 강조, 누르면 고정(다시 누르면 해제)
  legend.querySelectorAll(".lg").forEach(el => {
    const gi = +el.dataset.g;
    el.onmouseenter = () => { if (!focusPinned) { focusG = gi; draw(); } };
    el.onmouseleave = () => { if (!focusPinned) { focusG = null; draw(); } };
    el.onclick = () => { if (focusPinned && focusG === gi) { focusPinned = false; focusG = null; } else { focusPinned = true; focusG = gi; }

      legend.querySelectorAll(".lg").forEach(x => x.classList.toggle("on", focusPinned && +x.dataset.g === focusG)); draw(); };
  });
  if (focusPinned) legend.querySelectorAll(".lg").forEach(x => x.classList.toggle("on", +x.dataset.g === focusG));
  if (LIST_W) {   // 왼쪽 목록: 소주제별, 피인용 순. 줄을 누르면 선택, 올리면 맵의 원이 도드라짐
    m.groups.forEach((g, gi) => {
      const ns = nodes.filter(n => n.g === gi).sort((a, b) => b.cit - a.cit);
      if (!ns.length) return;
      const gh = document.createElement("div"); gh.className = "gh";
      gh.innerHTML = "<i style='background:" + gcolor(gi) + "'></i><span>" + escH(g) + "</span><span class='n'>" + ns.length + "</span>"; list.appendChild(gh);

        a.innerHTML = "<span class='ay'>" + escH(n.author || "?") + ", " + (n.year || "?") + (n.owned ? " · 보유" : "") + (n.review ? " · Review" : "") + "</span><span class='tt'>" + escH(n.title) + "</span>";

  if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (!animRun) draw(); });   // 글꼴이 늦게 오면 다시

  }
}

function openPaper(r) {
  if (r.owned) fetch("/api/open", { method: "POST", body: JSON.stringify({ file: r.owned }) });
  else if (r.doi) window.open(r.doi);
}

// 오류문 안의 주소(OpenAlex 키 안내 등)를 눌러서 열 수 있게
function linkify(s) { return escH(s).replace(/(https?:\/\/[^\s<]+)/g, "<a href='$1' target='_blank'>$1</a>"); }
function escH(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function renderRow(r) {
  const row = document.createElement("div");
  row.className = "row" + (r.owned ? " owned" : "");
  r._n = ++rowSeq; rowIndex[r._n] = r; row.dataset.n = r._n;
  const t = document.createElement("div"); t.className = "title";
  const nn = document.createElement("span"); nn.className = "n"; nn.textContent = r._n; t.appendChild(nn);
  t.appendChild(document.createTextNode(r.title)); t.onclick = () => openPaper(r);
  row.appendChild(t);
  const m = document.createElement("div"); m.className = "meta";
  m.innerHTML = (r.author || "?") + " · <b>" + (r.year || "?") + "</b>" + (r.venue ? " · " + r.venue : "") +
    " · 피인용 <b>" + r.cit + "</b>" + (r.review ? " · <b class='rv'>Review</b>" : "") +
    ((r.hits && r.hits.length) ? " · <span class='hit'>" + r.hits.map(escH).join(" · ") + "</span>" : "") +
    (r.owned ? " · <b style='color:var(--accent)'>보유</b>" : "");
  row.appendChild(m);
  if (r.abstract) {
    const a = document.createElement("div"); a.className = "abs"; a.textContent = r.abstract;
    a.onclick = () => a.classList.toggle("open"); row.appendChild(a);
  }
  if (r.kw && r.kw.length) {
    const k = document.createElement("div"); k.className = "kws";

    row.appendChild(k);

  open.textContent = r.owned ? "PDF 열기" : "논문 페이지";
  open.onclick = () => openPaper(r);
  btns.appendChild(open);
  btns.appendChild(mapButton(r));
  row.appendChild(btns);

function mapButton(r) {
  const b = document.createElement("button");
  const name = r.owned ? r.owned : "ext_" + r.id.replace(/[^A-Za-z0-9]/g, "");
  const key = name + "|map";
  const refresh = (txt) => { b.textContent = txt; };
  const showBar = (s) => { const pi = progressInfo(s || {}, 45); b.innerHTML = "관련맵 " + pbarHtml(pi.frac, stages[key + "|frac"]) + "<span class='eta'>" + pi.text + "</span>"; stages[key + "|frac"] = pi.frac; animateBars(b); };
  if (polling[key]) { refresh(stages[key] || "맵 생성중"); b.disabled = true; return b; }
  refresh("관련맵");
  b.onclick = async () => {
    const body = r.owned ? { file: r.owned, kind: "map" } : { kind: "map", ext: { id: r.id, title: r.title, doi: r.doi } };
    const s0 = await (await fetch("/api/generate", { method: "POST", body: JSON.stringify(body) })).json();
    if (s0.status === "done") { window.open("/mapview?file=" + encodeURIComponent(name)); return; }
    b.disabled = true; showBar({});
    polling[key] = setInterval(async () => {
      const s = await (await fetch("/api/genstatus?file=" + encodeURIComponent(name) + "&kind=map")).json();
      if (s.status === "done") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵 보기"); b.classList.add("ready");
        b.onclick = () => window.open("/mapview?file=" + encodeURIComponent(name));
        window.open("/mapview?file=" + encodeURIComponent(name));
      } else if (s.status === "error") {
        clearInterval(polling[key]); delete polling[key];
        b.disabled = false; refresh("관련맵");
        alert("맵 생성 실패: " + (s.error || "원인 불명"));
      } else { stages[key] = s.stage; showBar(s); }
    }, 5000);
  };
  return b;
}

// ---------- Claude(Opus)와 이야기: 화면의 결과 목록이 맥락 ----------
const CHAT_KEY = "explore_chat_v1";
let chatBusy = false;
function chatState() { try { return JSON.parse(localStorage.getItem(CHAT_KEY) || "null") || { q: "", msgs: [] }; } catch (e) { return { q: "", msgs: [] }; } }
function chatSave(st) { try { localStorage.setItem(CHAT_KEY, JSON.stringify(st)); } catch (e) {} }
function chatItems() {   // 화면에 보이는 순서대로 번호가 매겨진 논문 목록 (최대 80편)
  return Object.keys(rowIndex).map(Number).sort((a, b) => a - b).slice(0, 80).map(n => { const r = rowIndex[n];
    return { n, title: r.title, year: r.year, author: r.author, venue: r.venue, cit: r.cit, review: !!r.review, owned: !!r.owned, abstract: (r.abstract || "").slice(0, 280) }; });
}
function chatCtx() {
  const st = chatState(), s = loadState() || {}, n = Object.keys(rowIndex).length;
  const c = document.getElementById("chatctx"); if (c) c.textContent = n ? "지금 화면의 " + n + "편을 함께 봅니다" + (s.smartResult ? " · 스마트 분류 포함" : "") : "결과를 먼저 검색하세요";
  if (s.q && st.q && st.q !== s.q) { /* 다른 주제로 넘어가면 이전 대화는 접어 둔다 */ st.msgs = []; st.q = s.q; chatSave(st); renderChat(); }
  const chips = document.getElementById("chips");
  if (chips) chips.innerHTML = (n ? ["이 중 꼭 읽어야 할 다섯 편과 이유", "내가 아직 없는(★보유 아닌) 핵심 논문은?", "보유 논문과 새 논문의 관계를 정리해 줘", "이 주제의 연구 공백·미해결 문제는?", "검색어를 더 제안해 줘"] : ["이 주제를 조사하려면 어떤 검색어가 좋을까?"])
    .map(t => "<span>" + t + "</span>").join("");
  if (chips) chips.querySelectorAll("span").forEach(x => x.onclick = () => { document.getElementById("chatq").value = x.textContent; chatSend(); });
}
const escC = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
function fmtMsg(t) {
  let h = escC(t).replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\[(\d{1,3})\]/g, (m, n) => rowIndex[+n] ? "<span class='ref' data-n='" + n + "'>[" + n + "]</span>" : m);
  h = h.replace(/^(검색어\s*[:：]\s*)(.+)$/gm, (m, a, b) => a + b.split(/[,·;]|\s{2,}/).map(x => x.trim()).filter(Boolean).map(x => "<span class='qline' data-q='" + escC(x.replace(/^["'`]|["'`]$/g, "")) + "'>" + escC(x) + "</span>").join(" "));
  return h;
}
function renderChat() {
  const st = chatState(), log = document.getElementById("chatlog");
  if (!st.msgs.length) { log.innerHTML = "<div class='hint' style='padding:18px 6px'>화면의 논문 목록을 Claude 가 함께 봅니다. 답에 나오는 [번호] 를 누르면 그 논문으로 이동합니다.</div>"; return; }
  log.innerHTML = st.msgs.map(m => "<div class='msg " + m.role + "'>" + (m.role === "user" ? escC(m.text) : fmtMsg(m.text)) + "</div>").join("") + (chatBusy ? "<div class='msg claude'><span class='hint' style='padding:0'>생각 중… (Opus, 20~60초)</span></div>" : "");
  log.querySelectorAll(".ref").forEach(x => x.onclick = () => { const row = document.querySelector(".row[data-n='" + x.dataset.n + "']"); if (!row) return; document.querySelectorAll(".row.hl").forEach(y => y.classList.remove("hl")); row.classList.add("hl"); row.scrollIntoView({ block: "center", behavior: "smooth" }); });
  log.querySelectorAll(".qline").forEach(x => x.onclick = () => { document.getElementById("q").value = x.dataset.q; search(); });
  log.scrollTop = log.scrollHeight;
}
async function chatSend() {
  const ta = document.getElementById("chatq"), q = ta.value.trim(); if (!q || chatBusy) return;
  const s = loadState() || {}, st = chatState(); st.q = s.q || ""; st.msgs.push({ role: "user", text: q }); chatSave(st); ta.value = "";
  chatBusy = true; document.getElementById("chatsend").disabled = true; renderChat();
  try {
    const r = await (await fetch("/api/explore_chat", { method: "POST", body: JSON.stringify({ q: s.q || "", intent: s.smartResult ? s.smartResult.intent : "", items: chatItems(), history: st.msgs.slice(0, -1).slice(-8), question: q }) })).json();
    st.msgs.push({ role: "claude", text: r.error ? "⚠ " + r.error : r.answer });
  } catch (e) { st.msgs.push({ role: "claude", text: "⚠ 서버에 연결하지 못했습니다: " + e }); }
  chatBusy = false; document.getElementById("chatsend").disabled = false; chatSave(st); renderChat();
}
document.getElementById("chatToggle").onclick = e => { e.preventDefault(); document.body.classList.toggle("chat"); saveState({ chat: document.body.classList.contains("chat") }); if (document.body.classList.contains("chat")) { chatCtx(); renderChat(); document.getElementById("chatq").focus(); } };
document.getElementById("chatClose").onclick = e => { e.preventDefault(); document.body.classList.remove("chat"); saveState({ chat: false }); };
document.getElementById("chatClear").onclick = e => { e.preventDefault(); if (confirm("이 주제의 대화를 지울까요?")) { chatSave({ q: (loadState() || {}).q || "", msgs: [] }); renderChat(); } };
document.getElementById("chatsend").onclick = chatSend;
document.getElementById("chatq").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); chatSend(); } });
if ((loadState() || {}).chat) { document.body.classList.add("chat"); setTimeout(() => { chatCtx(); renderChat(); }, 50); }

document.getElementById("go").onclick = search;
document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") search(); });
</script>
</body>
</html>
