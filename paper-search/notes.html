<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>연구 노트 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg">
<link rel="stylesheet" href="/ui.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); min-height: 46px; background: var(--surface); border-bottom: 1px solid var(--line); }
  header .brand-mark { height: 24px; display: block; }
  header h1 { font-size: 14px; font-weight: 600; }
  #app { flex: 1; min-height: 0; display: grid; grid-template-columns: 268px minmax(0, 1fr) 6px var(--card-w, 380px); }
  #side { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; min-width: 0; padding-bottom: var(--s8); }
  #main { background: var(--surface); min-width: 0; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }   /* min-height·overflow 가 없으면 긴 답에서 가운데 칸이 창보다 길어져 묻는 칸이 화면 밖으로 밀린다 (사용자 2026-10-08: '왜 이어서 대화를 못하냐') */
  #cardsplit { cursor: col-resize; background: var(--line-2); }   /* 끌어서 오른쪽 칸의 폭을 바꾼다 (공부·탐색과 같은 방식) */
  #cardsplit:hover, #cardsplit.drag { background: var(--accent); }
  #cardp { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; padding: var(--s3) var(--s4) var(--s8); }
  /* 왼쪽: 새 주제 · 주제 목록(상태별) */
  .sideh { display: flex; align-items: center; gap: var(--s2); padding: 10px var(--s3) 4px; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); text-transform: uppercase; }
  .sideh .n { color: var(--text-3); font-weight: 400; }
  .newbox { padding: 0 var(--s3) var(--s3); border-bottom: 1px solid var(--line); }
  .newbox textarea { width: 100%; resize: vertical; min-height: 64px; }
  .newbox .primary { width: 100%; margin-top: var(--s2); }
  .newbox .hint { margin-top: var(--s2); line-height: 1.5; }
  .oi { display: block; padding: 7px var(--s3) 7px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.4; color: var(--text); border-left: 3px solid transparent; border-bottom: 1px solid var(--line); }
  .oi:hover { background: var(--hover); }
  .oi.on { background: var(--sel-bg); border-left-color: var(--accent); }
  .oi .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .oi .m { color: var(--text-3); font-size: 11px; margin-top: 2px; } .oi .m .run { color: var(--accent); }
  .empty { padding: var(--s4) var(--s3); color: var(--text-3); font-size: 12.5px; line-height: 1.6; }
  /* 가운데: 토의 */
  #thwrap { flex: 1; min-height: 0; overflow-y: auto; }
  .page { max-width: var(--read-width); margin: 0 auto; padding: var(--s5) var(--s6) var(--s6); }
  .th { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; padding-bottom: var(--s3); border-bottom: 1px solid var(--line); }
  .th textarea.tt { flex: 1; min-width: 240px; font-family: var(--font-serif); font-size: 20px; font-weight: 600; line-height: 1.3; border: 0; padding: 2px 0; background: transparent; resize: none; overflow: hidden; }   /* 긴 물음도 제목이 된다 — 줄바꿈해 다 보이게 */
  .th textarea.tt:focus { outline: none; border-bottom: 1px solid var(--accent); background: transparent; }
  .th select { padding: 3px 6px; font-size: 12px; }
  .th .m { width: 100%; color: var(--text-3); font-size: 12px; }
  .seed { margin: var(--s3) 0 0; padding: var(--s2) var(--s3); background: var(--panel); border-radius: var(--r); font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  .seed .k { color: var(--text-3); font-size: 11.5px; margin-bottom: 2px; white-space: normal; }
  #thread { padding-top: var(--s2); }
  .msg { padding: var(--s3) 0; border-bottom: 1px solid var(--line); line-height: 1.7; }
  .msg .who { font-size: 11px; color: var(--text-3); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; } .msg .who img { width: 16px; height: 16px; image-rendering: pixelated; }
  .msg.me { color: var(--text-2); } .msg.me .body { white-space: pre-wrap; }
  .msg p { margin: 0 0 .7em; white-space: pre-wrap; word-break: keep-all; } .msg p:last-child { margin-bottom: 0; }
  .msg p.beyond { background: var(--amber-bg); color: var(--amber); padding: 4px 8px; border-radius: var(--r); }
  .msg .go { display: block; margin: 2px 0; padding: 3px 0; color: var(--accent); text-align: left; }
  .msg .go::before { content: "↗ "; color: var(--text-3); }
  .waitbox { padding: var(--s3) 0; }
  .waitbox .hint { margin-top: 4px; }
  .warnbox { background: var(--amber-bg); color: var(--amber); border-radius: var(--r); padding: var(--s2) var(--s3); margin: var(--s3) 0; line-height: 1.55; }
  #askbox { flex: none; border-top: 1px solid var(--line); background: var(--surface); }
  #askbox .in { max-width: var(--read-width); margin: 0 auto; padding: var(--s3) var(--s6) var(--s4); }
  #askbox textarea { width: 100%; resize: vertical; min-height: 68px; max-height: 40vh; }
  #askbox .row { display: flex; gap: var(--s2); align-items: center; margin-top: var(--s2); flex-wrap: wrap; }
  #askbox .row select { padding: 3px 6px; font-size: 12px; } #askbox .row label { font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
  #askbox .row .primary { margin-left: auto; }
  #askbox .fsz .act { padding: 0 4px; }
  .welcome { padding: var(--s8) var(--s6); max-width: 560px; margin: 0 auto; color: var(--text-2); line-height: 1.7; font-size: 13.5px; }
  .welcome h2 { font-family: var(--font-serif); font-size: 22px; font-weight: 600; color: var(--text); margin: 0 0 var(--s3); }
  .welcome ul { padding-left: 1.2em; } .welcome li { margin-bottom: .35em; }
  /* 오른쪽: 주제 카드 */
  .cf { padding: 6px 0 2px; }
  .cf .k { font-size: 11px; font-weight: 600; letter-spacing: .03em; color: var(--text-2); text-transform: uppercase; margin-bottom: 3px; }
  .cf textarea { width: 100%; resize: none; min-height: 40px; overflow: hidden; line-height: 1.55; font-size: 12.5px; background: var(--surface); }
  .cf textarea:focus { background: var(--surface); }
  .cm { color: var(--text-3); font-size: 11.5px; margin: var(--s2) 0; line-height: 1.5; }
  .links .act { display: block; text-align: left; padding: 5px 0; }
  .kv { display: flex; gap: var(--s2); padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; } .kv span:first-child { color: var(--text-3); min-width: 6.5em; }
  /* 실험 설계서 · 반론 (2026-10-19) */
  .cites { margin-top: 3px; font-size: 11.5px; line-height: 1.6; } .cite { display: inline-block; margin-right: 6px; } .cite.ok { color: var(--accent); cursor: pointer; } .cite.no { color: var(--amber); }
  .pl { margin: 2px 0 0; padding-left: 1.1em; font-size: 12.5px; line-height: 1.55; } .pl li { margin-bottom: 3px; } .pl .act { padding: 0 4px; }
  .ipara { padding: 6px 0; border-top: 1px solid var(--line); font-size: 12.5px; line-height: 1.55; } .ipara .ih { display: flex; gap: 6px; align-items: baseline; } .ipara .no { color: var(--text-3); font-size: 11px; }
  .ipara .role { font-size: 11px; font-weight: 600; color: var(--accent); white-space: nowrap; } .ipara .len { margin-left: auto; color: var(--text-3); font-size: 11px; white-space: nowrap; }
  .ipara textarea { width: 100%; min-height: 34px; font: inherit; font-size: 12.5px; line-height: 1.5; padding: 3px 6px; border: 1px solid transparent; border-radius: var(--r); background: transparent; color: var(--text); resize: none; } .ipara textarea:focus { border-color: var(--line); background: var(--bg); }
  .ipara ul { margin: 2px 0 0; padding-left: 1.1em; } .ipara li { margin-bottom: 2px; color: var(--text-2); } .ipara li.beyond { color: var(--amber); } .ipara .ib { margin-top: 3px; } .ipara .ib .act { padding: 0 8px 0 0; }
  .idraft { margin: 6px 0 2px; padding: 6px 8px 4px; border-left: 2px solid var(--accent); background: var(--bg); border-radius: 0 var(--r) var(--r) 0; } .idraft.run { color: var(--accent); font-size: 12px; }
  .idraft .itext { font-size: 12.5px; line-height: 1.65; color: var(--text); white-space: pre-wrap; } .idraft .ians { font-size: 12px; line-height: 1.55; color: var(--text-2); margin-top: 4px; }
  .idraft .ichk { font-size: 11.5px; color: var(--text-2); margin-top: 3px; } .idraft .ichk summary { cursor: pointer; } .idraft .ichk ul, .idraft .ichk ol { margin: 2px 0 0; padding-left: 1.2em; } .idraft .ichk .v { color: var(--amber); }
  .irefs { font-size: 11.5px; line-height: 1.5; color: var(--text-2); padding-left: 1.6em; margin: 2px 0 0; }
  .iflow { font-size: 12.5px; line-height: 1.6; color: var(--text-2); margin: 4px 0 6px; } .ireq { width: 100%; font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--text); margin: 4px 0; }
  .dsgi { padding: 6px 0; border-bottom: 1px solid var(--line-2); font-size: 12px; line-height: 1.5; } .dsgi .dh { font-weight: 600; } .dsgi .dh .hint { display: inline; font-weight: 400; } .dsgi .dq { color: var(--text); margin-top: 1px; } .dsgi .dg { color: var(--text-2); } .dsgi .dm { color: var(--text-2); font-size: 11.5px; margin-top: 2px; } .dsgi .dr { font-weight: 600; color: var(--text-3); font-size: 11px; } .dsgi .dc { margin-top: 2px; font-size: 11.5px; color: var(--text-2); }
  .dsgt { width: 100%; border-collapse: collapse; font-size: 11.5px; line-height: 1.45; margin-top: 4px; } .dsgt th, .dsgt td { text-align: left; vertical-align: top; padding: 4px 6px 4px 0; border-bottom: 1px solid var(--line-2); } .dsgt th { color: var(--text-3); font-weight: 600; font-size: 11px; } .dsgt td .hint { display: inline; }
  .feas .fm { font-weight: 600; margin-right: 4px; } .feas .fm.ok { color: var(--accent); } .feas .fm.no { color: var(--amber); } .feas .fm.unk { color: var(--text-3); } .feas .fh { color: var(--text-2); }
  .labrow { display: flex; gap: 6px; align-items: center; } .labrow input { flex: 1; min-width: 0; font: inherit; font-size: 12.5px; padding: 4px 6px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--text); }
  .obj { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.55; } .obj .oh { display: flex; gap: 6px; align-items: center; font-size: 11px; flex-wrap: wrap; }
  .obj .who { font-weight: 600; color: var(--text-2); } .obj .sev { color: var(--text-3); } .obj .sev.high { color: var(--amber); font-weight: 600; }
  .obj .ot { margin-top: 3px; } .obj .oa { color: var(--text-2); margin-top: 2px; } .obj .or { color: var(--accent); margin-top: 2px; white-space: pre-wrap; } .obj .ob { margin-top: 3px; } .obj .ob .act { padding: 0 8px 0 0; }
  .objdone { margin-top: 4px; } .objdone .obj { opacity: .72; } .objdone summary { cursor: pointer; }
  .sec .n { font-weight: 400; color: var(--accent); margin-left: 4px; }
  .secline { display: flex; align-items: center; gap: 6px; } .secline .r { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; }
  @media (max-width: 1100px) { #app { grid-template-columns: 220px minmax(0, 1fr) 6px var(--card-w, 320px); } }
</style>
<script src="/ui.js"></script>
</head>
<body>
<header>
  <a href="/" target="_top" title="Athenaeum 홈"><img class="brand-mark" src="/logo/mark.svg" alt="Athenaeum"></a>
  <h1>연구 노트</h1>
  <span class="hint">연구 주제를 놓고 Claude 와 토의합니다 — Claude 는 서재의 논문 전부·공부 장·지난 탐색·원고를 알고 답합니다. 정해진 것은 오른쪽 주제 카드로.</span>
  <span style="margin-left:auto"></span>
</header>
<div id="app">
  <aside id="side">
    <div class="newbox">
      <div class="sideh">새 주제</div>
      <textarea id="newT" placeholder="연구 주제나 물음 (예: AM 금속의 이방성을 직교 절삭의 칩 생성으로 볼 수 있을까?)"></textarea>
      <button class="primary" id="newGo">주제 열기</button>
      <div class="hint">주제를 열고 첫 물음을 적으면 토의가 시작됩니다. 공부의 「답하지 못한 것」·탐색 결과에서도 열 수 있습니다.</div>
    </div>
    <div id="list"></div>
  </aside>
  <main id="main">
    <div id="thwrap"></div>
    <div id="askbox" hidden></div>
  </main>
  <div id="cardsplit" title="끌어서 오른쪽 칸의 폭을 바꿉니다 · 두 번 누르면 기본 폭"></div>
  <aside id="cardp"></aside>
</div>
<script>
mountUiControls("header");
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
async function api(path, body) { const r = await fetch(path, body ? { method: "POST", body: JSON.stringify(body) } : undefined); return r.json(); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const fmtDate = t => new Date(t * 1000).toLocaleString("ko", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const fmtDur = s => s < 60 ? Math.round(s) + "초" : Math.floor(s / 60) + "분" + (Math.round(s % 60) ? " " + Math.round(s % 60) + "초" : "");
const fmtTok = n => n >= 10000 ? (Math.round(n / 1000) / 10) + "만" : String(n || 0);
const EFFORT = { xhigh: "Opus · 엑스트라", max: "Opus · 최대", high: "Opus · 보통", fast: "Sonnet · 빠름" };
let META = { status: ["idea", "review", "adopt", "hold"], status_ko: { idea: "아이디어", review: "검토 중", adopt: "채택", hold: "보류" }, card_keys: [], card_ko: {}, plan_ko: {}, reviewer_ko: {} };
let items = [], cur = null, curId = lsGet("notes_last", ""), pollT = null, tick = null, draft = "", cardSaveT = null, bgStats = null, labInfo = null, labSaveT = null;
const URLP = new URLSearchParams(location.search);

// ---------- 목록 ----------
async function loadList() {
  let r; try { r = await api("/api/notes"); } catch (e) { return; }
  items = r.items || []; if (r.status) { META = r; META.plan_ko = Object.fromEntries(r.plan_keys || []); META.reviewer_ko = Object.fromEntries(r.reviewers || []); } renderList();
}
function renderList() {
  const el = $("list");
  if (!items.length) { el.innerHTML = "<div class='empty'>아직 주제가 없습니다. 위에 연구 주제나 물음을 적어 열어 보세요.</div>"; return; }
  let h = "";
  META.status.forEach(s => {
    const xs = items.filter(x => x.status === s); if (!xs.length) return;
    h += "<div class='sideh'>" + esc(META.status_ko[s] || s) + " <span class='n'>" + xs.length + "</span></div>";
    h += xs.map(x => "<a class='oi" + (cur && x.id === cur.id ? " on" : "") + "' data-id='" + esc(x.id) + "'><div class='t'>" + esc(x.title) + "</div><div class='m'>" + fmtDate(x.updated || x.t) +
      (x.pending ? " · <span class='run'>Claude 생각 중</span>" : x.answers ? " · 답 " + x.answers : " · 아직 묻지 않음") + (x.card ? " · 카드" : "") + (x.plan ? " · 설계서" : "") + (x.intro ? " · 서론" + (x.intro_drafts ? "(" + x.intro_drafts + "문단 씀)" : "") : "") + (x.open ? " · 반론 " + x.open : "") + (x.ms ? " · 원고" : "") + (x.busy ? " · <span class='run'>만드는 중</span>" : "") + "</div></a>").join("");
  });
  el.innerHTML = h;
  el.querySelectorAll(".oi").forEach(a => a.onclick = () => open(a.dataset.id));
}

// ---------- 주제 열기 ----------
async function open(id) {
  let r; try { r = await api("/api/notes/get?id=" + encodeURIComponent(id)); } catch (e) { return; }
  if (r.error || !r.note) { alert(r.error || "찾지 못했습니다"); return; }
  cur = r.note; curId = cur.id; lsSet("notes_last", curId); draft = "";
  try { history.replaceState(null, "", "/notes?id=" + encodeURIComponent(curId)); } catch (e) {}
  renderList(); renderMain(); renderCard(); schedulePoll();
  const w = $("thwrap"); w.scrollTop = w.scrollHeight;
}
async function refresh() {   // 답·카드가 왔는지 (읽던 자리·쓰던 글은 지킨다)
  if (!cur) return;
  let r; try { r = await api("/api/notes/get?id=" + encodeURIComponent(cur.id)); } catch (e) { return; }
  if (!cur || r.error || !r.note || r.note.id !== cur.id) return;
  const keys = n => [n.thread, n.pending, n.error, n.card, n.card_pending, n.card_error, n.plan, n.plan_pending, n.plan_error, n.plan_edited, n.objections, n.review_pending, n.review_error, n.ms, n.draft_pending, n.draft_error, n.intro, n.intro_pending, n.intro_error, n.intro_edited];
  const before = JSON.stringify(keys(cur)), after = JSON.stringify(keys(r.note));
  const wasPending = !!cur.pending;
  cur = r.note;
  if (before === after) return;
  (cur.thread || []).forEach(m => { if (m.role === "claude" && m.sec && (cur.opts || {}).effort) remember(cur.opts.effort, m.sec); });
  const w = $("thwrap"), atEnd = w.scrollHeight - w.scrollTop - w.clientHeight < 80;
  renderThread(); renderAsk(); renderCard(); renderListSoon();
  if (wasPending && !cur.pending || atEnd) w.scrollTop = w.scrollHeight;
}
let listT = null;
function renderListSoon() { clearTimeout(listT); listT = setTimeout(loadList, 300); }
function schedulePoll() {
  clearTimeout(pollT);
  const busy = () => cur && (cur.pending || cur.card_pending || cur.plan_pending || cur.review_pending || cur.draft_pending || cur.intro_pending || (cur.intro && cur.intro.writing));
  const loop = async () => { await refresh(); if (busy()) pollT = setTimeout(loop, 4000); };
  if (busy()) pollT = setTimeout(loop, 4000);
}

// ---------- 가운데: 토의 ----------
function renderMain() {
  if (!cur) {
    $("thwrap").innerHTML = "<div class='welcome'><h2>연구 노트</h2><p>'이런 연구 주제는 어떨까?' 를 놓고 Claude 와 따져 보는 곳입니다. Claude 는 묻는 순간 다음을 모두 알고 답합니다.</p><ul>" +
      "<li>서재의 논문 전부 — 편마다 연도·저널·저자·제목과 요약의 한 줄</li><li>공부로 쓴 장들 — 범위·물음·「이 서재로는 답하지 못한 것」·Claude 의 생각</li><li>지난 논문 탐색 — 검색어·소주제·저널·연구 그룹</li><li>서재가 많이 인용하는데 서재에 없는 논문</li><li>쓰고 있는 원고의 초록과 절</li></ul>" +
      "<p>왼쪽에서 주제를 열고 첫 물음을 적으세요. 정해진 것은 오른쪽 「주제 카드」 로 정리하고, 거기서 논문 탐색·공부로 이어집니다.</p><p class='hint'>첫 물음은 배경을 읽느라 1~2분 걸리고 토큰을 많이 읽습니다(그 뒤 한 시간은 캐시).</p></div>";
    $("askbox").hidden = true; return;
  }
  const st = META.status.map(s => "<option value='" + s + "'" + (cur.status === s ? " selected" : "") + ">" + esc(META.status_ko[s] || s) + "</option>").join("");
  let h = "<div class='page'><div class='th'><textarea class='tt' id='title' rows='1' title='주제 이름 — 고치면 바로 저장됩니다'>" + esc(cur.title) + "</textarea><select id='status' title='이 주제의 상태'>" + st + "</select>" +
    "<button class='act' id='mdBtn' title='카드와 토의를 md 글로 복사'>md 복사</button><button class='act warn' id='delBtn'>지우기</button>" +

      : "<button class='act' id='revGo'" + (answered ? "" : " disabled title='먼저 한 번은 토의해야 합니다'") + " title='실험 전문가 · 이론 전문가 · 저널 심사위원 셋이 설계서(없으면 토의)를 공격합니다 — 답한 반론은 되풀이하지 않습니다. Opus 1~3분'>" + (os.length ? "다시 심사" : "심사위원 셋의 반론") + "</button>") + "</span></div>";
  if (cur.review_error) h += "<div class='warnbox'>" + esc(cur.review_error) + "</div>";
  const item = o => "<div class='obj " + esc(o.status) + "'><div class='oh'><span class='who'>" + esc(META.reviewer_ko[o.who] || o.who) + "</span>" + (o.sec ? "<span class='hint' style='display:inline'>" + esc(META.plan_ko[o.sec] || o.sec) + "</span>" : "") +
    "<span class='sev " + esc(o.sev) + "'>" + ({ high: "중대", mid: "보통", low: "가벼움" }[o.sev] || "") + "</span></div><div class='ot'>" + esc(o.t) + "</div>" + (o.ask ? "<div class='oa'>물음: " + esc(o.ask) + "</div>" : "") + (o.reply ? "<div class='or'>답: " + esc(o.reply) + "</div>" : "") +
    "<div class='ob'>" + (o.status === "open" ? "<button class='act' data-reply='" + esc(o.id) + "' title='이 반론을 묻는 칸에 채워 Claude 와 따집니다'>대화로 답하기</button><button class='act' data-st='" + esc(o.id) + ":answered'>답함</button><button class='act' data-st='" + esc(o.id) + ":dropped'>보류</button>"
      : "<button class='act' data-st='" + esc(o.id) + ":open'>다시 열기</button>") + "</div></div>";
  h += open.map(item).join("");
  if (rest.length) h += "<details class='objdone'><summary class='hint'>답했거나 보류한 반론 " + rest.length + "</summary>" + rest.map(item).join("") + "</details>";
  if (!os.length && !pend) h += "<div class='hint' style='line-height:1.6'>설계서가 서면 세 심사위원이 가장 아픈 반론을 냅니다. 「대화로 답하기」 로 따진 뒤 「답함」 으로 접으면, 다음 설계서·원고 초안이 그 답을 반영합니다.</div>";
  return h;
}
function fit(t, min) { if (t.clientWidth < 80) return; t.style.height = "auto"; t.style.height = Math.max(min || 40, t.scrollHeight + 2) + "px"; }   // 숨은 탭에서는 폭이 0 이라 건너뛴다
async function saveCard() {
  if (!cur) return;

  h += "<div class='cf'><div class='k'>연구실 홈페이지</div><div class='labrow'><input id='labUrl' type='text' placeholder='https://…' value='" + esc(url) + "'><button class='act' id='labFetch' title='홈페이지의 글을 읽어 배경에 넣습니다 (장비·연구 분야 소개 쪽 주소가 좋습니다)'>홈페이지 읽기</button></div>" +
    (L.page_err ? "<div class='warnbox'>" + esc(L.page_err) + "</div>" : "") +
    (L.page ? "<div class='cm'>읽은 글 " + fmtTok(L.page.length) + " 자 · " + fmtDate(L.page_t) + " <a class='act' href='/api/notes/lab?text=1' target='_blank' title='홈페이지에서 읽은 글 그대로'>보기</a></div>" : "") + "</div>";

function bindLab() {
  const t = $("labText"), u = $("labUrl"), b = $("labFetch");
  if (t) { fit(t, 56); t.oninput = () => { fit(t, 56); clearTimeout(labSaveT); labSaveT = setTimeout(saveLab, 900); }; }
  if (u) u.onchange = () => { clearTimeout(labSaveT); saveLab(); };
  if (b) b.onclick = async () => {
    clearTimeout(labSaveT); await saveLab(); b.disabled = true; b.textContent = "읽는 중…";
    try { const r = await api("/api/notes", { op: "lab_fetch" }); if (r.lab) labInfo = r.lab; if (r.error && !r.lab) alert(r.error); } catch (e) { alert("서버 연결 실패"); }
    renderCard();
  };
}
async function saveLab() {
  const t = $("labText"), u = $("labUrl"); if (!t) return;

}

function openBig(path, name, feat) {
  let w = null;
  try { w = window.open("", name, feat); } catch (e) {}
  if (!w) { window.open(path, name, feat); return; }
  let fresh = true;
  try { fresh = !w.location || w.location.href === "about:blank" || w.location.pathname.indexOf(path.split("?")[0]) !== 0 || path.indexOf("?") > 0; } catch (e) {}
  if (fresh) w.location.href = path;
  try { w.focus(); } catch (e) {}
}
(function cardResize() {
  const sp = $("cardsplit"); if (!sp) return;
  const apply = w => document.documentElement.style.setProperty("--card-w", Math.round(w) + "px");
  const saved = +lsGet("notes_card_w", "0"); if (saved) apply(saved);
  sp.addEventListener("pointerdown", e => {
    e.preventDefault(); sp.classList.add("drag"); try { sp.setPointerCapture(e.pointerId); } catch (e2) {} let w = 0;
    const move = ev => { w = Math.min(Math.max(window.innerWidth - ev.clientX, 260), Math.max(300, window.innerWidth - 520)); apply(w); };
    const up = () => { sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); if (w) lsSet("notes_card_w", String(w)); $("cardp").querySelectorAll(".cf textarea").forEach(fit); };
    sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
  });
  sp.ondblclick = () => { document.documentElement.style.removeProperty("--card-w"); lsSet("notes_card_w", "0"); };
})();
$("newGo").onclick = async () => {

};
$("newT").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); $("newGo").click(); } });
