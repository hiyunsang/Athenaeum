<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>원고 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg"><link rel="icon" type="image/png" sizes="192x192" href="/logo/icon-192.png"><link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="stylesheet" href="/ui.css">
<style>
  header { display: flex; align-items: center; gap: var(--s3); min-height: 44px; padding: 0 var(--s4); background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
  header h1 { margin-right: var(--s2); line-height: 1; }
  header h1 .brand { display: inline-flex; align-items: center; gap: 8px; text-decoration: none; color: var(--text); font-family: var(--font-serif); font-size: 13px; font-weight: 400; letter-spacing: .22em; }
  header h1 .brand-mark { height: 26px; width: auto; display: block; }
  header a { font-size: 12px; color: var(--text-quiet); }
  header select { border-color: transparent; background: var(--bg); padding: 4px 8px; max-width: 320px; font-family: var(--font-serif); font-size: 14px; }
  header .sp { margin-left: auto; font-size: 12px; color: var(--text-3); }
  #layout { display: flex; height: calc(100vh - 44px); }
  #outline { width: 260px; min-width: 260px; background: var(--panel); border-right: 1px solid var(--line-2); overflow-y: auto; padding: var(--s2) 0 var(--s8); }
  #center { flex: 1; min-width: 0; overflow-y: auto; background: var(--surface); padding: var(--s4) var(--s6) var(--s8); }
  #drawer { width: 340px; min-width: 340px; background: var(--panel); border-left: 1px solid var(--line-2); overflow-y: auto; display: flex; flex-direction: column; }
  .sec { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); padding: var(--s3) var(--s3) var(--s1); display: flex; justify-content: space-between; align-items: center; }
  .sec .act { font-weight: 400; letter-spacing: 0; }
  .node { padding: 5px 10px 5px 12px; cursor: pointer; display: flex; align-items: baseline; gap: 6px; line-height: 1.4; font-size: 13px; color: var(--text); }
  .node.l2 { padding-left: 26px; font-size: 12.5px; }
  .node:hover { background: var(--hover); }
  .node.sel { box-shadow: inset 3px 0 0 var(--accent); background: var(--sel-bg); }
  .node .st { width: 8px; height: 8px; border-radius: 4px; background: var(--line-2); flex: none; align-self: center; }
  .node .st.drafted { background: var(--amber); } .node .st.done { background: var(--green); }
  .node .h { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-serif); }
  .node .n { color: var(--text-3); font-size: 11px; }
  .ctl { display: flex; gap: 2px; padding: 4px 10px; }
  .ctl button, .btn { background: none; border: 0; color: var(--text-quiet); font-size: 12px; padding: 4px 8px; cursor: pointer; border-radius: 0; }
  .ctl button:hover, .btn:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
  .btn.pri { color: var(--accent); font-weight: 500; }
  .btn:disabled { color: var(--text-3); text-decoration: none; cursor: default; }
  #center h2.title { font-family: var(--font-serif); font-size: 22px; font-weight: 400; margin: 0 0 var(--s1); }
  #center .crumb { font-size: 12px; color: var(--text-3); margin-bottom: var(--s4); }
  label.f { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); margin: var(--s4) 0 var(--s1); }
  textarea { width: 100%; box-sizing: border-box; border: 1px solid var(--line); border-radius: var(--r); padding: 8px 10px; font: inherit; font-size: 14px; line-height: 1.7; background: var(--surface); resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent); }
  #draft { min-height: 220px; font-size: calc(15px * var(--ms-scale, 1)); line-height: 1.8; }
  #draftEn { min-height: 160px; font-family: var(--font-serif); font-size: calc(14.5px * var(--ms-scale, 1)); }
  #fAbs, #fTitle { font-size: calc(14px * var(--ms-scale, 1)); }
  .card .t, .card .src, .issue { font-size: calc(12.5px * var(--ms-scale, 1)); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
  .cards { display: flex; flex-direction: column; gap: var(--s1); }
  .card { border: 1px solid var(--line); border-left: 3px solid var(--accent); padding: 6px 10px; font-size: 12.5px; line-height: 1.55; background: var(--surface); }
  .card .m { color: var(--text-3); font-size: 11px; display: flex; gap: var(--s2); align-items: baseline; }
  .card .m b { color: var(--text-2); font-weight: 600; }
  .card .m .id { font-family: ui-monospace, Consolas, monospace; }
  .card .t { margin-top: 2px; color: var(--text); }
  .card .src { color: var(--text-3); font-style: italic; margin-top: 2px; font-family: var(--font-serif); }
  .card .acts { margin-top: 2px; margin-left: -8px; }
  /* 피드백(워드 주석) 카드 */
  .card.fb { border-left-color: var(--amber); }
  .card.fb.done { opacity: .55; }
  .card.fb .t.reply { margin-left: 12px; color: var(--text-2); border-left: 2px solid var(--line-2); padding-left: 8px; }
  .card.fb .go { color: var(--text-quiet); text-decoration: none; } .card.fb .go:hover { color: var(--accent); }
  .fbmsg { margin: 6px 0; padding: 7px 9px; border-radius: 6px; font-size: calc(12.5px * var(--ms-scale, 1)); line-height: 1.6; white-space: pre-wrap; }
  .fbmsg.user { background: var(--bg); color: var(--text-2); } .fbmsg.claude { background: var(--accent-bg, #e9eefb); }
  .fbmsg b { color: var(--text); }
  .fbq { display: flex; gap: 6px; margin-top: 6px; } .fbq input { flex: 1; font-size: 12px; }
  .fbReply { width: 100%; margin-top: 6px; font-size: 12px; min-height: 28px; resize: none; overflow: hidden; box-sizing: border-box; }
  .fbprop { margin-top: 6px; padding: 8px 10px; border: 1px dashed var(--amber); border-radius: 6px; font-size: calc(12.5px * var(--ms-scale, 1)); line-height: 1.6; white-space: pre-wrap; }
  .fbtheme { padding: 6px 9px; border-left: 3px solid var(--amber); margin: 4px 0; font-size: 12.5px; line-height: 1.5; background: var(--surface); }
  .fbtheme .k { color: var(--text-3); font-size: 11px; margin-left: 6px; }
  .card.dim { opacity: .55; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
  .tabs div { padding: 8px 12px; font-size: 12px; color: var(--text-2); cursor: pointer; }
  .tabs div.on { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
  .tab { display: none; padding: var(--s2) var(--s3) var(--s8); }
  .tab.on { display: block; }
  .hint { font-size: 12px; color: var(--text-3); line-height: 1.6; }
  .prog { display: flex; align-items: center; gap: var(--s2); font-size: 12px; color: var(--text-2); margin: var(--s2) 0; }
  .prog .pbar { flex: 1; }
  .fig { border: 1px solid var(--line); padding: var(--s2); margin-bottom: var(--s2); background: var(--surface); }
  .fig img { width: 100%; display: block; background: #fff; }
  .fig .cap { font-size: 12px; color: var(--text-2); margin-top: 4px; }
  .form { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; font-size: 12px; }
  .form label { display: flex; flex-direction: column; gap: 2px; color: var(--text-2); }
  .form input, .form select { border: 1px solid var(--line); border-radius: var(--r); padding: 3px 6px; font: inherit; font-size: 12px; background: var(--surface); }
  .issue { font-size: 12.5px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .issue b { color: var(--amber); font-weight: 600; margin-right: 4px; }
  .rel { font-size: 12px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .rel .tt { font-family: var(--font-serif); color: var(--text); }
  .rel .mm { color: var(--text-3); font-size: 11px; }
  #empty { padding: var(--s8); text-align: center; color: var(--text-3); font-size: 13px; line-height: 1.8; }
  #empty button { margin-top: var(--s3); background: var(--accent); color: #fff; border: 0; border-radius: var(--r); padding: 7px 14px; cursor: pointer; }
  .gl { font-size: 12px; columns: 2; column-gap: 12px; }
  .gl div { break-inside: avoid; padding: 1px 0; color: var(--text-2); }
  .gl div b { color: var(--text); font-weight: 500; }
  input.inl { border: 0; border-bottom: 1px dashed var(--line-2); font: inherit; background: transparent; width: 100%; padding: 2px 0; }
  /* 그림 작업대 (그림 탭일 때 가운데 영역): 큰 미리보기 + 썸네일 띠 + 수정 요청 */
  .fstrip { display: flex; gap: var(--s2); overflow-x: auto; padding: var(--s1) 0 var(--s2); border-bottom: 1px solid var(--line); margin-bottom: var(--s3); }
  .fthumb { flex: none; width: 92px; cursor: pointer; border: 2px solid transparent; padding: 2px; }
  .fthumb img { width: 100%; height: 64px; object-fit: contain; background: #fff; display: block; border: 1px solid var(--line); }
  .fthumb .fn { font-size: 11px; color: var(--text-3); text-align: center; margin-top: 2px; }
  .fthumb.sel { border-color: var(--accent); }
  .fbig { background: #fff; border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; min-height: 320px; max-height: 66vh; }
  .fbig img { max-width: 100%; max-height: 66vh; object-fit: contain; display: block; }
  .fmeta { display: flex; gap: var(--s3); align-items: baseline; font-size: 12px; color: var(--text-3); margin: var(--s2) 0; flex-wrap: wrap; }
  .fmeta .ctl { margin-left: auto; padding: 0; }
  /* 원고 모드: 절 제목과 문단이 위에서 아래로 이어지는 큰 편집 화면 (워드처럼 펼쳐 놓고 쓰기) */
  header > *, header .btn, #modeSeg button { white-space: nowrap; flex-shrink: 0; }
  header #msSel { flex: 0 1 320px; min-width: 120px; }
  #modeSeg { display: inline-flex; gap: 0; margin-left: var(--s2); }
  #modeSeg button.on { color: var(--accent); font-weight: 600; box-shadow: inset 0 -2px 0 var(--accent); }
  .docmode .sec-h { font-family: var(--font-serif); font-size: 19px; font-weight: 700; margin: 26px 0 4px; color: var(--text); }
  .docmode .sec-h.l2 { font-size: 16px; margin-top: 18px; }
  .docmode .sec-h input.inl { font: inherit; color: var(--text); border-bottom-color: transparent; }
  .docmode .sec-h input.inl:hover, .docmode .sec-h input.inl:focus { border-bottom-color: var(--line-2); }
  .docmode textarea.para { width: 100%; border: 0; border-left: 2px solid transparent; border-radius: 0; padding: 4px 10px; font-size: calc(15px * var(--ms-scale, 1)); line-height: 1.85; resize: none; overflow: hidden; background: transparent; min-height: 40px; }
  .docmode textarea.para:focus { border-left-color: var(--accent); background: var(--sel-bg); outline: none; }
  .docmode .pm { display: flex; gap: 12px; font-size: 11px; color: var(--text-3); padding: 2px 10px 0; opacity: .55; align-items: center; }
  .docmode .dsec:hover .pm, .docmode .dsec:focus-within .pm { opacity: 1; }
  .docmode .pm .st { width: 7px; height: 7px; border-radius: 4px; background: var(--line-2); display: inline-block; }
  .docmode .pm .st.drafted { background: var(--amber); } .docmode .pm .st.done { background: var(--green); }
  .docmode .pm a { color: var(--text-quiet); } .docmode .pm a:hover { color: var(--accent); }
  /* 집중 쓰기: 개요·서랍 숨김, 글만 가운데 */
  body.focus #outline, body.focus #drawer { display: none; }
  body.focus #center { padding: 28px 0 80px; }
  body.focus #editor { max-width: 880px; margin: 0 auto; padding: 0 var(--s4); }
  #draft { min-height: 420px; overflow: hidden; }
  input.inl:focus { outline: none; border-bottom-color: var(--accent); }
</style>
<script src="/ui.js"></script>
</head>
<body>
<header>
  <h1><a class="brand" href="/" title="Athenaeum 홈"><img class="brand-mark" src="/logo/mark.svg" alt="">ATHENAEUM</a></h1>
  <a href="/" class="act">← 논문</a>
  <select id="msSel" title="원고 선택"></select>
  <button class="btn" id="newMs">+ 새 원고</button>
  <button class="btn" id="importMs" title="워드(.docx) 원고를 가져와 개요·문단·그림·참고문헌·주석으로 나눕니다">워드 가져오기</button>
  <input type="file" id="importFile" accept=".docx" style="display:none">
  <select id="journalSel" title="투고 저널 (규격 점검·머리부 생성에 반영)"><option value="">저널 선택…</option><option value="JMPT">JMPT (Elsevier)</option></select>
  <span id="modeSeg"><button class="btn" data-m="para" onclick="setMode('para')" title="주장·근거 카드·초안·검토를 문단 하나씩">문단 모드</button><button class="btn" data-m="doc" onclick="setMode('doc')" title="전체 원고를 펼쳐 놓고 이어서 쓰기">원고 모드</button></span>
  <button class="btn" id="focusBtn" onclick="toggleFocus()" title="개요·서랍을 숨기고 글에만 집중 (다시 누르면 복귀)">집중</button>
  <button class="btn" id="renameMs" title="제목 바꾸기">제목</button>
  <button class="btn warn" id="delMs" title="이 원고 삭제">삭제</button>
  <span class="sp" id="saveState"></span>
  <span id="uiCtlHost"></span>
</header>
<div id="layout">
  <div id="outline">
    <div class="sec">개요 <span><button class="btn act" id="addN1" title="절 추가">+ 절</button><button class="btn act" id="addN2" title="선택한 절 아래 소절/문단 추가">+ 소절</button></span></div>
    <div id="tree"></div>
    <div class="ctl"><button id="mvUp" title="위로">▲</button><button id="mvDn" title="아래로">▼</button><button id="delN" title="삭제">삭제</button><button id="reviewBtn" title="Claude가 개요의 논리 흐름을 검토">개요 검토</button></div>
    <div id="review" style="padding: 0 12px"></div>
  </div>
  <div id="center"><div id="empty">원고를 고르거나 새로 만드세요.<br>읽기 화면에서 구절을 드래그해 <b>원고에 담기</b>를 누르면 근거 카드가 쌓입니다.<br><button id="newMs2">+ 새 원고</button></div><div id="editor" style="display:none"></div></div>
  <div id="drawer">
    <div class="tabs"><div data-t="cards" class="on">카드</div><div data-t="figs">그림</div><div data-t="check">점검</div><div data-t="notes" title="워드에서 가져온 교수님·공저자 주석을 Claude 와 논의하고 문단에 반영">피드백</div><div data-t="idea">아이디어</div><div data-t="en">영문</div><div data-t="out">내보내기</div></div>
    <div class="tab on" id="tab-cards"></div>
    <div class="tab" id="tab-figs"></div>
    <div class="tab" id="tab-check"></div>
    <div class="tab" id="tab-notes"></div>
    <div class="tab" id="tab-idea"></div>
    <div class="tab" id="tab-en"></div>
    <div class="tab" id="tab-out"></div>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
mountUiControls("#uiCtlHost");   // 글꼴 크기 · 다크 모드 (ui.js)
let list = [], doc = null, cur = null, saveTimer = null, busy = false;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const short = f => { const m = /^(\d{4})_([A-Za-z0-9&-]+)_([^_]+)_/.exec(f || ""); return m ? m[3] + " " + m[1] : (f || "").slice(0, 24); };
const viewUrl = c => "/view?file=" + encodeURIComponent(c.source.file) + "&kind=" + (c.source.kind || "translation") + (c.source.sent ? "&sent=" + c.source.sent : "");
async function api(path, body) { const r = await fetch(path, body ? { method: "POST", body: JSON.stringify(body) } : undefined); return r.json(); }

// ---------- 목록 / 문서 ----------
async function loadList(selectId) {
  list = (await api("/api/ms/list")).items || [];
  $("msSel").innerHTML = "<option value=''>원고 선택…</option>" + list.map(m => "<option value='" + m.id + "'>" + esc(m.title) + " · 카드 " + m.cards + "</option>").join("");
  // 열 원고: 주소의 ?id= → 마지막에 본 원고 → 가장 최근에 고친 원고 (빈 화면은 원고가 하나도 없을 때만)
  const urlId = new URLSearchParams(location.search).get("id");
  let id = selectId || urlId || localStorage.getItem("ms_last");
  if (!(id && list.some(m => m.id === id)) && list.length) id = list[0].id;
  if (id && list.some(m => m.id === id)) { $("msSel").value = id; await openDoc(id); } else showEmpty();
}
function showEmpty() { doc = null; $("empty").style.display = ""; $("editor").style.display = "none"; $("tree").innerHTML = ""; renderDrawer(); }
async function openDoc(id) {
  doc = await api("/api/ms?id=" + encodeURIComponent(id));
  if (doc.error) return showEmpty();
  localStorage.setItem("ms_last", id);
  doc.front = doc.front || { title: "", authors: "", abstract: "", keywords: [], highlights: [] };
  doc.meta = doc.meta || {}; $("journalSel").value = doc.meta.journal || "";
  cur = (doc.outline[0] || {}).id || "front";
  $("empty").style.display = "none"; $("editor").style.display = "";
  renderAll();
}
function renderAll() { renderTree(); renderEditor(); renderDrawer(); }
function save(immediate) {
  if (!doc) return;
  clearTimeout(saveTimer); $("saveState").textContent = "저장 중…";
  const run = async () => { const r = await api("/api/ms/save", { data: doc }); $("saveState").textContent = r.ok ? "저장됨 " + new Date().toLocaleTimeString("ko", { hour: "2-digit", minute: "2-digit" }) : "⚠ 저장 실패"; };
  if (immediate) run(); else saveTimer = setTimeout(run, 700);
}
$("msSel").onchange = e => e.target.value ? openDoc(e.target.value) : showEmpty();
async function newMs() { const t = prompt("새 원고 제목:", ""); if (!t) return; const d = await api("/api/ms/new", { title: t }); await loadList(d.id); }
$("newMs").onclick = newMs; $("newMs2").onclick = newMs;
$("journalSel").onchange = e => { if (!doc) return; doc.meta.journal = e.target.value; save(true); renderCheck(); };
// 워드 가져오기: 파일을 base64 로 올려 서버가 개요·문단·그림·참고문헌·주석으로 나눔
$("importMs").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 60 * 1024 * 1024) { alert("60MB 이하 파일만 가져올 수 있습니다."); return; }
  $("saveState").textContent = "가져오는 중… (" + Math.round(f.size / 1024) + "KB)";
  const b64 = await new Promise(res => { const rd = new FileReader(); rd.onload = () => res(rd.result.split(",")[1]); rd.readAsDataURL(f); });
  const r = await api("/api/ms/import", { name: f.name, b64, journal: $("journalSel").value || "JMPT" });
  e.target.value = "";
  if (r.error) { alert("⚠ " + r.error); $("saveState").textContent = ""; return; }
  alert("가져왔습니다.\n절 " + r.nodes + "개 · 그림 " + r.figures + "장 · 참고문헌 " + r.refs + "편 · 공저자 주석 " + r.comments + "개");
  await loadList(r.id);
};
$("renameMs").onclick = () => { if (!doc) return; const t = prompt("원고 제목:", doc.title); if (t) { doc.title = t; save(true); renderEditor(); loadList(doc.id); } };
$("delMs").onclick = async () => { if (!doc) return; if (!confirm("「" + doc.title + "」 원고를 삭제할까요? (카드·초안 모두 삭제, 되돌릴 수 없음)")) return; await api("/api/ms/delete", { id: doc.id }); localStorage.removeItem("ms_last"); await loadList(); };

// ---------- 개요 트리 ----------
const node = id => doc.outline.find(n => n.id === id);
const nextId = (arr, p) => p + (Math.max(0, ...arr.map(x => parseInt(String(x.id).replace(p, ""), 10) || 0)) + 1);
function renderTree() {
  const f = doc.front || {};
  const frontOk = f.abstract && (f.highlights || []).length;
  $("tree").innerHTML = "<div class='node l1" + (cur === "front" ? " sel" : "") + "' data-id='front'><span class='st " + (frontOk ? "done" : (f.abstract ? "drafted" : "")) + "'></span><span class='h' style='font-family:var(--font)'>머리부 · 제목·초록·키워드·하이라이트</span></div>" +

  $("ideaGo").onclick = async () => {
    const q = $("ideaQ").value.trim(); if (!q || busy) return; busy = true;
    $("ideaprog").innerHTML = "<div class='prog'><span>문헌 검색·판단 중</span>" + pbarHtml(0.03, 0) + "<span class='eta'>~90초</span></div>";
    const t0 = Date.now(); const tm = setInterval(() => { const b = $("ideaprog").querySelector(".pbar i"); if (b) b.style.width = (Math.min(0.95, (Date.now() - t0) / 100000) * 100) + "%"; }, 1000);
    const r = await api("/api/ms/idea", { id: doc.id, question: q });
    clearInterval(tm); busy = false;
    if (r.error) { $("ideaprog").innerHTML = "<div class='hint'>⚠ " + esc(r.error) + "</div>"; return; }
    doc.idea = r; renderIdea();
  };
}
async function buildGlossary() {
  const r = await api("/api/ms/claude", { id: doc.id, mode: "glossary" });
  if (r.error) { alert("⚠ " + r.error); return; }
  doc.glossary = r.terms || []; renderEn();
}
function renderEn() {
  const el = $("tab-en"); if (!doc) { el.innerHTML = ""; return; }
  const g = doc.glossary || [];
  const done = doc.outline.filter(n => n.draft_en).length, tot = doc.outline.filter(n => n.draft).length;
  el.innerHTML = "<div class='sec'>영문화 <span class='hint' style='font-weight:400'>" + done + "/" + tot + " 문단</span></div>" +
    "<div class='hint'>한국어로 쓰고 마지막에 영어로 바꾸는 흐름입니다. 카드의 원문에서 뽑은 용어집이 번역에 강제되어 인용 논문과 같은 표기를 씁니다.</div>" +
    "<div class='ctl' style='padding:6px 0;margin-left:-8px'><button class='btn pri' id='glMake'>" + (g.length ? "용어집 다시 만들기" : "용어집 만들기") + "</button><button class='btn' id='enAll'>초안 있는 문단 전부 영문화</button></div><div id='enprog'></div>" +
    (g.length ? "<div class='sec'>용어집 " + g.length + "개</div><div class='gl'>" + g.map(t => "<div><b>" + esc(t.ko) + "</b> → " + esc(t.en) + "</div>").join("") + "</div>" : "");
  $("glMake").onclick = async () => { if (busy) return; busy = true; $("enprog").innerHTML = "<div class='hint'>용어집 추출 중… (~30초)</div>"; await buildGlossary(); busy = false; };
  $("enAll").onclick = async () => {
    if (busy) return; const todo = doc.outline.filter(n => n.draft && !n.draft_en); if (!todo.length) { alert("영문화할 문단이 없습니다."); return; }
    if (!g.length && doc.cards.some(c => c.src_text) && confirm("용어집을 먼저 만들까요? (권장)")) await buildGlossary();
    busy = true;
    for (let i = 0; i < todo.length; i++) {
      $("enprog").innerHTML = "<div class='prog'><span>영문화 " + (i + 1) + "/" + todo.length + " · " + esc(todo[i].heading) + "</span>" + pbarHtml((i + 0.3) / todo.length, i / todo.length) + "</div>";
      const r = await api("/api/ms/claude", { id: doc.id, node: todo[i].id, mode: "english" });
      if (r.error) { alert("⚠ " + r.error); break; }
      todo[i].draft_en = r.text; save(true);
    }
    busy = false; renderEn(); renderEditor();
  };
}
function renderOut() {
  const el = $("tab-out"); if (!doc) { el.innerHTML = ""; return; }
  const refs = new Set(); doc.outline.forEach(n => (n.draft || "").replace(/\[c(\d+)\]/g, (m, k) => { const c = doc.cards.find(x => x.id === "c" + k); if (c && c.source.file) refs.add(c.source.file); return m; }));
  el.innerHTML = "<div class='sec'>내보내기 (.docx)</div><div class='hint'>제목 → 절 제목 → 문단 → 그림(캡션 포함) → 참고문헌 순으로 워드 파일을 만듭니다. 초안의 [c3] 표시는 출처 논문의 등장 순서로 [1], [2]… 인용 번호가 되고, 참고문헌 목록이 자동으로 붙습니다. 서식(저널 템플릿)·공저자 교정은 워드에서.</div>" +
    "<div class='ctl' style='padding:8px 0;margin-left:-8px'><button class='btn pri' data-lang='ko'>한국어 .docx</button><button class='btn pri' data-lang='en'>영문 .docx</button><button class='btn' id='openFolder'>폴더 열기</button></div><div id='outmsg' class='hint'></div>" +
    "<div class='sec'>인용될 논문 " + refs.size + "편</div><div class='hint'>" + [...refs].map(short).join(" · ") + "</div>";
  el.querySelectorAll("[data-lang]").forEach(b => b.onclick = async () => { $("outmsg").textContent = "만드는 중…"; const r = await api("/api/ms/export", { id: doc.id, lang: b.dataset.lang }); $("outmsg").textContent = r.error ? "⚠ " + r.error : "저장됨: " + r.path; });
  $("openFolder").onclick = () => api("/api/ms/open_folder", {});
}

document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.m === msMode));
if (localStorage.getItem("ms_focus") === "1") { document.body.classList.add("focus"); $("focusBtn").classList.add("pri"); }
loadList();
</script>
</body>
