<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>논문 읽기</title>
<link rel="stylesheet" href="/ui.css">
<style>
  body { overflow: hidden; }
  #bar { height: 40px; display: flex; align-items: center; gap: var(--s2); padding: 0 var(--s3); background: var(--surface); border-bottom: 1px solid var(--line-2); font-size: 12px; }
  #bar .ttl { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
  #bar .ttl b { color: var(--text); font-weight: 500; margin-left: 6px; }
  #bar > a { padding: 4px 8px; margin: 0 -4px; border-radius: var(--r); }
  #bar > a:hover { background: var(--hover); text-decoration: none; }
  .tab { padding: 3px 10px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); cursor: pointer; font-size: 12px; white-space: nowrap; color: var(--text-2); }
  .tab.on { background: var(--sel-bg); color: var(--accent); border-color: var(--accent); font-weight: 600; }
  .tab:hover:not(.on) { color: var(--accent); border-color: var(--accent); }
  .tog { cursor: pointer; user-select: none; color: var(--text-2); white-space: nowrap; }
  #layout { display: flex; height: calc(100vh - 40px); }
  #side { width: 340px; min-width: 340px; border-right: 1px solid var(--line-2); background: var(--panel); overflow-y: auto; padding: var(--s2) var(--s3); display: none; font-size: 12px; }
  #side.on { display: block; }
  #side h3 { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); margin: var(--s3) 0 var(--s1); }
  textarea { width: 100%; min-height: 44px; font-size: 12px; }
  .btn { background: var(--surface); color: var(--text); border: 1px solid var(--line-2); border-radius: var(--r); padding: 4px 10px; cursor: pointer; font-size: 12px; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.pri { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.pri:hover { filter: brightness(.95); color: #fff; }
  .item { padding: 10px 12px 11px; margin: 0 -12px; border-bottom: 1px solid var(--line); position: relative; }
  .item:hover { background: var(--hover); }
  .item.sel { box-shadow: inset 3px 0 0 var(--accent); background: var(--sel-bg); }
  .item .t { font-size: 11px; color: var(--text-3); }
  .item .qt { font-size: 12px; color: var(--text-2); border-left: 2px solid var(--line-2); padding-left: var(--s2); margin: var(--s1) 0; white-space: pre-wrap; max-height: 3.2em; overflow: hidden; }
  .item .q { font-weight: 600; margin: var(--s1) 0; }
  .item .a { line-height: 1.55; }
  .item .a.clip { max-height: 6.4em; overflow: hidden; position: relative; }
  .item .a.clip::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2em; background: linear-gradient(rgba(249,249,247,0), var(--panel)); }
  .item .more { display: inline-block; color: var(--accent); cursor: pointer; font-size: 12px; padding: 3px 8px; margin-left: -8px; border-radius: var(--r); }
  .item .more:hover { background: var(--accent-bg); }
  .item .del { position: absolute; top: var(--s2); right: 8px; color: var(--text-3); cursor: pointer; font-size: 12px; padding: 2px 4px; }
  .item .del:hover { color: var(--red); }
  .item .loc { position: absolute; top: var(--s2); right: 34px; color: var(--accent); cursor: pointer; font-size: 11px; padding: 2px 4px; }
  .a p { margin: 3px 0; } .a li { margin-left: 16px; }
  .item .a h1, .item .a h2, .item .a h3, .item .a h4 { font-size: 12px; font-weight: 600; margin: var(--s1) 0 2px; border: 0; padding: 0; }
  #read { flex: 1; min-width: 360px; overflow-y: auto; padding: var(--s4) var(--s8) 80px; line-height: 1.8; font-size: 15px; background: var(--surface); position: relative; }
  #read > * { max-width: 760px; margin-left: auto; margin-right: auto; }  /* 읽기 폭 제한 (긴 줄 방지) */
  #read h2 { font-family: var(--font-serif); border-bottom: 1px solid var(--line); padding-bottom: 4px; margin-top: var(--s8); font-size: 19px; font-weight: 700; letter-spacing: -.005em; }
  #read h3 { font-family: var(--font-serif); margin-top: var(--s4); font-size: 16px; font-weight: 700; color: var(--text); }
  #read .flash { background: var(--amber-bg); transition: background 1.2s; }
  #read .figref { color: var(--accent); text-decoration: underline dotted; cursor: pointer; }
  #read li { margin-left: 18px; }
  #read li.d2 { margin-left: 36px; } #read li.d3 { margin-left: 54px; }
  #read li.num { list-style: none; margin-left: 0; }
  mark.anc { background: var(--amber-bg); border-bottom: 1px solid var(--amber); }
  mark.anc.qa { background: var(--accent-bg); border-bottom: 1px solid var(--accent); }
  sup.badge { cursor: pointer; font-size: 10px; margin-left: 2px; color: var(--accent); font-weight: 600; }
  .toc { columns: 2; column-gap: var(--s6); font-size: 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: var(--s2) 0; line-height: 1.65; }
  .toc a { display: block; color: var(--text); cursor: pointer; break-inside: avoid; }
  .toc a:hover { color: var(--accent); text-decoration: none; }
  .toc a.d1 { font-weight: 600; margin-top: 3px; } .toc a.d2 { padding-left: 14px; } .toc a.d3 { padding-left: 28px; color: var(--text-2); }
  table.abbr { border-collapse: collapse; font-size: 12px; width: 100%; margin: var(--s1) 0 var(--s3); }
  table.abbr td { border-bottom: 1px solid var(--line); padding: 3px var(--s2); vertical-align: top; }
  table.abbr td.k { white-space: nowrap; font-weight: 600; color: var(--text); width: 1%; }
  #pdfcol { flex: 1; min-width: 360px; overflow-y: auto; background: #56554f; display: none; position: relative; }
  #pdfcol.on { display: block; }
  #pdftools { position: sticky; top: 0; z-index: 3; background: #3a3936; color: #ddd; font-size: 12px; padding: 4px var(--s2); display: flex; gap: var(--s2); align-items: center; }
  #pdftools button { background: #55544f; color: #fff; border: 0; border-radius: var(--r); padding: 2px 8px; cursor: pointer; font-size: 12px; }
  #pdftools button.on { background: var(--accent); }
  #pdfpages { padding: var(--s2); }
  .pg { position: relative; margin: 0 auto var(--s2); background: #fff; box-shadow: 0 1px 3px #0005; }
  .pg canvas { display: block; }
  .pg .hl { position: absolute; background: rgba(255, 200, 0, .4); pointer-events: none; }
  .pg .hl.cap { background: rgba(31, 79, 209, .28); }
  .capbox { position: absolute; background: rgba(251, 243, 220, .97); border-left: 2px solid var(--amber); padding: 2px 6px; font-size: 12px; line-height: 1.4; color: var(--text); z-index: 2; pointer-events: none; }
  .rsel { position: absolute; border: 1px dashed var(--accent); background: rgba(31, 79, 209, .1); pointer-events: none; }
  body.regionmode .pg { cursor: crosshair; }
  #lightbox { position: fixed; right: var(--s6); bottom: var(--s6); width: 44vw; max-width: 900px; background: var(--surface); border: 1px solid var(--line-2); box-shadow: 0 6px 24px #0005; display: none; z-index: 50; overflow: hidden; }
  #lightbox.on { display: block; }
  #lightbox.big { width: 70vw; }
  #lbhead { display: flex; align-items: center; gap: var(--s2); padding: 4px var(--s2); background: #3a3936; color: #ddd; font-size: 12px; cursor: move; user-select: none; }
  #lbhead span { flex: 1; }
  #lbhead button { background: #55544f; color: #fff; border: 0; border-radius: var(--r); padding: 1px 8px; cursor: pointer; font-size: 12px; }
  #lbbody { max-height: 70vh; overflow: auto; background: #eeeeec; }
  #lightbox canvas { display: block; width: 100%; height: auto; background: #fff; }
  #seltool { position: fixed; display: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 2px; z-index: 20; gap: 0; box-shadow: 0 2px 8px #0002; }
  #seltool button { background: transparent; color: var(--text); border: 0; padding: 4px 9px; cursor: pointer; font-size: 12px; border-radius: var(--r); }
  #seltool button:hover { background: var(--accent-bg); color: var(--accent); }
  #askmenu { position: fixed; display: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 2px; z-index: 21; box-shadow: 0 2px 8px #0002; min-width: 200px; }
  #askmenu div { padding: 5px 10px; cursor: pointer; border-radius: var(--r); font-size: 12px; }
  #askmenu div:hover { background: var(--accent-bg); color: var(--accent); }
  #status { position: fixed; bottom: var(--s3); left: 50%; transform: translateX(-50%); background: #1c1c1a; color: #fff; padding: 5px 12px; border-radius: var(--r); font-size: 12px; display: none; z-index: 30; }
  .hint { color: var(--text-3); font-size: 12px; }
</style>
<script src="/ui.js"></script>
</head>
<body>
<div id="bar">
  <a href="/">← 목록</a>
  <label class="tog"><input type="checkbox" id="sideTog" checked> Claude</label>
  <span class="tab on" data-kind="summary">요약</span>
  <span class="tab" data-kind="translation">전문번역</span>
  <span class="tab" id="regen" title="현재 탭(요약/번역)을 지우고 다시 생성">↻ 다시 생성</span>
  <label class="tog"><input type="checkbox" id="pdfTog" checked> PDF</label>
  <span class="ttl" id="ttl">불러오는 중…</span>
  <span class="hint">문장 드래그 → PDF 찾기 · 대조 · 메모 · 질문</span>
</div>
<div id="layout">
  <div id="side" class="on">
    <h3>Claude에게 질문</h3>
    <textarea id="askIn" placeholder="짧게 물어보세요… (Ctrl+Enter)"></textarea>
    <div style="text-align:right;margin-top:4px"><button class="btn pri" id="askBtn">질문</button></div>
    <div id="qa"></div>
    <h3>메모</h3>
    <textarea id="noteIn" placeholder="메모… (Ctrl+Enter 저장)"></textarea>
    <div style="text-align:right;margin-top:4px"><button class="btn pri" id="noteSave">저장</button></div>
    <div id="notes"></div>
  </div>
  <div id="read">불러오는 중…</div>
  <div id="pdfcol" class="on">
    <div id="pdftools">
      <button id="zoomOut" title="축소">−</button><span id="zoomLbl">100%</span><button id="zoomIn" title="확대">+</button>
      <button id="regionBtn" title="켜고 그림 위를 드래그하면 그 부분이 크게 뜹니다">영역 확대</button>
      <label style="cursor:pointer"><input type="checkbox" id="capTog" checked> 캡션 번역 표시</label>
      <span id="pdfinfo" style="margin-left:auto;color:#bbb"></span>
    </div>
    <div id="pdfpages"><div style="text-align:center;color:#eee;padding:20px">PDF 불러오는 중…</div></div>
  </div>
</div>
<div id="seltool">
  <button data-act="locate">PDF에서 찾기</button>
  <button data-act="cross">대조</button>
  <button data-act="note">메모</button>
  <button data-act="ask">질문 ▾</button>
</div>
<div id="askmenu">
  <div data-q="이 부분을 쉬운 말로 설명해줘">쉽게 설명</div>
  <div data-q="이게 왜 중요한지, 이 논문에서 어떤 역할인지 알려줘">왜 중요?</div>
  <div data-q="여기 나오는 용어·수식의 뜻을 간단히 풀어줘">용어·수식 뜻</div>
  <div data-q="이 주장의 근거가 논문 어디에 있는지 알려줘">근거는?</div>
  <div data-q="">직접 입력…</div>
</div>
<div id="lightbox">
  <div id="lbhead"><span>확대 보기 — 제목줄을 잡아 옮기기</span><button id="lbSize">크게</button><button id="lbClose">✕</button></div>
  <div id="lbbody"><canvas id="lbcv"></canvas></div>
</div>
<div id="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
let kind = params.get("kind") || "summary";
const texts = {};
let notesData = { notes: [], qa: [] };
let sel = { text: "", kind: "" };
let captions = null, zoomF = 1, regionMode = false;
const read = document.getElementById("read"), pdfpages = document.getElementById("pdfpages"), pdfcol = document.getElementById("pdfcol");
const pages = [];  // {div, items:[{str,x,y,w,h}], vp, page, rendered}

function status(msg, ms = 2500) {
  const s = document.getElementById("status"); s.textContent = msg; s.style.display = "block";
  clearTimeout(s._t); if (ms) s._t = setTimeout(() => s.style.display = "none", ms);
}
const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;");
const norm = s => s.toLowerCase().replace(/[‐-―]/g, "-").replace(/\s+/g, " ").trim();
const fmtSec = s => s == null ? "" : (s < 90 ? s + "초" : Math.round(s / 60) + "분");

// ---------- 마크다운 ----------
function mdToHtml(md) {
  let h = esc(md);
  h = h.replace(/^### (.*)$/gm, "<h3>$1</h3>").replace(/^## (.*)$/gm, "<h2>$1</h2>").replace(/^# (.*)$/gm, "<h2>$1</h2>")
       .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
       // 글머리표: 들여쓴 깊이(공백 2칸 = 한 단계)를 d1~d3 클래스로. 줄 첫머리 '1. ' 번호 항목도 한 줄씩
       .replace(/^(\s*)[-*] (.*)$/gm, (m, sp, t) => "<li class='d" + Math.min(3, 1 + Math.floor(sp.length / 2)) + "'>" + t + "</li>")
       .replace(/^(\d+(?:\.\d+)*)\. (.*)$/gm, "<li class='num'>$1. $2</li>")
       .replace(/\n\n/g, "</p><p>");
  h = h.replace(/(Fig\.?\s?|Figure\s|그림\s?)(\d+)/g, "<a class='figref' data-k='fig' data-n='$2'>$1$2</a>")
       .replace(/(Table\s|표\s?)(\d+)/g, "<a class='figref' data-k='table' data-n='$2'>$1$2</a>");
  return "<p>" + h + "</p>";
}

async function loadText(k) {
  if (texts[k] !== undefined) return texts[k];
  const r = await fetch("/api/gentext?file=" + encodeURIComponent(file) + "&kind=" + k);
  texts[k] = r.ok ? await r.text() : null;
  return texts[k];
}

async function showKind(k) {
  kind = k;
  document.querySelectorAll(".tab[data-kind]").forEach(t => t.classList.toggle("on", t.dataset.kind === k));
  const md = await loadText(k);
  if (md === null) {
    const label = k === "summary" ? "요약" : "전문번역";
    const st = await (await fetch("/api/genstatus?file=" + encodeURIComponent(file) + "&kind=" + k)).json();
    if (st.status === "running") { liveView(k); return; }
    read.innerHTML = "<p class='hint'>" + label + "이 아직 생성되지 않았습니다." + (st.status === "error" ? " (이전 시도 실패: " + esc(st.error || "") + ")" : "") +
      "</p><button class='btn pri' id='genBtn'>" + label + " 생성하기</button>";
    document.getElementById("genBtn").onclick = async () => {
      await fetch("/api/generate", { method: "POST", body: JSON.stringify({ file, kind: k }) });
      liveView(k);
    };
    return;
  }
  renderMd(md);
}

function bindFigrefs(root) { root.querySelectorAll(".figref").forEach(a => a.onclick = () => jumpToCaption(a.dataset.k, a.dataset.n)); }

function renderMd(md) {
  read.innerHTML = mdToHtml(md);
  bindFigrefs(read);
  postProcess();
  markAnchors();
}

// ---------- 목차 / 약어표 정리 ----------
function sectionNodes(h) {
  const out = []; let n = h.nextElementSibling;
  while (n && !/^H[23]$/.test(n.tagName)) { out.push(n); n = n.nextElementSibling; }
  return out;
}
function textLines(nodes) {
  const lines = [];
  for (const n of nodes) {
    const lis = n.querySelectorAll ? n.querySelectorAll("li") : [];
    if (lis.length) lis.forEach(li => lines.push(li.textContent));
    else n.textContent.split(/\n+/).forEach(s => lines.push(s));
  }
  // 들여쓴 하위 항목("   - 2.1. …")도 잡히게: 먼저 trim, 그다음 글머리표 제거
  return lines.map(s => s.trim().replace(/^[-•·*]\s*/, "").trim()).filter(s => s.length > 1);
}
function postProcess() {
  [...read.querySelectorAll("h2, h3")].forEach(h => {
    const t = h.textContent;
    if (/목차|contents/i.test(t) && !/핵심/.test(t)) buildToc(h);
    else if (/약어|abbreviation|기호|nomenclature|symbol/i.test(t)) buildTable(h);
  });
}
function buildToc(h) {
  const nodes = sectionNodes(h), lines = textLines(nodes);
  if (lines.length < 3) return;
  const box = document.createElement("div"); box.className = "toc";
  let made = 0;
  for (const raw of lines) {
    const m = raw.match(/^((\d+)(?:\.\d+)*)\.?\s+(.+?)(?:\s*[.…·]{2,}\s*\d+|\s+\d+)?$/);
    if (!m) continue;
    const num = m[1], title = m[3].replace(/\s*\.+\s*$/, "");
    const depth = Math.min(3, num.split(".").length);
    const a = document.createElement("a"); a.className = "d" + depth; a.textContent = num + " " + title;
    a.onclick = () => {
      const target = [...read.querySelectorAll("h2, h3")].find(x => x !== h && new RegExp("^\\s*" + num.replace(/\./g, "\\.") + "\\.?(\\s|$)").test(x.textContent))
        || [...read.querySelectorAll("h2, h3")].find(x => x !== h && x.textContent.includes(title.slice(0, 10)));
      if (target) { target.scrollIntoView({ block: "start" }); target.classList.add("flash"); setTimeout(() => target.classList.remove("flash"), 2000); }
      else status("해당 절을 본문에서 찾지 못했습니다");
    };
    box.appendChild(a); made++;
  }
  if (made < 3) return;
  nodes.forEach(n => n.remove());
  h.insertAdjacentElement("afterend", box);
}
function buildTable(h) {
  const nodes = sectionNodes(h), lines = textLines(nodes);
  const rows = [];
  for (const l of lines) {
    let m = l.match(/^(.{1,40}?)\s*(?::|\s[-–—]\s|\t|\s{2,}|=)\s*(.+)$/);
    if (!m) m = l.match(/^(\S{1,14})\s+(.{6,})$/);
    if (m) rows.push([m[1].trim(), m[2].trim()]);
  }
  if (rows.length < 3) return;
  const tb = document.createElement("table"); tb.className = "abbr";
  tb.innerHTML = rows.map(r => "<tr><td class='k'>" + esc(r[0]) + "</td><td>" + esc(r[1]) + "</td></tr>").join("");
  nodes.forEach(n => n.remove());
  h.insertAdjacentElement("afterend", tb);
}

// ---------- 생성 중 실시간 표시 ----------
let liveTimer = null, livePrev = null;
function liveView(k) {
  if (liveTimer) clearInterval(liveTimer);
  const label = k === "summary" ? "요약" : "전문번역";
  const tick = async () => {
    if (kind !== k) { clearInterval(liveTimer); liveTimer = null; return; }
    const s = await (await fetch("/api/genpartial?file=" + encodeURIComponent(file) + "&kind=" + k)).json();
    if (s.status === "done" || s.status === "none") { clearInterval(liveTimer); liveTimer = null; delete texts[k]; showKind(k); return; }
    if (s.status === "error") { clearInterval(liveTimer); liveTimer = null; read.innerHTML = "<p class='hint'>⚠ 실패: " + esc(s.error || "") + "</p>"; return; }
    const total = s.total || 0, parts = s.parts || {}, doneN = Object.keys(parts).length;
    const pi = progressInfo(Object.assign({}, s, { done: doneN }), 150);
    let html = "<div class='prog' style='margin:4px 0 14px'><span>" + label + " 생성 중 · " + doneN + "/" + total + " 구간</span>" +
      pbarHtml(pi.frac, livePrev, "wide") + "<span class='eta'>" + pi.text + "</span></div>";
    livePrev = pi.frac;
    for (let i = 0; i < total; i++)
      html += parts[i] ? mdToHtml(parts[i]) : "<p class='hint' style='border:1px dashed var(--line-2);border-radius:var(--r);padding:8px'>" + (i + 1) + "/" + total + " 구간 생성 중…</p>";
    const keep = read.scrollTop; read.innerHTML = html; read.scrollTop = keep; bindFigrefs(read); animateBars(read);
  };
  tick(); liveTimer = setInterval(tick, 5000);
}
document.querySelectorAll(".tab[data-kind]").forEach(t => t.onclick = () => showKind(t.dataset.kind));
document.getElementById("regen").onclick = async () => {
  const label = kind === "summary" ? "요약" : "전문번역";
  if (!confirm(label + "을 지우고 다시 생성할까요?\n(구간 4개 동시 생성. 요약 2~6분, 번역 2~8분, 구독 사용량 사용)")) return;
  await fetch("/api/generate", { method: "POST", body: JSON.stringify({ file, kind, force: true }) });
  delete texts[kind]; liveView(kind);
};

// ---------- PDF ----------
async function loadPdf() {
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await pdfjsLib.getDocument("/pdf?file=" + encodeURIComponent(file)).promise;
  pdfpages.innerHTML = "";
  const io = new IntersectionObserver((ents) => ents.forEach(e => { if (e.isIntersecting) renderPage(pages[+e.target.dataset.i]); }), { root: pdfcol, rootMargin: "700px 0px" });
  for (let i = 1; i <= doc.numPages; i++) {
    const page = await doc.getPage(i);
    const vp = page.getViewport({ scale: 1.2 });
    const div = document.createElement("div"); div.className = "pg"; div.dataset.i = i - 1;
    div.style.width = vp.width + "px"; div.style.height = vp.height + "px";
    div.innerHTML = "<div class='ph' style='color:#aaa;padding:20px;font-size:12px'>" + i + "쪽 준비 중…</div>";
    pdfpages.appendChild(div);
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => {
      const tx = pdfjsLib.Util.transform(vp.transform, it.transform);
      const fh = Math.hypot(tx[2], tx[3]);
      return { str: it.str, x: tx[4], y: tx[5] - fh, w: it.width * vp.scale, h: fh * 1.15 };
    });
    pages.push({ div, items, vp, page, rendered: false });
    io.observe(div);
    if (i <= 2) renderPage(pages[i - 1]);
    document.getElementById("pdfinfo").textContent = i + "/" + doc.numPages + "쪽";
  }
  document.getElementById("pdfinfo").textContent = doc.numPages + "쪽";
  loadCaptions();
}
async function renderPage(pg) {
  if (!pg || pg.rendered) return;
  pg.rendered = true;
  const cv = document.createElement("canvas"); cv.width = pg.vp.width; cv.height = pg.vp.height;
  try {
    await pg.page.render({ canvasContext: cv.getContext("2d"), viewport: pg.vp, intent: "print" }).promise;
    pg.div.querySelectorAll(".ph").forEach(d => d.remove());
    pg.div.insertBefore(cv, pg.div.firstChild);
  } catch (e) { pg.rendered = false; }
}
function clearHl() { document.querySelectorAll(".pg .hl").forEach(e => e.remove()); }
// 목표 위치가 화면 아래쪽(bottom) 또는 위쪽(top)에 오도록 스크롤
function scrollPdfTo(pi, y, align) {
  const pg = pages[pi]; renderPage(pg); if (pages[pi + 1]) renderPage(pages[pi + 1]); if (pages[pi - 1]) renderPage(pages[pi - 1]);
  const top = pg.div.offsetTop + y * zoomF;
  // bottom: 캡션이 화면 높이의 80% 지점(아래쪽)에 오게 -> 위의 그림이 보임
  pdfcol.scrollTop = align === "bottom" ? top - pdfcol.clientHeight * 0.8 : top - pdfcol.clientHeight * 0.15;
}
function highlightItems(pi, idxs, cls = "", align = "top") {
  const pg = pages[pi];
  for (const i of idxs) {
    const it = pg.items[i]; const d = document.createElement("div");
    d.className = "hl " + cls; d.style.left = it.x + "px"; d.style.top = it.y + "px"; d.style.width = Math.max(4, it.w) + "px"; d.style.height = it.h + "px";
    pg.div.appendChild(d);
  }
  if (idxs.length) scrollPdfTo(pi, pg.items[idxs[0]].y, align);
}
function findInPdf(quote, preferPage) {
  const tries = [quote, quote.slice(0, 80), quote.slice(0, 50), quote.slice(0, 30)].map(norm).filter(q => q.length >= 12);
  const order = pages.map((_, i) => i); if (preferPage != null && pages[preferPage]) order.unshift(preferPage);
  for (const q of tries) for (const pi of order) {
    const pg = pages[pi]; let s = "", map = [];
    pg.items.forEach((it, idx) => { const t = norm(it.str) + " "; for (let c = 0; c < t.length; c++) map.push(idx); s += t; });
    const pos = s.indexOf(q);
    if (pos >= 0) return { page: pi, idxs: [...new Set(map.slice(pos, pos + q.length))] };

}
function findCaptionItem(k, n) {
  const re = k === "table" ? new RegExp("^(table|표)\\s*" + n + "\\b", "i") : new RegExp("^(fig\\.?|figure|그림)\\s*" + n + "\\b", "i");
  const cands = [];
  pages.forEach((pg, pi) => pg.items.forEach((it, idx) => { if (re.test(it.str.trim())) cands.push({ pi, idx, len: it.str.length }); }));
  if (!cands.length) return null;
  cands.sort((a, b) => b.len - a.len);  // 캡션 문장이 본문 참조보다 길다
  return cands[0];
}
function jumpToCaption(k, n) {
  const c = findCaptionItem(k, n);
  const label = (k === "table" ? "Table " : "Fig. ") + n;
  if (!c) { status("PDF에서 " + label + " 캡션을 찾지 못했습니다"); return; }
  clearHl(); document.getElementById("pdfTog").checked = true; pdfcol.classList.add("on");
  highlightItems(c.pi, [c.idx], "cap", "bottom");   // 캡션을 화면 아래에 두어 그림이 보이게
  status(label + " → " + (c.pi + 1) + "쪽");
}

async function loadCaptions() {

function placeCaptions() {
  document.querySelectorAll(".capbox").forEach(e => e.remove());
  if (!captions || !document.getElementById("capTog").checked) return;
  for (const c of captions) {
    if (!c.ko) continue;

    const pg = pages[hit.pi], it = pg.items[hit.idx];
    const box = document.createElement("div"); box.className = "capbox";
    box.style.left = Math.max(6, it.x - 4) + "px"; box.style.top = (it.y + it.h + 3) + "px";

    const ko = c.ko.replace(/^\s*(그림|표|Fig\.?|Figure|Table)\s*\d+\s*[.:·\-–—]?\s*/i, "");  // 번역문 앞의 중복 번호 제거
    box.textContent = (c.kind === "table" ? "표 " : "그림 ") + c.n + " · " + ko;

async function doAction(act) {
  const text = sel.text;
  if (act === "locate") {
    status("원문 위치를 찾는 중… (Claude, 10~30초)", 0);
    document.getElementById("pdfTog").checked = true; pdfcol.classList.add("on");
    const r = await (await fetch("/api/locate", { method: "POST", body: JSON.stringify({ file, passage: text }) })).json();
    if (r.error || !r.quote) { status("⚠ " + (r.error || "찾지 못했습니다")); return; }
    const hit = findInPdf(r.quote, (r.page || 1) - 1);
    clearHl();
    if (hit) { highlightItems(hit.page, hit.idxs); status((hit.page + 1) + "쪽에서 찾았습니다" + (r.confidence === "low" ? " (확신도 낮음)" : "")); }
    else if (r.page && pages[r.page - 1]) { scrollPdfTo(r.page - 1, 0, "top"); status(r.page + "쪽으로 이동 (정확한 문장은 강조 못 함)"); }
  } else if (act === "cross") {
    const other = kind === "summary" ? "translation" : "summary";
    await showKind(other);
    if (texts[other] === null) return;
    const toks = text.match(/[A-Za-z가-힣0-9]{2,}/g) || [];
    let best = null, bestScore = 0;
    read.querySelectorAll("p, li, h2, h3").forEach(el => {
      const et = el.textContent; let sc = 0;
      for (const w of toks) if (et.includes(w)) sc++;
      sc = sc / Math.sqrt(30 + et.length);
      if (sc > bestScore) { bestScore = sc; best = el; }
    });
    if (best) { best.scrollIntoView({ block: "center" }); best.classList.add("flash"); setTimeout(() => best.classList.remove("flash"), 2500); status((other === "summary" ? "요약" : "번역본") + "에서 가장 비슷한 부분으로 이동"); }
  } else if (act === "note") {
    const t = prompt("메모 (선택 구절이 함께 저장되고 본문에 표시가 남습니다):", "");

// ---------- 본문에 흔적 남기기 ----------
function unwrapAnchors() {
  read.querySelectorAll("sup.badge").forEach(b => b.remove());
  read.querySelectorAll("mark.anc").forEach(m => { const p = m.parentNode; while (m.firstChild) p.insertBefore(m.firstChild, m); p.removeChild(m); p.normalize(); });
}
function markAnchors() {
  unwrapAnchors();
  const items = [...notesData.notes.map((x, i) => ({ ...x, type: "note", i })), ...notesData.qa.map((x, i) => ({ ...x, type: "qa", i }))]
    .filter(x => x.quote && x.quote.length >= 6 && (!x.kind || x.kind === kind));
  for (const it of items) highlightText(it);
}
function highlightText(it) {
  // 본문 텍스트 노드들을 이어붙인 문자열에서 인용 구절을 찾아 <mark>로 감싼다
  const walker = document.createTreeWalker(read, NodeFilter.SHOW_TEXT);
  const map = []; let s = "", n;
  while ((n = walker.nextNode())) { if (n.parentNode.closest && n.parentNode.closest(".toc,table.abbr,.hint")) continue; for (let i = 0; i < n.nodeValue.length; i++) map.push([n, i]); s += n.nodeValue; }
  const words = it.quote.trim().split(/\s+/).slice(0, 25).map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  const re = new RegExp(words.join("\\s+"), "i");
  const m = re.exec(s); if (!m) return;
  let start = m.index, end = m.index + m[0].length, lastMark = null;
  while (start < end) {
    const [node, off] = map[start]; let e2 = start;
    while (e2 < end && map[e2][0] === node) e2++;
    const range = document.createRange(); range.setStart(node, off); range.setEnd(node, map[e2 - 1][1] + 1);
    const mark = document.createElement("mark"); mark.className = "anc " + (it.type === "qa" ? "qa" : "note"); mark.title = it.type === "qa" ? "Q. " + it.q : "메모: " + it.text;
    try { range.surroundContents(mark); lastMark = mark; } catch (e) { return; }
    // 노드 구조가 바뀌었으니 다시 계산
    return markAnchorsBadge(mark, it);
  }
}
function markAnchorsBadge(mark, it) {
  const badge = document.createElement("sup"); badge.className = "badge"; badge.textContent = it.type === "qa" ? "Q" : "메모";
  badge.title = "패널에서 보기";
  badge.onclick = (e) => { e.stopPropagation(); focusItem(it.type, it.i); };
  mark.insertAdjacentElement("afterend", badge);
  // 같은 항목이 여러 노드에 걸쳐 있으면 나머지는 생략(첫 부분만 표시) - 이후 항목 계속
}
function focusItem(type, i) {
  document.getElementById("sideTog").checked = true; document.getElementById("side").classList.add("on");
  const el = document.getElementById("item-" + type + "-" + i); if (!el) return;
  el.scrollIntoView({ block: "center" }); el.classList.add("sel"); setTimeout(() => el.classList.remove("sel"), 2000);
  const a = el.querySelector(".a.clip"); if (a) { a.classList.remove("clip"); const mb = el.querySelector(".more"); if (mb) mb.remove(); }
}
function locateAnchor(type, i) {
  const marks = [...read.querySelectorAll("mark.anc")];
  const it = (type === "qa" ? notesData.qa : notesData.notes)[i];
  const m = marks.find(x => x.title.includes((type === "qa" ? it.q : it.text).slice(0, 20)));
  if (m) { m.scrollIntoView({ block: "center" }); m.classList.add("flash"); setTimeout(() => m.classList.remove("flash"), 2000); }
  else status("이 탭 본문에서 위치를 찾지 못했습니다" + (it.kind && it.kind !== kind ? " (" + (it.kind === "summary" ? "요약" : "번역") + " 탭에서 한 것)" : ""));
}

    const tb = document.createElement("b"); tb.textContent = info.title || ""; ttl.appendChild(tb); }
  document.title = (info.author || "") + " " + (info.year || "") + " · Paperdesk";
  notesData = await (await fetch("/api/notes?file=" + encodeURIComponent(file))).json();
  renderSide();
  await showKind(kind);
  loadPdf().catch(e => { pdfpages.innerHTML = "<div style='color:#fff;padding:20px'>PDF 표시 실패: " + esc(String(e)) + "</div>"; });
})();
</script>
