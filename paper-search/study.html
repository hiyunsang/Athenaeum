<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>공부 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/svg+xml" href="/logo/favicon.svg">
<link rel="stylesheet" href="/ui.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { flex: none; display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s4); min-height: 46px; background: var(--surface); border-bottom: 1px solid var(--line); }

  #srcsplit { cursor: col-resize; background: var(--line-2); }   /* 끌어서 오른쪽 Claude 칸의 폭을 바꾼다 (사용자 2026-10-08) */

  #srcp { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; padding: var(--s3) var(--s4) var(--s8); }
  /* 왼쪽: 새로 쓰기 · 장의 차례 · 목록 */

  .sideh .act { margin-left: auto; padding: 0 4px; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .newbox { padding: 0 var(--s3) var(--s3); border-bottom: 1px solid var(--line); }
  .newbox.closed .nbb { display: none; }
  .newbox textarea { width: 100%; resize: vertical; min-height: 62px; }
  .newbox .row { display: flex; gap: var(--s2); margin-top: var(--s2); }
  .newbox select { flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px; }
  .newbox .primary { width: 100%; margin-top: var(--s2); }
  .newbox .hint { margin-top: var(--s2); line-height: 1.5; }
  .oi { display: flex; gap: var(--s2); align-items: baseline; padding: 6px var(--s3) 6px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.4; color: var(--text); border-left: 3px solid transparent; }
  .oi:hover { background: var(--hover); }
  .oi.on { background: var(--sel-bg); border-left-color: var(--accent); }
  .oi .no { color: var(--text-3); min-width: 1.3em; font-variant-numeric: tabular-nums; }
  .oi .t { flex: 1; min-width: 0; }
  .oi .n { color: var(--text-3); font-size: 11px; white-space: nowrap; }
  .oi.sub { color: var(--text-2); }

  #outline { border-bottom: 1px solid var(--line); padding-bottom: var(--s2); }
  /* 지금 보는 장 — 그 아래 차례와 '다른 장' 목록을 갈라 둔다 (사용자 2026-10-07: '다른 장과 장의 차례가 같이 왼쪽에 있으니 헷갈린다') */
  .pick { padding: 10px var(--s3) 8px; border-bottom: 1px solid var(--line); }
  .pick .pk { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--text-2); text-transform: uppercase; margin-bottom: 3px; }
  .pick .pt { font-weight: 600; font-size: 13px; line-height: 1.35; }
  .pick .pm { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
  .pick .act { padding: 2px 0; margin-top: 5px; }
  .ix h1 { font-family: var(--font-serif); font-size: 24px; font-weight: 600; margin: 0; }
  .ix .ixh { display: flex; align-items: baseline; gap: 12px; padding-bottom: 10px; }
  .ix .ixi { padding: 14px 0 15px; border-top: 1px solid var(--line); cursor: pointer; }
  .ix .ixi:last-child { border-bottom: 1px solid var(--line); }

  .ix .ixi:hover h2 { color: var(--accent); }
  .ix .ixi .ixm { color: var(--text-3); font-size: 12px; } .ix .ixi .ixm .now { color: var(--accent); }
  .ix .ixi .ixt { color: var(--text-2); font-size: 12.5px; margin-top: 4px; line-height: 1.5; }
  .ix .ixq { margin: 2px 0 12px; } .ix .ixq input, .ch .cvf input { width: 100%; box-sizing: border-box; font: inherit; font-size: 13px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--r); background: var(--bg); color: var(--text); }
  .ix .ixc { padding: 7px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 13px; line-height: 1.5; } .ix .ixc:last-child { border-bottom: 1px solid var(--line); } .ix #ixChats { margin-bottom: 18px; } .ix .ixc:hover .q { color: var(--accent); } .ix .ixc .q { font-weight: 500; } .ix .ixc .m { color: var(--text-3); font-size: 12px; }
  .ch .cvf { margin: 0 0 10px; }

  .dkform .row { display: flex; gap: var(--s2); align-items: center; margin: 6px 0 14px; }
  .dk { border-top: 1px solid var(--line); padding: 12px 0; font-family: var(--font); font-size: 13.5px; } .dk .dkhead { display: flex; align-items: baseline; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
  .dk .dks { padding: 8px 0 6px; border-top: 1px dashed var(--line); } .dk .dkh { font-weight: 600; margin-bottom: 4px; } .dk .dkh .no { color: var(--text-3); font-weight: 400; margin-right: 8px; }
  .dk .dkbody { display: flex; gap: 14px; align-items: flex-start; } .dk .dkbody ul { margin: 0; padding-left: 18px; flex: 1; line-height: 1.55; } .dk .dkbody li { margin: 2px 0; }
  .dk .dkfig { margin: 0; flex: 0 0 240px; } .dk .dkfig img { max-width: 240px; max-height: 170px; border: 1px solid var(--line); background: #fff; } .dk .dkfig figcaption { font-size: 11.5px; color: var(--text-3); line-height: 1.4; }
  .dk .note { color: var(--text-3); font-size: 12.5px; line-height: 1.55; margin-top: 4px; white-space: pre-wrap; } .dk .dkk { color: var(--accent); text-decoration: none; font-size: 11px; margin-left: 2px; }
  .askwrap .fsz { margin-left: auto; font-weight: 400; text-transform: none; letter-spacing: 0; } .askwrap .fsz .act { padding: 0 4px; }
  .askwrap .msg, .askwrap .spq, .askwrap textarea, .askwrap .srci { font-size: inherit; }
  #list.closed { display: none; }
  #list { border-bottom: 1px solid var(--line); background: var(--surface); }
  .sitem { padding: 8px var(--s3) 9px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .sitem:hover { background: var(--hover); }
  .sitem .tt { font-weight: 600; line-height: 1.35; font-size: 12.5px; }
  .sitem .mm { color: var(--text-3); font-size: 11.5px; margin-top: 2px; }
  .sitem .mm .run { color: var(--accent); } .sitem .mm .bad { color: var(--amber); }
  /* 가운데: 장 */
  .page { max-width: var(--read-width); margin: 0 auto; padding: var(--s6) var(--s6) 96px; }
  .ch { font-size: calc(15.5px * var(--read-scale)); line-height: var(--read-lh); font-family: var(--read-font, var(--font)); }
  .crumb { font-family: var(--font); font-size: 12px; color: var(--text-3); margin-bottom: var(--s4); display: flex; gap: var(--s2); align-items: center; }
  .crumb a { color: var(--text-3); } .crumb .sp { color: var(--line-2); }
  .ch h1 { font-family: var(--font-serif); font-size: 1.75em; line-height: 1.3; font-weight: 600; margin: 0 0 var(--s2); }
  .ch .scope { color: var(--text-2); margin: 0 0 var(--s2); }
  .ch .meta { font-family: var(--font); font-size: 12px; color: var(--text-3); line-height: 1.6; padding-bottom: var(--s3); border-bottom: 1px solid var(--line); }
  .ch .meta .act { padding: 2px 6px; margin-left: -6px; }
  .ch h2 { font-family: var(--font-serif); font-size: 1.28em; line-height: 1.35; font-weight: 600; margin: 1.2em 0 .2em; }
  .ch h2.first { margin-top: 0; }
  .ch h2 .no { color: var(--text-3); font-weight: 400; margin-right: .4em; }
  .ch .aim { font-family: var(--font); font-size: 12.5px; color: var(--text-3); margin: 0 0 .7em; }
  /* Claude 의 생각 — 해설 층. 사실 층과 갈라 보인다(앰버 띠 + 마스코트). 사용자 2026-10-08 */
  .cmt { margin: 1.1em 0 1.4em; padding: 10px 14px 4px; border-left: 3px solid var(--amber); background: color-mix(in srgb, var(--amber) 7%, transparent); border-radius: 0 var(--r) var(--r) 0; font-family: var(--font); font-size: .94em; }
  .cmt .ch2 { display: flex; align-items: center; gap: 7px; font-weight: 600; margin-bottom: 4px; } .cmt .ch2 img { width: 18px; height: 18px; image-rendering: pixelated; } .cmt .ch2 .hint { font-weight: 400; padding: 0; }
  .cmt h4 { margin: .7em 0 .15em; font-size: 1em; font-weight: 600; color: var(--text-2); } .cmt p { margin: 0 0 .7em; text-align: left; line-height: 1.65; }
  .cmt p a { color: var(--accent); text-decoration: none; } .cmt.pending { opacity: .7; }
  .cv { padding: 10px 0; border-top: 1px solid var(--line); font-family: var(--font); font-size: 13px; line-height: 1.6; } .cv .cvq { color: var(--text-2); } .cv .cvu, .cv .cva { margin-top: 4px; white-space: pre-wrap; } .cv b { color: var(--text-2); font-weight: 600; margin-right: 4px; }
  .ch h3 { font-size: 1.02em; font-weight: 600; margin: 1.5em 0 .3em; }
  .ch p { margin: 0 0 .95em; text-align: justify; word-break: keep-all; }
  .ch ul { margin: .4em 0 1em; padding-left: 1.3em; } .ch li { margin-bottom: .45em; }
  .ch .toc { font-family: var(--font); font-size: 13px; margin: var(--s4) 0 0; padding: 0; list-style: none; line-height: 1.6; }
  .ch .toc li { display: flex; gap: var(--s2); padding: 5px 0; margin: 0; border-bottom: 1px solid var(--line); cursor: pointer; } .ch .toc li:hover { background: var(--hover); }
  .ch .toc .no { color: var(--text-3); min-width: 1.4em; }
  .ch .toc .q { color: var(--text-3); } .ch .toc .n { margin-left: auto; color: var(--text-3); font-size: 11.5px; white-space: nowrap; }
  .secp { font-family: var(--font); font-size: 12.5px; margin: 0 0 1em; }
  .secp summary { cursor: pointer; color: var(--text-3); padding: 2px 0; }
  .secp .pp { display: flex; gap: var(--s2); padding: 4px 0; border-bottom: 1px solid var(--line); line-height: 1.5; } .secp .pp .n { color: var(--text-3); min-width: 2.2em; }
  .secp .pp .b { flex: 1; min-width: 0; color: var(--text-2); } .secp .pp .b b { color: var(--text); }
  .pnav { font-family: var(--font); display: flex; gap: var(--s3); margin-top: var(--s8); padding-top: var(--s3); border-top: 1px solid var(--line); font-size: 13px; }
  .pnav .act { padding: 6px 8px; max-width: 48%; text-align: left; white-space: normal; line-height: 1.4; } .pnav .nx { margin-left: auto; text-align: right; }
  .u { cursor: pointer; border-radius: 2px; }
  .u:hover { background: var(--hover); }
  .u.on { background: var(--sel-bg); box-shadow: inset 0 -2px 0 var(--accent); }
  .u .c { font-family: var(--font); font-size: .74em; color: var(--accent); margin-left: 1px; white-space: nowrap; }
  .u.claim { }                                         /* 옛 장의 논지 문장 표시 — 굵게 보이지 않는다(사용자 2026-10-07: 글은 교과서처럼 이어져야 한다) */
  /* 번외: 논지에 들지 않지만 서재가 말한 것 — 절 끝에 조금 작게 */
  .ch h3.extra { color: var(--text-2); font-size: .92em; margin-top: 1.8em; padding-top: .7em; border-top: 1px solid var(--line); }
  .ch h3.extra::after { content: " — 논지에 들지 않지만 서재가 말한 것"; font-weight: 400; color: var(--text-3); font-size: .9em; }
  .ch p.extra { color: var(--text-2); font-size: .94em; }
  /* 표: 행마다 근거가 있어 문장처럼 누른다 */
  .sttab { font-family: var(--font); font-size: .8em; line-height: 1.45; border-collapse: collapse; width: 100%; margin: .3em 0 1.1em; }
  .sttab caption { caption-side: top; text-align: left; color: var(--text-2); padding: 0 0 .45em; } .sttab caption b { color: var(--text); }
  .sttab th, .sttab td { border-bottom: 1px solid var(--line); padding: 4px 8px 4px 0; text-align: left; vertical-align: top; }
  .sttab th { color: var(--text-3); font-weight: 600; border-bottom: 1px solid var(--line-2); }
  .sttab tr.u.on td { background: var(--sel-bg); } .sttab tr.u.on { box-shadow: none; }
  .sttab td.c { color: var(--accent); white-space: nowrap; font-size: .92em; }
  /* 그림: 논문 PDF 에서 잘라 온 것 — 설명 문장은 본문 문장처럼 근거가 있다 */
  .stfig { margin: .5em 0 1.2em; }
  .stfig img { display: block; max-width: 100%; max-height: 540px; border: 1px solid var(--line); border-radius: var(--r); background: #fff; }
  .stfig figcaption { font-family: var(--font); font-size: .84em; color: var(--text-2); line-height: 1.55; margin-top: .45em; }
  .stfig .fno { font-weight: 600; color: var(--text); margin-right: .25em; } .stfig .src { color: var(--text-3); }
  .stfig details { margin-top: 2px; } .stfig summary { cursor: pointer; color: var(--text-3); font-size: .92em; } .stfig details .ko { color: var(--text-3); margin-top: 2px; }
  .stfig .ftag { display: inline-block; border: 1px solid var(--line-2); border-radius: var(--r); padding: 0 5px; font-size: .78em; color: var(--text-2); margin-left: 5px; vertical-align: 1px; }   /* 도식·장치 = 근거 문장이 가리키지 않아도 넣는 그림 */
  .ch .refs { font-family: var(--font); font-size: 13px; line-height: 1.55; }
  .ch .refs .r { display: flex; gap: var(--s2); padding: 5px 0; border-bottom: 1px solid var(--line); }
  .ch .refs .r .n { color: var(--text-3); min-width: 2.2em; } .ch .refs .r .b { flex: 1; min-width: 0; }
  .ch .refs .r .act { padding: 0 4px; }
  .ch .terms { font-family: var(--font); font-size: 13px; columns: 2; column-gap: var(--s6); }
  .ch .terms div { break-inside: avoid; padding: 2px 0; } .ch .terms span { color: var(--text-3); }
  .empty { max-width: 620px; margin: 0 auto; padding: 72px var(--s6); color: var(--text-2); line-height: 1.75; }
  .empty h2 { font-family: var(--font-serif); font-size: 22px; color: var(--text); margin-bottom: var(--s3); }
  .empty ol { padding-left: 1.3em; } .empty li { margin-bottom: 6px; }
  /* 마인드맵 */
  .page.mapp { max-width: none; padding: var(--s4) var(--s4) 96px; }
  .mtb { display: flex; gap: var(--s2); align-items: center; flex-wrap: wrap; margin: var(--s2) 0 var(--s3); font-size: 12.5px; }
  .mtb select { padding: 3px 6px; font-size: 12px; }
  .mtb .sp { flex: 1; }
  .mwrap { overflow: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
  .mwrap svg { display: block; }
  .mnode { cursor: pointer; } .mnode:hover rect { stroke-width: 2; }
  .mnode.on rect { stroke-width: 2.5; }
  .mapempty { max-width: 560px; color: var(--text-2); line-height: 1.7; }
  /* 쓰는 중 */
  .run h2 { font-family: var(--font-serif); font-size: 22px; margin-bottom: var(--s1); }
  .stg { display: flex; align-items: center; gap: var(--s3); padding: 7px 0; border-bottom: 1px solid var(--line); color: var(--text-3); }
  .stg .k { width: 1.3em; text-align: center; }
  .stg.done { color: var(--text-2); } .stg.done .k { color: var(--green); }
  .stg.now { color: var(--text); font-weight: 600; } .stg.now .k { color: var(--accent); }
  .stg .cnt { margin-left: auto; font-weight: 400; color: var(--text-3); white-space: nowrap; }
  .stgbar { padding: 6px 0 2px 2.1em; }
  .pbar.live > i { transition: width 1s linear; }
  .plist { margin-top: var(--s4); } .plist .p { display: flex; gap: var(--s2); padding: 5px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; }
  .plist .p .k { width: 1.3em; color: var(--green); text-align: center; } .plist .p .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plist .p .m { color: var(--text-3); white-space: nowrap; }
  .logl { color: var(--text-2); font-size: 12.5px; padding: 3px 0; }
  .warnbox { background: var(--amber-bg); color: var(--amber); border-radius: var(--r); padding: var(--s2) var(--s3); margin: var(--s3) 0; line-height: 1.55; }
  /* 오른쪽: 근거 */
  #srcp .sec:first-child { margin-top: 0; }
  .spq { line-height: 1.6; padding: var(--s2) 0 var(--s3); border-bottom: 1px solid var(--line-2); }
  .srci { padding: var(--s3) 0; border-bottom: 1px solid var(--line); }
  .srci .sm { font-size: 12px; color: var(--text-2); margin-bottom: 4px; } .srci .sm b { color: var(--text); }
  .srci .tag { color: var(--amber); margin-left: 4px; }
  .srci .en { line-height: 1.55; } .srci .ko { color: var(--text-2); line-height: 1.6; margin-top: 5px; }
  .srci .cited { color: var(--text-3); font-size: 11.5px; line-height: 1.5; margin-top: 5px; }
  .srci .act { padding: 4px 0; display: inline-block; margin-top: 2px; }

  .rm { padding: var(--s2) 0; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.55; } .rm .w { color: var(--amber); margin-top: 2px; } .rm .s { color: var(--text-3); }
  /* 드래그 → Claude 에게 */
  #selBar { position: fixed; z-index: 31; display: none; background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); box-shadow: 0 4px 14px #0003; padding: 2px; white-space: nowrap; }
  #selBar button { font-size: 12.5px; padding: 4px 10px; }
  .u.asked { border-bottom: 1px dotted var(--accent); }
  .ask textarea { width: 100%; resize: vertical; min-height: 60px; margin-top: var(--s2); }
  .ask .row { display: flex; gap: var(--s2); align-items: center; margin-top: var(--s2); flex-wrap: wrap; }
  .ask .row select { padding: 3px 6px; font-size: 12px; } .ask .row label { font-size: 12px; color: var(--text-2); display: inline-flex; gap: 4px; align-items: center; }
  .ask .row .primary { margin-left: auto; }
  .msg { padding: var(--s2) 0 var(--s3); border-bottom: 1px solid var(--line); line-height: 1.65; }
  .msg .who { font-size: 11px; color: var(--text-3); margin-bottom: 3px; }
  .msg.me { color: var(--text-2); } .msg.me .body { white-space: pre-wrap; }
  .msg p { margin: 0 0 .6em; } .msg p:last-child { margin-bottom: 0; }
  .msg p.beyond { background: var(--amber-bg); color: var(--amber); padding: 4px 8px; border-radius: var(--r); }
  details.evd summary { cursor: pointer; padding: 6px 0; color: var(--text-3); font-size: 12px; } details.evd .srci:first-of-type { border-top: 1px solid var(--line); }
  .chl { padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 12.5px; line-height: 1.5; cursor: pointer; } .chl:hover { background: var(--hover); } .chl .m { color: var(--text-3); font-size: 11.5px; }
  @media (max-width: 1100px) { #app { grid-template-columns: 220px minmax(0, 1fr) 6px var(--srcp-w, 320px); } }
  @media print {
    header, #side, #srcp, #srcsplit, .noprint { display: none !important; }
    body { overflow: visible; display: block; background: #fff; } #app { display: block; } #main { overflow: visible; }
    .page { max-width: none; padding: 0; } .u.on { background: none; box-shadow: none; }
  }
</style>

<body>
<header>
  <a href="/" target="_top" title="Athenaeum 홈"><img class="brand-mark" src="/logo/mark.svg" alt="Athenaeum"></a>
  <h1>공부</h1>
  <span class="hint">내 서재의 논문만으로 쓰는 교과서 한 장 — 왼쪽 차례로 절마다 읽고, 문장을 누르면 근거인 원문이 오른쪽에, 글을 드래그하면 Claude 에게 묻습니다</span>
  <span style="margin-left:auto"></span>
</header>
<div id="app">
  <aside id="side">
    <div class="newbox" id="newbox">
      <div class="sideh">새 장 쓰기 <button class="act" id="nbTg">접기</button></div>
      <div class="nbb">
        <textarea id="topic" rows="3" placeholder="공부할 주제 (예: 단결정 실리콘 절삭)"></textarea>
        <div class="row">
          <select id="depth" title="읽을 논문의 수"><option value="small">핵심만 · 10편까지</option><option value="mid">보통 · 20편까지</option><option value="wide">넓게 · 36편까지</option></select>
          <select id="effort" title="쓰는 모델"><option value="xhigh">Opus · 엑스트라</option><option value="high">Opus · 보통</option><option value="max">Opus · 최대</option><option value="fable">Fable · 엑스트라</option><option value="fast">Sonnet · 빠름 (대조는 Opus)</option></select>
        </div>
        <button class="primary" id="go">쓰기 시작</button>
        <div class="hint" id="newMsg">서재에 있는 논문만 읽고 씁니다. 논문 20편이면 30~40분쯤 걸리고(핵심만 고르면 절반), 창을 닫아도 계속 씁니다.</div>
      </div>
    </div>
    <div id="chpick"></div>
    <div id="list"></div>
    <div id="outline"></div>
  </aside>
  <main id="main"></main>
  <div id="srcsplit" title="끌어서 오른쪽 칸의 폭을 바꿉니다 · 두 번 누르면 기본 폭"></div>
  <aside id="srcp"></aside>
</div>
<script>
mountUiControls("header");
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
// 논문에서 꺼낸 글: 번역문의 위·아래 첨자 태그와 굵은 글씨 표시는 살리고, 수식 그림 자리는 말로
const rich = s => esc(s).replace(/&lt;(\/?)(sub|sup)&gt;/g, "<$1$2>").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\[\[EQ:[^\]]*\]\]/g, "〔수식〕");
async function api(path, body) { const r = await fetch(path, body ? { method: "POST", body: JSON.stringify(body) } : undefined); return r.json(); }
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v == null ? d : v; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const fmtDate = t => new Date(t * 1000).toLocaleString("ko", { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit" });
const fmtDur = s => s < 60 ? Math.round(s) + "초" : Math.floor(s / 60) + "분" + (Math.round(s % 60) ? " " + Math.round(s % 60) + "초" : "");
const fmtTok = n => n >= 10000 ? (Math.round(n / 1000) / 10) + "만" : String(n || 0);

const STAGES = [["plan", "주제를 풀어 찾을 낱말 정하기"], ["scan", "서재의 모든 문장 훑기"], ["select", "읽을 논문 고르기"], ["read", "논문을 읽고 메모 뽑기"],
  ["figs", "논문의 그림 읽기"], ["outline", "장의 짜임 정하기"], ["write", "절 쓰기"], ["join", "절 사이 잇기"], ["verify", "문장마다 원문과 대조"], ["wrap", "참고문헌 정리"], ["comment", "절마다 Claude 의 생각 달기"]];
const EFFORT = { xhigh: "Opus · 엑스트라", high: "Opus · 보통", max: "Opus · 최대", fable: "Fable · 엑스트라", fast: "Sonnet · 빠름 (대조는 Opus)" };
const VERDICT = { over: "근거보다 나아감", none: "근거가 그 말을 하지 않음", attr: "누가 한 말인지 다름", num: "수치가 근거와 다름", fact: "근거 없는 사실" };
let items = [], cur = null, curId = lsGet("study_last", ""), selKey = "", pollT = null, tickT = null, got = 0, panel = "info", paperSel = null;
let listOpen = false, infoOpen = false;   // 왼쪽 '다른 장' 목록을 펼쳤나 · 오른쪽 '이 장의 기록'을 펼쳐 보이나
const URLP = new URLSearchParams(location.search);   // ?id=장 &view=sec&si=2&u=2.1.0 — 특정 장·절·문장으로 바로 열기 (튜토리얼 화면 찍기에도 씀)
if (URLP.get("id")) curId = URLP.get("id");
let view = { kind: "overview", si: -1 };                      // 가운데 칸에 무엇을 보이나: overview · sec(si) · summary · gaps · terms · refs · map · all
let askCtx = null, askOpen = null, askDraft = "", askedSet = new Set(), chatPollT = null, askTick = null;   // 드래그해 묻기: askCtx = 새로 고른 대목 {quote, keys}, askOpen = 열어 둔 대화 id
let mapStamp = "", mapSel = null, mapZoom = +lsGet("study_map_zoom", 1) || 1, mapMode = "all", mapSi = -1, mapTick = null;   // 마인드맵

$("depth").value = lsGet("study_depth", "mid");
$("effort").value = lsGet("ms_sel_effort", "xhigh");     // 원고의 대화·서재에서 뽑기와 같은 설정
if (!$("effort").value) $("effort").value = "xhigh";
$("depth").onchange = () => lsSet("study_depth", $("depth").value);
$("effort").onchange = () => lsSet("ms_sel_effort", $("effort").value);
function newboxSet(open) { $("newbox").classList.toggle("closed", !open); $("nbTg").textContent = open ? "접기" : "펴기"; lsSet("study_new_open", open ? "1" : "0"); }
$("nbTg").onclick = () => newboxSet($("newbox").classList.contains("closed"));

// ---------- 목록 ----------
async function loadList() {
  let r; try { r = await api("/api/study"); } catch (e) { return; }
  items = r.items || []; renderList();
}
function stateText(x) {
  if (x.status === "running") { const s = STAGES.find(a => a[0] === x.stage); return "<span class='run'>쓰는 중" + (s ? " — " + esc(s[1]) : "") + "</span>"; }
  if (x.status === "done") return x.stats ? "논문 " + x.stats.cited + "편 · 문장 " + x.stats.units + "개" : "다 씀";
  if (x.status === "error") return "<span class='bad'>멈춤 — 이어서 쓸 수 있음</span>";
  return "<span class='bad'>멈춤</span>";
}
// 왼쪽 맨 위: 지금 보는 장 + 「다른 장 ▾」 — 목록은 누를 때만 펼쳐진다 (장의 차례와 섞이지 않게)
function renderPick() {
  const el = $("chpick");
  if (!cur) { el.innerHTML = ""; return; }
  const title = (cur.chapter || {}).title || (cur.plan || {}).title || cur.topic, others = items.filter(x => x.id !== cur.id).length;
  el.innerHTML = "<div class='pick'><div class='pk'>지금 장</div><div class='pt'>" + esc(title) + "</div><div class='pm'>" + fmtDate(cur.t) + (cur.status === "done" && cur.stats ? " · 논문 " + (cur.stats.cited || 0) + "편 · 문장 " + (cur.stats.units || 0) + "개" : "") + "</div>" +
    "<button class='act' id='pickIx' title='쓴 장을 모두 보고 고르기'>" + (view.kind === "index" ? "장 목록 보는 중" : "장 목록 " + items.length + "개 ▸") + "</button></div>";
  const b = $("pickIx"); if (b) b.onclick = () => gotoView("index");
}
function renderList() {
  const others = cur ? items.filter(x => x.id !== curId) : items;
  $("list").classList.toggle("closed", true);   // 옛 목록은 쓰지 않는다 — 가운데의 「장 목록」 보기로(사용자 2026-10-07)
  $("list").innerHTML = (cur ? "<div class='sideh'>" + (others.length ? "다른 장" : "") + "</div>" : "") + (items.length ? others.map(x => "<div class='sitem' data-id='" + esc(x.id) + "'><div class='tt'>" + esc(x.title || x.topic) + "</div>" +
    "<div class='mm'>" + fmtDate(x.t) + " · " + stateText(x) + "</div></div>").join("") : "<div class='hint' style='padding:var(--s3)'>아직 쓴 것이 없습니다.</div>");
  $("list").querySelectorAll(".sitem").forEach(el => el.onclick = () => { listOpen = false; openStudy(el.dataset.id); });
  renderPick();
}
// 장의 차례 (왼쪽) — 원고의 개요처럼 절마다 하나씩, 누르면 가운데에 그 절만
const bodySecs = () => (cur.chapter.sections || []).map((sec, si) => ({ sec, si })).filter(x => x.sec.kind !== "summary");
const secUnits = sec => sec.blocks.reduce((n, b) => n + (b.units || []).length, 0);
function renderOutline() {
  const el = $("outline");
  if (!cur || cur.status !== "done" || !cur.chapter) { el.innerHTML = cur ? "<div class='sideh'>지금 장</div><div class='sitem sel'><div class='tt'>" + esc((cur.plan || {}).title || cur.topic) + "</div><div class='mm'>" + stateText(cur) + "</div></div>" : ""; return; }
  const ch = cur.chapter, on = (k, si) => view.kind === k && (si == null || view.si === si) ? " on" : "";
  const item = (k, si, cls, no, title, n) => "<div class='oi" + cls + on(k, si) + "' data-v='" + k + "' data-si='" + (si == null ? -1 : si) + "'>" + (no ? "<span class='no'>" + no + "</span>" : "") + "<span class='t'>" + esc(title) + "</span>" + (n ? "<span class='n'>" + n + "</span>" : "") + "</div>";
  const summ = ch.sections.find(x => x.kind === "summary");
  el.innerHTML = "<div class='sideh'>장의 차례 <button class='act' id='olTitle' title='이 장의 개요로'>개요</button></div>" +
    item("overview", null, "", "", "개요", "") +
    item("map", null, " fig", "", "마인드맵 (그림)", cur.map ? "" : cur.map_pending ? "만드는 중" : "아직 없음") +
    item("deck", null, " fig", "", "발표 자료 (PPT)", (cur.decks || []).length ? cur.decks.length + "개" : cur.deck_pending ? "만드는 중" : "") +
    ((cur.chats || []).length ? item("chats", null, " sub", "", "Claude 에게 물은 것", cur.chats.length) : "") +
    bodySecs().map((x, i) => item("sec", x.si, "", i + 1, x.sec.title, secUnits(x.sec) + "문장")).join("") +
    (summ ? item("summary", null, " sub", "", "핵심 정리", secUnits(summ) + "줄") : "") +
    ((ch.gaps || []).length ? item("gaps", null, " sub", "", "이 서재로는 답하지 못한 것", ch.gaps.length) : "") +
    ((ch.terms || []).length ? item("terms", null, " sub", "", "용어", ch.terms.length) : "") +
    item("refs", null, " sub", "", "참고문헌", (cur.stats || {}).cited || "") +
    item("all", null, " sub", "", "전체를 한 번에 (인쇄용)", "");
  el.querySelectorAll(".oi").forEach(o => o.onclick = () => gotoView(o.dataset.v, +o.dataset.si));
  $("olTitle").onclick = () => gotoView("overview");
}
function gotoView(kind, si) {
  view = { kind, si: kind === "sec" ? si : -1 };
  if (kind === "map" && si >= 0) { mapMode = "sec"; mapSi = si; }
  renderMain(); $("main").scrollTop = 0;
}

// ---------- 열기 · 살피기 ----------
async function openStudy(id) {
  curId = id; lsSet("study_last", id); selKey = ""; panel = "info"; infoOpen = false; askCtx = null; askOpen = null; askDraft = ""; view = { kind: "overview", si: -1 }; mapStamp = ""; mapSel = null; clearTimeout(pollT); clearTimeout(chatPollT);
  await refresh(true); renderList();
}
async function refresh(first) {
  if (!curId) { cur = null; renderMain(); renderPanel(); renderOutline(); return; }
  let st; try { st = await api("/api/study/get?id=" + encodeURIComponent(curId)); } catch (e) { pollT = setTimeout(refresh, 5000); return; }
  if (st.error && !st.id) { cur = null; curId = ""; lsSet("study_last", ""); renderMain(); renderPanel(); renderOutline(); return; }
  const was = cur && cur.id === st.id ? cur.status : "";
  cur = st; got = Date.now();
  const ms = (st.map_pending ? "p" + st.map_pending : "") + ((st.map || {}).t || "") + (st.map_error || "") + (st.comment_pending ? "c" : "") + ((st.stats || {}).comments || 0) + (st.comment_error || "") + (st.deck_pending ? "d" + st.deck_pending : "") + ((st.decks || []).length) + (st.deck_error || "");
  if (first || st.status !== "done" || was !== "done") { renderMain(); renderPanel(); }
  else if (ms !== mapStamp) renderMain();
  if (ms !== mapStamp) { mapStamp = ms; renderOutline(); }
  if (first) { renderOutline(); newboxSet(lsGet("study_new_open", st.status === "done" ? "0" : "1") === "1"); }
  if (was && was !== st.status) loadList();
  clearTimeout(pollT);
  if (st.status === "running" || st.map_pending || st.comment_pending || st.deck_pending) pollT = setTimeout(refresh, 4000);
  if (st.status === "done" && (st.chats || []).some(c => c.pending)) startChatPoll();
}

// ---------- 가운데 ----------
// 「이 서재로는 답하지 못한 것」 → 연구 노트의 새 주제로 (사용자 2026-10-08: '이런 연구 주제는 어때? 하고 같이 토의')
function noteFromGap(i) {
  const g = ((cur.chapter || {}).gaps || [])[i]; if (!g) return; const t = (cur.chapter || {}).title || cur.topic || "";
  window.open("/notes?new=1&from=study&fid=" + encodeURIComponent(cur.id) + "&ftitle=" + encodeURIComponent(t) + "&title=" + encodeURIComponent(g.slice(0, 80)) +
    "&text=" + encodeURIComponent("공부 장 「" + t + "」 의 '이 서재로는 답하지 못한 것':\n" + g) + "&ask=1", "athenaeum_notes", "width=1280,height=900");
}
function renderMain() {
  const m = $("main"); clearInterval(tickT); clearInterval(mapTick);
  if (view.kind === "index") { m.innerHTML = indexHtml(); bindIndex(); renderOutline(); renderPick(); return; }
  if (!cur) { m.innerHTML = emptyHtml(); renderOutline(); return; }
  if (cur.status === "done" && cur.chapter) { m.innerHTML = viewHtml(); bindChapter(); renderOutline(); return; }
  m.innerHTML = runHtml(); bindRun(); renderOutline();
  if (cur.status === "running") tickT = setInterval(tick, 1000);
}
// 장 목록 — 블로그 글 고르듯 (제목 · 날짜 · 편수·문장·그림·표 · 주제). 누르면 그 장의 개요로
function indexHtml() {
  const chats = allChats();
  return "<div class='page ix'><div class='ixh'><h1>공부</h1><span class='hint'>" + items.length + "장 · 새 장은 왼쪽 「새 장 쓰기」</span></div>" +
    (chats.length ? "<div class='ixq noprint'><input id='ixFind' placeholder='Claude 에게 물은 것 찾기 — 모든 장의 대화 " + chats.length + "개에서, 물음·고른 대목·절 이름의 낱말로' autocomplete='off'></div><div id='ixChats'>" + ixChatsHtml(chats, ixQuery) + "</div>" : "") +
    (items.length ? items.map(x => { const s = x.stats || {}; return "<article class='ixi' data-id='" + esc(x.id) + "'><h2>" + esc(x.title || x.topic) + "</h2>" +
      "<div class='ixm'>" + (cur && cur.id === x.id ? "<span class='now'>지금 장</span> · " : "") + fmtDate(x.t) + (x.status === "done" ? " · 논문 " + (s.cited || 0) + "편 · 문장 " + (s.units || 0) + (s.figs ? " · 그림 " + s.figs : "") + (s.tables ? " · 표 " + s.tables : "") + (s.comments ? " · Claude 의 생각" : "") + ((x.chats || []).length ? " · 대화 " + x.chats.length : "") : " · " + stateText(x)) + "</div>" +
      (x.topic && x.topic !== x.title ? "<div class='ixt'>주제: " + esc(x.topic) + "</div>" : "") + "</article>"; }).join("") : "<div class='hint'>아직 쓴 장이 없습니다. 왼쪽에서 주제를 적고 「쓰기 시작」.</div>") + "</div>";
}
function bindIndex() {
  const m = $("main");
  m.querySelectorAll(".ixi").forEach(a => a.onclick = () => openStudy(a.dataset.id));
  const rows = () => m.querySelectorAll(".ixc").forEach(a => a.onclick = () => openStudyChat(a.dataset.sid, a.dataset.cid));
  rows();
  const f = $("ixFind"); if (f) f.oninput = () => { ixQuery = f.value; $("ixChats").innerHTML = ixChatsHtml(allChats(), ixQuery); rows(); };
}
/* 대화 찾기 (사용자 2026-10-09: '기존에 했던 대화 찾기가 너무 빡세다') — 장 목록에서 모든 장의 대화를 낱말로 찾고, 누르면 그 장의 그 대목으로 가서 대화를 편다 */
let ixQuery = "", cvQuery = "";
const allChats = () => items.flatMap(x => (x.chats || []).map(c => Object.assign({ sid: x.id, stitle: x.title || x.topic }, c))).sort((a, b) => (b.t || 0) - (a.t || 0));
const words = q => (q || "").trim().toLowerCase().split(/\s+/).filter(Boolean);
function ixChatsHtml(all, q) {
  const w = words(q);
  const hit = w.length ? all.filter(c => { const t = ((c.q || "") + " " + (c.quote || "") + " " + (c.sec || "") + " " + c.stitle).toLowerCase(); return w.every(x => t.includes(x)); }) : all.slice(0, 6);
  if (!hit.length) return "<div class='hint'>맞는 대화가 없습니다.</div>";
  return "<div class='hint'>" + (w.length ? "맞는 대화 " + hit.length + "개" : "최근에 물은 것 " + hit.length + "개 — 위 칸에 낱말을 적으면 모든 장에서 찾습니다") + "</div>" +
    hit.map(c => "<div class='ixc' data-sid='" + esc(c.sid) + "' data-cid='" + esc(c.id) + "'><div class='q'>" + esc(c.q || "(물음 없음)") + "</div><div class='m'>" + esc(c.stitle) + (c.sec ? " · " + esc(c.sec) : "") + " · " + fmtDate(c.t) +
      (c.pending ? " · <span style='color:var(--accent)'>Claude 생각 중</span>" : " · 답 " + (c.n || 0)) + (c.quote ? " · 「" + esc(c.quote.slice(0, 60)) + (c.quote.length > 60 ? "…" : "") + "」" : "") + "</div></div>").join("");
}
async function openStudyChat(sid, cid) {
  if (!cur || cur.id !== sid) await openStudy(sid);
  const c = ((cur || {}).chats || []).find(x => x.id === cid); if (!c) return;
  if ((c.keys || []).length) { try { gotoUnit(c.keys[0]); } catch (e) {} }
  openChat(cid);
}
function emptyHtml() {
  return "<div class='empty'><h2>내 서재로 공부하기</h2>" +
    "<p>왼쪽에 주제를 적으면, 서재에 있는 논문을 읽어 전공책의 한 장처럼 정리합니다.</p>" +
    "<ol><li>서재의 모든 문장을 훑어 그 주제를 다룬 논문을 찾습니다.</li><li>고른 논문을 한 편씩 읽고, 주제에 관한 사실을 근거 문장의 번호와 함께 메모로 뽑습니다.</li>" +
    "<li>메모를 절로 짜서 교과서 글을 씁니다.</li><li>쓴 문장을 하나씩 논문의 원문 문장과 대조합니다. 원문이 말하지 않는 문장은 고치고, 고쳐도 맞지 않으면 뺍니다. 수치는 프로그램이 따로 대조합니다.</li></ol>" +
    "<p>다 쓴 장은 왼쪽 차례로 절마다 읽습니다. 문장을 누르면 그 근거인 원문 문장이 오른쪽에 보이고, 글을 드래그하면 그 대목을 놓고 Claude 에게 물을 수 있습니다. 마인드맵은 장을 한 그림으로 요약합니다.</p>" +
    "<p class='hint'>서재에 없는 내용은 싣지 않습니다. 서재의 논문으로 답하지 못한 물음은 장 끝에 따로 적습니다.</p></div>";
}

// ---- 쓰는 중 / 멈춤
const fastRun = () => ((cur.opts || {}).effort) === "fast";

  el.querySelectorAll("a[target='athenaeum_reader']").forEach(a => a.onclick = ev => { ev.preventDefault(); const w = window.open(a.href, "athenaeum_reader"); if (w) { try { w.focus(); } catch (e) {} } });
}
function bindChatLinks(el) {
  bindReaderLinks(el);
  el.querySelectorAll("[data-chat]").forEach(a => a.onclick = ev => { ev.preventDefault(); openChat(a.dataset.chat); });
  el.querySelectorAll("[data-paper]").forEach(a => a.onclick = ev => { ev.preventDefault(); openPaper(+a.dataset.paper); });
  el.querySelectorAll("[data-unit]").forEach(a => a.onclick = ev => { ev.preventDefault(); gotoUnit(a.dataset.unit); });
}
// 읽은 논문 하나 → 장에서 그 논문이 받치는 문장(절마다)과 그 논문에서 가져온 원문 문장 (사용자 2026-10-06: '우측에 읽은 논문 누르면 언급된 부분 볼 수 있게')
function openPaper(pi) { paperSel = pi; panel = "paper"; renderPanel(); }
function paperPanel() {
  const pi = paperSel, p = cur.papers[pi]; if (!p) { panel = "info"; return infoPanel(); }
  const hits = [];
  cur.chapter.sections.forEach((sec, si) => sec.blocks.forEach((b, bi) => (b.units || []).forEach((u, ui) => { if ((u.src || []).some(k => +k.split(":")[0] === pi)) hits.push({ key: si + "." + bi + "." + ui, u, si }); })));
  const num = k => +(k.split(":")[1].replace(/\D/g, "") || 0);
  const srcKeys = Object.keys(cur.src || {}).filter(k => +k.split(":")[0] === pi).sort((a, b) => num(a) - num(b));
  let h = "<div class='sec'>논문</div><div class='spq'><b>" + (p.n ? "[" + p.n + "] " : "") + esc(p.short) + "</b> · " + (p.top ? "★ " : "") + esc(p.journal) + " " + esc(p.year) + "<div class='hint' style='margin-top:4px;line-height:1.5'>" + esc(p.title) + "</div>" +
    (p.about ? "<div style='margin-top:6px;line-height:1.55;font-size:13px'>" + esc(p.about) + "</div>" : "") +
    "<div class='noprint' style='margin-top:4px'><a class='act' target='athenaeum_reader' href='/view?file=" + encodeURIComponent(p.file) + "&kind=summary'>요약</a><a class='act' target='athenaeum_reader' href='/view?file=" + encodeURIComponent(p.file) + "&kind=translation'>번역</a></div></div>";
  h += "<div class='sec'>이 논문이 받치는 장의 문장 " + hits.length + "개 <span style='font-weight:400;text-transform:none'>— 누르면 본문으로</span></div>";
  let lastSi = -1;
  hits.forEach(x => { if (x.si !== lastSi) { lastSi = x.si; const sec = cur.chapter.sections[x.si]; h += "<div class='hint' style='padding:8px 0 2px;font-weight:600;color:var(--text-2)'>" + esc(sec.kind === "summary" ? "핵심 정리" : sec.title) + "</div>"; } h += "<div class='chl' data-unit='" + x.key + "'>" + esc(x.u.t) + "</div>"; });
  if (!hits.length) h += "<div class='hint'>이 논문은 장의 글에 쓰이지 않았습니다.</div>";
  if (srcKeys.length) h += "<details class='evd'><summary>이 논문에서 가져온 원문 문장 " + srcKeys.length + "개</summary>" + srcItemsHtml(srcKeys.map(k => [k, cur.src[k]])) + "</details>";
  h += "<div class='row noprint' style='padding-top:var(--s3)'><button class='act' id='paperClose'>닫기</button></div>";
  return h;
}
function chatListHtml(list) {
  return list.map(c => "<div class='chl' data-chat='" + esc(c.id) + "'>" + esc(((c.thread || [])[0] || {}).text || "").slice(0, 90) + "<div class='m'>" + fmtDate(c.t) + " · 「" + esc(c.quote.slice(0, 40)) + (c.quote.length > 40 ? "…" : "") + "」" + (c.pending ? " · <span style='color:var(--accent)'>Claude 생각 중</span>" : " · 답 " + (c.thread || []).filter(m => m.role === "claude").length) + "</div></div>").join("");
}
function unitPanel(u, key) {
  const src = (u.src || []).map(k => [k, cur.src[k]]).filter(x => x[1]);
  const mine = (cur.chats || []).filter(c => (c.keys || []).includes(key));
  const tail = (mine.length ? "<div class='sec'>이 문장을 두고 나눈 대화 " + mine.length + "개</div>" + chatListHtml(mine) : "") +
    "<div class='hint' style='padding-top:var(--s3);line-height:1.6'>↑ ↓ 로 앞뒤 문장으로 넘어갑니다. 글을 드래그하면 Claude 에게 물을 수 있습니다.</div>";
  const head = "<div class='sec'>고른 문장</div><div class='spq'>" + esc(u.t) + "</div>";
  if (!src.length) return head + "<div class='hint' style='padding-top:var(--s3);line-height:1.6'>앞뒤의 사실을 잇는 문장입니다. 근거 문장을 달지 않았고, 새 사실을 담지 않았는지 대조했습니다.</div>" + tail;
  return head + "<div class='sec'>근거 — 논문의 원문 문장 " + src.length + "개</div>" + (u.fixed ? "<div class='hint'>원문과 대조하며 한 번 고쳐 쓴 문장입니다.</div>" : "") + srcItemsHtml(src) + tail;
}
function srcItemsHtml(src) {
  return src.map(([k, s]) => { const p = paperOf(k), sid = k.split(":")[1], can = /^s\d+$/.test(sid);
      return "<div class='srci'><div class='sm'><b><a href='#' data-paper='" + (+k.split(":")[0]) + "' title='이 논문이 언급된 문장 보기' style='color:inherit'>[" + (p.n || "") + "] " + esc(p.short) + "</a></b> · " + esc(p.journal) + (s.page ? " · p." + s.page : "") + (s.sec ? " · " + esc(s.sec) : "") +
        (s.own ? "" : " · <span class='tag' title='이 논문이 자기 결과가 아니라 다른 연구를 전한 문장입니다'>다른 연구를 전한 문장</span>") + "</div>" +
        "<div class='en'>" + esc(s.en) + "</div>" + (s.ko ? "<div class='ko'>" + rich(s.ko) + "</div>" : "") +
        ((s.cited || []).length ? "<div class='cited'>이 문장이 인용한 문헌: " + s.cited.map(c => "[" + esc(c.n) + "] " + esc(c.line)).join(" / ") + "</div>" : "") +
        (p.unitwarn ? "<div class='cited' style='color:var(--amber)'>이 논문의 PDF 는 μ 글자가 깨져 꺼내집니다 — 원문의 'mm'·'lm' 는 μm 일 수 있습니다.</div>" : "") +
        "<a class='act' target='athenaeum_reader' href='/view?file=" + encodeURIComponent(p.file) + (can ? "&kind=translation&sent=" + sid : "") + "'>" + (can ? "논문에서 이 문장 보기" : "논문 열기") + "</a></div>"; }).join("");
}
function infoPanel() {
  const s = cur.stats || {}, sc = cur.scan || {}, papers = cur.papers || [], rm = cur.removed || [], tok = cur.tok || {};
  const kv = (a, b) => "<div class='kv'><span>" + a + "</span><span>" + b + "</span></div>";
  const read = papers.filter(p => p.read);
  // 기본은 조용한 칸(사용자 2026-10-07: '읽은 논문·이 장의 기록이 계속 우측에 떠 있는 것도 조금') — 기록과 읽은 논문은 접어 두고, 「이 장의 기록」 단추로 열면 펼친다
  let h = "<div class='sec'>근거</div><div class='hint' style='line-height:1.6'>문장을 누르면 그 근거인 원문 문장이 여기에 보입니다. 원문은 논문 파일에서 꺼낸 그대로입니다. 표의 행과 그림 설명도 누를 수 있고, 글을 드래그하면 Claude 에게 물을 수 있습니다.</div>" +
    "<details class='evd'" + (infoOpen || panel === "removed" ? " open" : "") + "><summary>이 장의 기록</summary>" +
    kv("훑은 서재", "논문 " + (sc.files || 0) + "편 · 문장 " + (sc.sents || 0).toLocaleString() + "개") +
    kv("읽은 논문", read.length + "편 (통째로 " + read.filter(p => p.mode === "full").length + " · 맞은 대목만 " + read.filter(p => p.mode !== "full").length + ")") +
    kv("뽑은 메모", (s.notes || 0) + "개") +
    kv("실은 문장", (s.units || 0) + "개 = 사실 " + (s.fact || 0) + " + 잇는 말 " + (s.bridge || 0)) +
    (s.claims != null ? kv("짜임", "논지 " + (s.claims || 0) + " · 두 논문 이상이 받치는 문장 " + (s.multi || 0) + " · 표 " + (s.tables || 0) + " · 그림 " + (s.figs || 0) + " · 번외 문장 " + (s.extra || 0)) : "") +
    ((s.journals || []).length ? kv("출처 저널", s.journals.map(j => (j.top ? "★ " : "") + esc(j.abbr) + " " + j.n).join(" · ") + " <span class='hint'>(★ 우선 저널 — ⚙ 설정 → 연결)</span>") : "") +
    kv("근거 원문", (s.srcs || 0) + "문장 · 논문 " + (s.cited || 0) + "편") +
    kv("원문과 대조", "고쳐 쓴 문장 " + (s.fixed || 0) + (s.joined ? " · 절 사이 잇는 문장 손질 " + s.joined : "") + " · 뺀 문장 " + rm.length + (rm.length ? " <button class='act' id='rmBtn' style='padding:0 4px'>" + (panel === "removed" ? "접기" : "보기") + "</button>" : "")) +
    kv("걸린 시간", fmtDur(cur.sec || 0)) + kv("모델", esc(Object.keys(cur.models || {}).join(", ") || EFFORT[(cur.opts || {}).effort] || "")) +
    kv("읽은 토큰", fmtTok(tok.in || 0) + (tok.cached ? " (그중 캐시 " + fmtTok(tok.cached) + ")" : "") + " · 호출 " + (cur.calls || 0) + "번");
  if (panel === "removed") h += "<div class='sec'>대조에서 뺀 문장 " + rm.length + "개</div><div class='hint' style='line-height:1.5'>원문 문장이 받치지 않아 장에 싣지 않은 문장입니다.</div>" +
    rm.map(x => "<div class='rm'><div>" + esc(x.t) + "</div><div class='w'>" + esc(VERDICT[x.v] || "") + " — " + esc(x.why) + "</div>" +
      (x.tried ? "<div class='s'>고쳐 써 본 문장: " + esc(x.tried) + (x.why2 ? " — 다시 대조에서: " + esc(x.why2) : "") + "</div>" : "") + "<div class='s'>" + esc(x.sec || "") + "</div></div>").join("");
  h += "</details>";
  h += "<details class='evd'><summary>읽은 논문 " + read.length + "편 — 누르면 그 논문이 언급된 문장</summary>" + papers.map((p, i) => "<div class='kv'><span>" + (p.n ? "[" + p.n + "]" : p.read ? "읽음" : "—") + "</span><span><a href='#' data-paper='" + i + "' title='" + esc(p.title) + "'>" + esc(p.short) + "</a> <span class='hint'>" + (p.top ? "★ " : "") + esc(p.journal || "") + " · " +
      (p.mode === "full" ? "통째로" : p.read ? "맞은 대목" : "읽지 못함") + (p.read ? " · 메모 " + (p.nnotes || 0) : "") + (p.read && !p.n ? " · 장에 쓰이지 않음" : "") + "</span></span></div>").join("") + "</details>";
  const chats = (cur.chats || []).slice().reverse();
  if (chats.length) h += "<details class='evd' open><summary>Claude 와 나눈 대화 " + chats.length + "개</summary>" + chatListHtml(chats) + "</details>";
  return h;
}

// ---------- 시작 ----------
// 쓰기 시작 — 먼저 주제가 한 장에 담기에 넓은지 본다(Sonnet 20초쯤). 넓으면 좁힌 주제를 골라 시작 (사용자 2026-10-09: '분야가 너무 넓으면 알아서 좁히거나 되물음 하나')
async function startStudy(topic) {
  $("go").disabled = true;
  let r; try { r = await api("/api/study", { op: "start", topic, depth: $("depth").value, effort: $("effort").value }); } catch (e) { r = { error: "서버 연결 실패" }; }
  $("go").disabled = false;
  if (r.error) { $("newMsg").textContent = "⚠ " + r.error; return; }
  $("topic").value = ""; $("newMsg").innerHTML = "서재에 있는 논문만 읽고 씁니다. 논문 20편이면 30~40분쯤 걸리고(핵심만 고르면 절반), 창을 닫아도 계속 씁니다."; await loadList(); openStudy(r.id);
}
$("go").onclick = async () => {
  const topic = $("topic").value.trim(); if (!topic) { $("topic").focus(); return; }
  if ($("go").dataset.skip === topic) { $("go").dataset.skip = ""; return startStudy(topic); }
  $("go").disabled = true; $("newMsg").textContent = "주제가 한 장에 담기에 넓은지 서재를 훑어 봅니다 (20초쯤)…";
  let sc; try { sc = await api("/api/study", { op: "scope", topic, depth: $("depth").value }); } catch (e) { sc = { error: "서버 연결 실패" }; }
  $("go").disabled = false;
  if (sc.error) { $("newMsg").textContent = "⚠ " + sc.error; return; }
  if (!sc.broad || !(sc.options || []).length) return startStudy(topic);
  const opts = sc.options.map((o, i) => "<label style='display:block;padding:4px 0;line-height:1.45'><input type='radio' name='scopeopt' value='" + i + "'" + (i === 0 ? " checked" : "") + "> <b>" + esc(o.topic) + "</b>" + (o.n ? " <span style='color:var(--text-3)'>" + o.n + "편</span>" : "") + (o.focus ? "<div style='color:var(--text-3);margin-left:20px'>" + esc(o.focus) + "</div>" : "") + "</label>").join("") +
    "<label style='display:block;padding:4px 0'><input type='radio' name='scopeopt' value='all'> 이대로 넓게 (서재 " + sc.n + "편 가운데 " + sc.cap + "편까지 읽음)</label>";
  $("newMsg").innerHTML = "<div style='color:var(--amber);margin-bottom:4px'>이 주제는 서재 " + sc.n + "편에 걸립니다 — " + esc(sc.why || "한 장에 담기엔 넓어 보입니다") + "</div>" + opts +
    "<div style='margin-top:6px'><button class='primary' id='scopeGo'>이 주제로 쓰기</button> <span class='hint'>고른 주제는 위 칸에 채워지니 고쳐도 됩니다</span></div>";
  $("newMsg").querySelectorAll("input[name=scopeopt]").forEach(inp => inp.onchange = () => { const v = inp.value; $("topic").value = v === "all" ? topic : sc.options[+v].topic; });
  $("topic").value = sc.options[0].topic;
  $("scopeGo").onclick = () => { const t = $("topic").value.trim(); if (!t) return; $("go").dataset.skip = t; startStudy(t); };
};
$("topic").addEventListener("keydown", e => { if (e.key === "Enter" && e.ctrlKey) $("go").click(); });
(function srcpResize() {   // 오른쪽 Claude 칸의 폭 — 가장자리를 끌어 바꾼다 (사용자 2026-10-08: 'Claude 창 글꼴이나 창 크기 조절')
  const sp = $("srcsplit"); if (!sp) return;
  const apply = w => document.documentElement.style.setProperty("--srcp-w", Math.round(w) + "px");
  const saved = +lsGet("study_srcp_w", "0"); if (saved) apply(saved);
  sp.addEventListener("pointerdown", e => {
    e.preventDefault(); sp.classList.add("drag"); try { sp.setPointerCapture(e.pointerId); } catch (e2) {} let w = 0;
    const move = ev => { w = Math.min(Math.max(window.innerWidth - ev.clientX, 260), Math.max(300, window.innerWidth - 500)); apply(w); };
    const up = () => { sp.classList.remove("drag"); sp.removeEventListener("pointermove", move); sp.removeEventListener("pointerup", up); if (w) lsSet("study_srcp_w", String(w)); };
    sp.addEventListener("pointermove", move); sp.addEventListener("pointerup", up);
  });
  sp.ondblclick = () => { document.documentElement.style.removeProperty("--srcp-w"); lsSet("study_srcp_w", "0"); };
})();
(async () => { await loadList(); if (curId && !items.some(x => x.id === curId)) curId = ""; if (!curId && items.length) curId = items[0].id; newboxSet(lsGet("study_new_open", items.length ? "0" : "1") === "1"); if (URLP.get("topic")) { $("topic").value = URLP.get("topic"); newboxSet(true); }   /* 연구 노트의 「이 주제로 공부」 — 한 줄 주석(//)을 쓰면 이 줄 뒤의 refresh(true) 가 지워진다(2026-10-08 저녁에 그렇게 돼 장이 비어 보였다) */ await refresh(true); renderList(); if (!URLP.get("id")) gotoView("index");
  if (URLP.get("view") && cur && cur.status === "done") { gotoView(URLP.get("view"), +(URLP.get("si") || -1)); if (URLP.get("u")) selectUnit(URLP.get("u"), true); }
  if (URLP.get("chat") && cur && cur.status === "done") openStudyChat(cur.id, URLP.get("chat")); })();
setInterval(() => { if (!cur || cur.status !== "running") loadList(); }, 30000);
</script>
