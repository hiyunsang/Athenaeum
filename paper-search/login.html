<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/ui.css">
<style>
  /* 휴대폰 화면(m.html)과 같은 결 — 큰 입력 칸과 단추, 둥근 모서리 */
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--surface); -webkit-tap-highlight-color: transparent; }
  .box { max-width: 340px; margin: 18vh auto 0; padding: 0 28px; text-align: center; }
  .box img { height: 56px; }
  .box h1 { font-family: var(--font-serif); font-size: 26px; font-weight: 500; letter-spacing: -.01em; margin: 10px 0 30px; }
  .box input { width: 100%; box-sizing: border-box; height: 50px; font-size: 17px; padding: 0 16px; border: 0; border-radius: 14px; background: rgba(118, 118, 128, .14); color: var(--text); -webkit-appearance: none; appearance: none; }
  .box input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .box button { width: 100%; height: 50px; margin-top: 12px; font-size: 17px; font-weight: 600; border: 0; border-radius: 14px; background: var(--accent); color: var(--surface); }
  .box button:disabled { opacity: .5; }
  #msg { margin-top: 12px; font-size: 14px; color: var(--red); min-height: 1.5em; }
  .box .hint { margin-top: 22px; font-size: 13px; line-height: 1.6; }
</style>
</head>
<body>
<form class="box" id="f">
  <img src="/logo/mark.svg" alt="">
  <h1>Athenaeum</h1>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button class="primary" id="go" type="submit">로그인</button>
  <div id="msg"></div>
  <div class="hint">이 기기는 60일 동안 로그인된 채로 있습니다.</div>
</form>
<script>
/* 다른 기기에서 쓰기 (2026-11-06): 이 PC 밖에서 온 요청은 여기서 비밀번호로 로그인한다. 비밀번호는 Athenaeum 이 깔린 PC 의 ⚙ 설정 → 기기 에서 정한다 */
const next = (() => {
  const n = new URLSearchParams(location.search).get("next") || "";
  if (/^\/(?![\/\\])/.test(n)) return n;                         /* 이 사이트 안의 경로만 */
  return /Mobi|Android|iPhone/.test(navigator.userAgent) ? "/m" : "/";
})();
const msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  if (!pw.value) { pw.focus(); return; }
  go.disabled = true; msg.textContent = "";
  let r;
  try { r = await (await fetch("/api/login", { method: "POST", body: JSON.stringify({ password: pw.value }) })).json(); } catch (err) { r = { error: "서버에 닿지 못했습니다" }; }
  go.disabled = false;
  if (r && r.ok) { location.replace(next); return; }
  msg.textContent = (r && r.error) || "로그인하지 못했습니다"; pw.value = ""; pw.focus();
};
</script>
</body>
</html>
