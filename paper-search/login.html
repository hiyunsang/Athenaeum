<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>로그인 · Athenaeum</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="apple-touch-icon" href="/logo/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/ui.css">
<style>
  body { background: var(--surface); }
  .box { max-width: 320px; margin: 20vh auto 0; padding: 0 var(--s6); text-align: center; }
  .box img { height: 46px; }
  .box h1 { font-size: 15px; font-weight: 600; letter-spacing: .1em; margin: var(--s3) 0 var(--s6); }
  .box input { width: 100%; box-sizing: border-box; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r); background: var(--surface); color: var(--text); }
  .box button { width: 100%; margin-top: var(--s3); font-size: 15px; padding: 10px; }
  #msg { margin-top: var(--s3); font-size: 13px; color: var(--red); min-height: 1.5em; }
  .box .hint { margin-top: var(--s6); line-height: 1.6; }
</style>
</head>
<body>
<form class="box" id="f">
  <img src="/logo/mark.svg" alt="">
  <h1>ATHENAEUM</h1>
  <input type="password" id="pw" placeholder="비밀번호" autocomplete="current-password" autofocus>
  <button class="primary" id="go" type="submit">로그인</button>
  <div id="msg"></div>
  <div class="hint">이 기기는 60일 동안 로그인된 채로 있습니다.</div>
</form>
<script>
/* 다른 기기에서 쓰기 (2026-11-06): 이 PC 밖에서 온 요청은 여기서 비밀번호로 로그인한다. 비밀번호는 Athenaeum 이 깔린 PC 의 ⚙ 설정 → 기기 에서 정한다 */
const next = (() => {
  const n = new URLSearchParams(location.search).get("next") || "";
  if (/^\/(?![\/\\])/.test(n)) return n;                         /* 이 사이트 안의 경로만 */
  return /Mobi|Android|iPhone/.test(navigator.userAgent) ? "/m" : "/";
})();
const msg = document.getElementById("msg"), go = document.getElementById("go"), pw = document.getElementById("pw");
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  if (!pw.value) { pw.focus(); return; }
  go.disabled = true; msg.textContent = "";
  let r;
  try { r = await (await fetch("/api/login", { method: "POST", body: JSON.stringify({ password: pw.value }) })).json(); } catch (err) { r = { error: "서버에 닿지 못했습니다" }; }
  go.disabled = false;
  if (r && r.ok) { location.replace(next); return; }
  msg.textContent = (r && r.error) || "로그인하지 못했습니다"; pw.value = ""; pw.focus();
};
</script>
</body>
</html>
